const EVENT_TYPES = [['session', 'Session'], ['evaluation', 'Evaluation'], ['consult', 'Consult'], ['other', 'Other']];
const EVENT_STATUS = [['scheduled', 'Scheduled'], ['completed', 'Completed'], ['cancelled', 'Cancelled'], ['noshow', 'No-show']];
const typeLabel = t => (EVENT_TYPES.find(x => x[0] === t) || ['', 'Other'])[1];
const statusLabel = t => (EVENT_STATUS.find(x => x[0] === t) || ['', 'Scheduled'])[1];
const typeColor = t => `var(--c-${['session', 'evaluation', 'consult'].includes(t) ? t : 'other'})`;

function eventTitle(e) {
  if (e.title) return e.title;
  const names = (e.athleteIds || []).map(id => getAthlete(id)).filter(Boolean);
  if (names.length === 1) return athleteName(names[0]);
  if (names.length > 1) return `${athleteName(names[0], true)} + ${names.length - 1} more`;
  return typeLabel(e.type);
}
function eventAthletes(e) { return (e.athleteIds || []).map(getAthlete).filter(Boolean); }
function statusBadge(e) {
  if (e.status === 'completed') return `<span class="badge good">${icon('check', 'sm')}Done</span>`;
  if (e.status === 'cancelled') return `<span class="badge">Cancelled</span>`;
  if (e.status === 'noshow') return `<span class="badge bad">No-show</span>`;
  return '';
}
function eventRow(e, { showDate = false } = {}) {
  const ath = eventAthletes(e);
  const sub = [e.title && ath.length ? ath.map(a => athleteName(a, true)).join(', ') : '', e.location].filter(Boolean).join(' · ');
  return `<button class="row" data-act="openEvent" data-id="${e.id}">
    <span class="bar-left" style="background:${typeColor(e.type)}"></span>
    <span class="row-time">${showDate ? `<span style="display:block">${esc(fmtDate(e.date, { month: 'short', day: 'numeric' }))}</span>` : ''}${e.start ? esc(fmtTime(e.start)) : 'All day'}${e.start && !showDate ? `<span class="end">${esc(fmtTime(addMin(e.start, e.duration)))}</span>` : ''}</span>
    <span class="row-main"><span class="row-title" style="${e.status === 'cancelled' ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(eventTitle(e))}</span>
      <span class="row-sub">${esc(sub || typeLabel(e.type))}</span></span>
    <span style="display:flex;gap:6px;align-items:center">${statusBadge(e)}<span class="badge t-${e.type}">${esc(typeLabel(e.type))}</span></span>
  </button>`;
}

    <div class="grid two" style="${hasData ? '' : 'margin-top:16px'}">

function recentTestRow(t) {

A.completeToday = async () => {

/* ---------------- Calendar ---------------- */
ROUTES.calendar = () => {
  const C = UI.cal;
  C.cursor ||= today(); C.sel ||= today();

  const filt = e => C.filter === 'all' || e.type === C.filter;
  let title, body;
  const head = (label) => `
    <div class="cal-bar">

      return chips + more + wo + dots;
    }, 'calSelect');
    body = head(title) + grid + dayAgenda(C.sel, filt, C.programs);
  } else if (C.mode === 'week') {
    const w0 = startOfWeek(C.cursor);
    const w6 = addDays(w0, 6);

      return `<div class="week-col ${ds === T ? 'today' : ''}">
        <div class="wh" data-act="newEvent" data-date="${ds}" title="Add to this day"><b>${parseDS(ds).getDate()}</b><span>${esc(fmtDow(ds))}</span><span class="grow" style="flex:1"></span>${icon('plus', 'sm')}</div>
        ${evs.map(e => `<div class="wk-ev ${e.status === 'completed' ? 'done' : ''} ${e.status === 'cancelled' ? 'cancelled' : ''}" style="--c:${typeColor(e.type)}" data-act="openEvent" data-id="${e.id}"><b>${e.start ? esc(fmtTime(e.start)) : 'All day'}</b>${esc(eventTitle(e))}</div>`).join('')}
        ${wos.map(w => `<a class="wk-ev" style="--c:var(--text-3)" href="#/athlete/${w.athleteId}/program?d=${w.date}"><b>${icon('dumbbell', 'sm')} Program${w.completed ? ' ✓' : ''}</b>${esc(athleteName(getAthlete(w.athleteId), true))} · ${esc(w.title || 'Workout')}</a>`).join('')}
        ${!evs.length && !wos.length ? '<div class="faint tiny" style="padding:4px">—</div>' : ''}

    }).join('');

  } else {
    title = 'Upcoming';

    const days = [...Array(60)].map((_, i) => addDays(from, i));
    const blocks = days.map(ds => {
      const evs = eventsOn(ds).filter(filt);
      if (!evs.length) return '';
      return `<div class="agenda-day"><h4 class="${ds === T ? 'is-today' : ''}">${esc(relDay(ds))} <span class="faint small">${esc(fmtDate(ds, { month: 'short', day: 'numeric' }))}</span></h4><div class="card" style="padding:4px 12px">${evs.map(e => eventRow(e)).join('')}</div></div>`;
    }).join('');

function dayAgenda(ds, filt, programs) {
  const evs = eventsOn(ds).filter(filt);
  const wos = programs ? S.workouts.filter(w => w.date === ds) : [];
  return `<div class="agenda-day">
    <div class="split" style="margin-bottom:8px"><h4 class="${ds === today() ? 'is-today' : ''}" style="margin:0">${esc(fmtDateLong(ds))}</h4><button class="btn sm" data-act="newEvent" data-date="${ds}">${icon('plus', 'sm')}Add</button></div>
    <div class="card" style="padding:4px 12px">
      ${evs.length ? evs.map(e => eventRow(e)).join('') : `<div class="muted small" style="padding:12px 4px">No events.</div>`}
      ${wos.length ? `<div class="kicker" style="padding:12px 4px 2px">Programmed workouts</div>${wos.map(w => { const a = getAthlete(w.athleteId); return `<a class="row" href="#/athlete/${w.athleteId}/program?d=${w.date}">${avatar(a, 'sm')}<span class="row-main"><span class="row-title">${esc(athleteName(a))}</span><span class="row-sub">${esc(w.title || 'Workout')} · ${plural((w.items || []).length, 'exercise')}</span></span>${w.completed ? `<span class="badge good">Done</span>` : ''}</a>`; }).join('')}` : ''}
    </div></div>`;
}
function monthGrid(cursor, selected, cell, act) {
  const first = monthStart(cursor);
  const month = parseDS(first).getMonth();
  const start = startOfWeek(first);
  const T = today();
  const ws = S.settings.weekStart || 0;
  const heads = [...Array(7)].map((_, i) => new Date(2023, 0, 1 + ((i + ws) % 7)).toLocaleDateString(undefined, { weekday: 'short' }));
  let cells = '';
  let i = 0;
  while (true) {
    const ds = addDays(start, i);
    if (i % 7 === 0 && i > 0 && parseDS(ds).getMonth() !== month) break;
    const d = parseDS(ds);
    cells += `<div class="mcell ${d.getMonth() !== month ? 'out' : ''} ${ds === T ? 'today' : ''} ${ds === selected ? 'sel' : ''}" role="button" tabindex="0" data-act="${act}" data-date="${ds}" aria-label="${esc(fmtDateLong(ds))}"><span class="mnum">${d.getDate()}</span>${cell(ds)}</div>`;
    i++;
    if (i > 42) break;
  }
  return `<div class="mgrid"><div class="mhead">${heads.map(h => `<div>${esc(h)}</div>`).join('')}</div><div class="mbody">${cells}</div></div>`;
}
A.calNav = el => {

/* ---------------- Event modal ---------------- */
function openEventModal(ev, def = {}) {

    type: def.type || 'session', date: def.date || today(), start: S.settings.defaultStart || '09:00',
    duration: S.settings.defaultDuration || 60, athleteIds: def.athleteIds || [], title: '', location: '', notes: '', status: 'scheduled',

      ${field('Date', inp('date', e.date, 'type="date" required'))}
      ${field('Start', inp('start', e.start, 'type="time"'))}

    ${isNew ? field('Repeat', sel('repeat', [['1', 'Does not repeat'], ['2', 'Weekly for 2 weeks'], ['4', 'Weekly for 4 weeks'], ['6', 'Weekly for 6 weeks'], ['8', 'Weekly for 8 weeks'], ['12', 'Weekly for 12 weeks'], ['16', 'Weekly for 16 weeks']], '1')) : ''}
    ${!isNew && series.length > 1 ? `<label class="check"><input type="checkbox" name="applySeries"> Apply time, athletes, type & details to all later events in this series (${series.filter(x => x.date > e.date).length})</label>` : ''}
    ${!isNew ? eventLinks(e) : ''}`;
  openModal({
    title: isNew ? 'New event' : 'Edit event', body, submit: isNew ? 'Add' : 'Save',
    onSubmit: v => {
      if (!isDS(v.date)) return 'Please choose a date.';
      const duration = Math.round(num(v.duration) ?? 60);
      if (duration <= 0 || duration > 24 * 60) return 'Duration should be between 1 and 1440 minutes.';
      const rec = { ...e, type: v.type || 'session', athleteIds: v.athleteIds || [], title: v.title.trim(), date: v.date, start: v.start || '', duration, location: v.location.trim(), notes: v.notes.trim(), status: v.status || e.status || 'scheduled' };
      if (isNew) {

        if (!mode) return false;

    <div class="fields">

      ${field('Body mass', numInp('bodyMass', t.bodyMassKg != null ? inVal(U.massOut(t.bodyMassKg), 1) : '', 'data-input="testPreview"'), { unit: U.mass(), hint: 'Used for relative force/power' })}
    </div>
    <div class="computed" id="testCalc">Enter results — calculated values (RSI, RSI-mod, DSI, EUR, max velocity, relative force/power) appear here.</div>
    <p class="faint small" style="margin:-4px 0 12px">Fill in only what you tested. Leave the rest blank.</p>
    ${groups}
    ${field('Notes', ta('notes', t.notes, 'rows="2" placeholder="Conditions, surface, timing system, device…"'))}`;
  const read = form => {
    const fdv = formData(form), m = {}, errs = [];
    METRICS.filter(d => !d.calc).forEach(d => {
      const raw = fdv['m_' + d.key];
      if (raw == null || raw.trim() === '') return;
      const v = num(raw);
      if (v == null || v < 0) { errs.push(`${d.label}: “${raw}” isn't a valid number.`); return; }
      if (d.unit === '%' && v > 100) { errs.push(`${d.label} must be 0–100%.`); return; }
      if (d.unit === 's' && (v <= 0 || v > 120)) { errs.push(`${d.label}: enter seconds (e.g. 1.85).`); return; }
      m[d.key] = d.kind === 'len' ? U.lenIn(v) : v;
    });
    const bm = num(fdv.bodyMass);
    return { fdv, m, errs, bm: bm != null && bm > 0 ? U.massIn(bm) : null };
  };
  openModal({
    title: isNew ? `New test${a ? ' — ' + athleteName(a, true) : ''}` : `Edit test — ${athleteName(a, true)}`, body, size: 'wide', submit: 'Save',
    onSubmit: (v, form) => {
      const { m, errs, bm } = read(form);
      const athleteId = aid || v.athleteId;
      if (!athleteId) return 'Please choose an athlete.';
      if (!isDS(v.date)) return 'Please choose a test date.';
      if (errs.length) return errs.join(' ');
      if (!Object.keys(m).length) return 'Enter at least one result.';
      upsert('tests', { ...t, athleteId, date: v.date, m, bodyMassKg: bm, notes: v.notes.trim(), asymSide: v.asymSide || '' });
      toast('Test saved');
      if (!aid) go(`#/athlete/${athleteId}/testing`); else refresh();
    },
    onDelete: isNew ? null : async () => {
      if (!(await confirmBox('Delete this test?', `All results from ${fmtDateFull(t.date)} will be removed.`))) return false;
      removeRec('tests', t.id); toast('Test deleted'); refresh();
    },
    onMount: m => {
      A.testPreview = () => {
        const { m: vals, bm } = read(m.form);
        const tm = testMetrics({ m: vals, bodyMassKg: bm });
        const out = [];
        if (vals.djRsi == null && tm.djRsi != null) out.push(`Drop jump RSI <b>${fmtNum(tm.djRsi, 2)}</b>`);
        if (vals.rsiMod == null && tm.rsiMod != null) out.push(`RSI-mod <b>${fmtNum(tm.rsiMod, 2)}</b>`);
        if (tm.dsi != null) out.push(`DSI <b>${fmtNum(tm.dsi, 2)}</b>`);
        if (tm.eur != null) out.push(`EUR <b>${fmtNum(tm.eur, 2)}</b>`);
        if (tm.vmax != null) out.push(`Max velocity <b>${fmtNum(tm.vmax, 2)} m/s</b>`);
        if (tm.cmjRelPP != null) out.push(`Rel. power <b>${fmtNum(tm.cmjRelPP, 1)} W/kg</b>`);
        if (tm.imtpRel != null) out.push(`Rel. IMTP <b>${fmtNum(tm.imtpRel, 1)} N/kg</b>`);
        $('#testCalc', m.wrap).innerHTML = out.length ? 'Calculated: ' + out.join(' · ') : 'Enter results — calculated values (RSI, RSI-mod, DSI, EUR, max velocity, relative force/power) appear here.';
      };
      A.testPreview();
    },
  });
}

function athHistory(a) {
  const T = today();
  const evs = eventsFor(a.id).sort((x, y) => (y.date + y.start).localeCompare(x.date + x.start));
  const past = evs.filter(e => e.date < T || (e.date === T && e.status !== 'scheduled'));
  const fut = evs.filter(e => !past.includes(e)).reverse();
  const notes = S.notes.filter(n => n.athleteId === a.id).sort((x, y) => y.date.localeCompare(x.date) || y.createdAt - x.createdAt);
  const counts = { completed: past.filter(e => e.status === 'completed').length, noshow: past.filter(e => e.status === 'noshow').length, cancelled: past.filter(e => e.status === 'cancelled').length };
  const attended = counts.completed + counts.noshow ? Math.round(counts.completed / (counts.completed + counts.noshow) * 100) : null;
  return {
    body: `<div class="grid halves">
      <div class="col">
        <div class="card"><div class="card-head"><h3>Notes</h3><button class="btn sm" data-act="newNote" data-athlete="${a.id}">${icon('plus', 'sm')}Add note</button></div>

        </div>
      </div>
      <div class="col">
        <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:0">
          <div class="stat"><div class="stat-label">Completed</div><div class="stat-value">${counts.completed}</div></div>
          <div class="stat"><div class="stat-label">Attendance</div><div class="stat-value">${attended != null ? attended + '%' : '–'}</div></div>
          <div class="stat"><div class="stat-label">Upcoming</div><div class="stat-value">${fut.length}</div></div>
        </div>
        <div class="card"><div class="card-head"><h3>Upcoming sessions</h3></div>${fut.length ? `<div class="list">${fut.slice(0, 10).map(e => eventRow(e, { showDate: true })).join('')}</div>` : '<div class="muted small">None scheduled.</div>'}</div>
        <div class="card"><div class="card-head"><h3>Past sessions</h3><span class="sub">${past.length}</span></div>${past.length ? `<div class="list">${past.slice(0, 30).map(e => eventRow(e, { showDate: true })).join('')}</div>` : '<div class="muted small">No past sessions.</div>'}</div>
      </div></div>`,
    actions: `<button class="btn primary" data-act="newNote" data-athlete="${a.id}">${icon('plus', 'sm')}<span class="lbl">Note</span></button>`,
  };
}

const INTENSITY = [['load', 'Load'], ['pct', '% 1RM'], ['zone', 'Velocity zone'], ['vel', 'Target velocity'], ['rpe', 'RPE'], ['bw', 'Bodyweight / none']];

function athProgram(a, r) {
  const P = (UI.prog[a.id] ||= { cursor: today(), sel: today() });
  if (r.q.d && isDS(r.q.d) && P._deep !== r.q.d) { P.sel = r.q.d; P.cursor = r.q.d; P._deep = r.q.d; }
  const wos = S.workouts.filter(w => w.athleteId === a.id);
  const evs = eventsFor(a.id);
  const d = parseDS(P.cursor);
  const grid = monthGrid(P.cursor, P.sel, ds => {
    const dw = wos.filter(w => w.date === ds);
    const de = evs.filter(e => e.date === ds && e.status !== 'cancelled');
    const chips = dw.map(w => `<span class="ev-chip ${w.completed ? 'done' : ''}" style="--c:${w.completed ? 'var(--good)' : 'var(--accent)'}">${w.completed ? '✓ ' : ''}${esc(w.title || 'Workout')}</span>`).join('');
    const evc = de.map(e => `<span class="ev-chip" style="--c:${typeColor(e.type)};opacity:.7">${e.start ? esc(fmtTime(e.start)) + ' ' : ''}${esc(typeLabel(e.type))}</span>`).join('');
    const dots = `<span class="dots">${dw.map(w => `<span class="dot" style="--c:${w.completed ? 'var(--good)' : 'var(--accent)'}"></span>`).join('')}${de.map(e => `<span class="dot wodot" style="border-color:${typeColor(e.type)}"></span>`).join('')}</span>`;
    return chips + evc + dots;
  }, 'progSelect');
  const dayWos = wos.filter(w => w.date === P.sel);
  const dayEvs = evs.filter(e => e.date === P.sel);
  const done = wos.filter(w => w.completed).length;
  const body = `
    <div class="cal-bar">
      <button class="btn icon" data-act="progNav" data-a="${a.id}" data-d="-1" aria-label="Previous month">${icon('chevL')}</button>
      <button class="btn icon" data-act="progNav" data-a="${a.id}" data-d="1" aria-label="Next month">${icon('chevR')}</button>
      <h3>${esc(d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</h3>
      <button class="btn sm" data-act="progToday" data-a="${a.id}">Today</button>
      <span class="grow"></span>
      <span class="faint small">${plural(wos.length, 'workout')} · ${done} completed</span>
    </div>
    ${grid}
    <div class="agenda-day">
      <div class="split" style="margin-bottom:8px;flex-wrap:wrap"><h4 class="${P.sel === today() ? 'is-today' : ''}" style="margin:0">${esc(fmtDateLong(P.sel))}</h4>
        <div class="chips"><button class="btn sm" data-act="copyWeek" data-a="${a.id}" data-date="${P.sel}">${icon('copy', 'sm')}Copy week</button><button class="btn sm primary" data-act="newWorkout" data-a="${a.id}" data-date="${P.sel}">${icon('plus', 'sm')}Workout</button></div></div>
      ${dayEvs.length ? `<div class="card" style="padding:4px 12px;margin-bottom:12px">${dayEvs.map(e => eventRow(e)).join('')}</div>` : ''}
      ${dayWos.length ? dayWos.map(w => workoutCard(w)).join('') : `<div class="card">${emptyState_('dumbbell', 'No workout programmed', 'Build a session from your exercise library with sets, reps, loads, %1RM or velocity targets.', `<button class="btn primary" data-act="newWorkout" data-a="${a.id}" data-date="${P.sel}">${icon('plus', 'sm')}Add workout</button>`)}</div>`}
    </div>`;
  return { body, actions: `<button class="btn primary" data-act="newWorkout" data-a="${a.id}" data-date="${P.sel}">${icon('plus', 'sm')}<span class="lbl">Workout</span></button>` };
}
A.progSelect = el => {
  const aid = parseHash().parts[0];
  const P = UI.prog[aid];
  if (!P) return;
  const ds = el.dataset.date;
  P.sel = ds;
  if (monthStart(ds) !== monthStart(P.cursor)) P.cursor = ds;

};
A.progNav = el => { const P = UI.prog[el.dataset.a]; P.cursor = addMonths(monthStart(P.cursor), +el.dataset.d); refresh(); };
A.progToday = el => { const P = UI.prog[el.dataset.a]; P.cursor = P.sel = today(); refresh(); };

function intensityText(it, aid) {
  const orm = it.exerciseId ? bestOneRM(aid, it.exerciseId) : null;
  switch (it.intensity) {
    case 'load': return it.load != null ? `<b>${esc(fmtMass(it.load))}</b>` : '';
    case 'pct': {
      if (it.pct == null) return '';
      const kg = orm ? orm.kg * it.pct / 100 : null;
      return `<b>${fmtNum(it.pct, 1, 0)}% 1RM</b>${kg ? ` ≈ <b>${esc(fmtMass(roundLoad(kg)))}</b> <span class="faint">(${orm.source === 'tested' ? 'tested' : 'est.'} 1RM ${esc(fmtMass(orm.kg))})</span>` : ' <span class="faint">(no 1RM on file)</span>'}`;
    }
    case 'zone': {
      const z = ZONES.find(z => z.key === it.zone);
      if (!z) return '';
      return `<b>${esc(z.name)}</b> ${fmtNum(z.min, 2)}–${fmtNum(z.max, 2)} m/s${loadRangeForVel(aid, it.exerciseId, z.min, z.max)}`;
    }
    case 'vel': {
      if (it.vMin == null && it.vMax == null) return '';
      const lo = it.vMin ?? it.vMax, hi = it.vMax ?? it.vMin;
      return `<b>${fmtNum(lo, 2)}${hi !== lo ? '–' + fmtNum(hi, 2) : ''} m/s</b>${loadRangeForVel(aid, it.exerciseId, lo, hi)}`;
    }
    case 'rpe': return it.rpe != null ? `<b>RPE ${fmtNum(it.rpe, 1, 0)}</b>` : '';
    default: return '';
  }
}
function roundLoad(kg) { return U.imp() ? U.massIn(Math.round(U.massOut(kg) / 5) * 5) : Math.round(kg / 2.5) * 2.5; }
function loadRangeForVel(aid, exId, vLo, vHi) {
  if (!exId) return '';
  const p = lvProfile(aid, exId, { from: addDays(today(), -84) });
  if (!p.reg || p.reg.b >= 0 || p.loadsN < 3) return '';
  const l1 = (vHi - p.reg.a) / p.reg.b, l2 = (vLo - p.reg.a) / p.reg.b;
  if (!(l1 > 0 && l2 > 0)) return '';
  return ` <span class="faint">≈ ${esc(fmtMass(roundLoad(Math.min(l1, l2)), false))}–${esc(fmtMass(roundLoad(Math.max(l1, l2))))} from profile</span>`;
}
function workoutCard(w) {
  const items = w.items || [];
  const logs = S.vbt.filter(l => l.athleteId === w.athleteId && l.date === w.date);
  return `<div class="wo">
    <div class="wo-head">
      <h4>${esc(w.title || 'Workout')}${w.phase ? ` <span class="badge info">${esc(w.phase)}</span>` : ''}</h4>
      ${w.completed ? `<span class="badge good">${icon('check', 'sm')}Completed${w.rpe != null ? ` · sRPE ${fmtNum(w.rpe, 1, 0)}` : ''}${w.durationMin ? ` · ${w.durationMin} min` : ''}</span>` : `<span class="badge">Planned</span>`}
    </div>
    ${w.notes ? `<div class="small muted" style="margin-top:6px;white-space:pre-wrap">${esc(w.notes)}</div>` : ''}
    <div class="wo-items">${items.map(it => {
      const ex = getExercise(it.exerciseId);
      const its = intensityText(it, w.athleteId);
      const exLogs = logs.filter(l => l.exerciseId === it.exerciseId);
      return `<div class="wo-item"><div class="row-main" style="white-space:normal">
        <div class="nm">${esc(ex?.name || it.name || 'Exercise')}</div>
        <div class="rx">${[it.sets || it.reps ? `<b>${esc(it.sets || '–')} × ${esc(it.reps || '–')}</b>` : '', its, it.vlCutoff ? `stop at <b>${fmtNum(it.vlCutoff, 0)}% VL</b>` : '', it.rest ? `rest ${esc(it.rest)}` : ''].filter(Boolean).join(' · ')}</div>
        ${it.notes ? `<div class="small faint">${esc(it.notes)}</div>` : ''}
        ${exLogs.length ? `<div class="small" style="margin-top:4px;color:var(--accent)">${icon('gauge', 'sm')} ${exLogs.map(l => `${esc(fmtMass(l.load, false))}@${fmtNum(l.vBest, 2)}${l.vl != null && l.n > 1 ? ` (${fmtNum(l.vl, 0)}%VL)` : ''}`).join(', ')}</div>` : ''}
      </div>${ex?.vbt ? `<button class="btn sm ghost" data-act="logFromWorkout" data-w="${w.id}" data-ex="${it.exerciseId}" data-load="${it.intensity === 'load' && it.load ? it.load : ''}" title="Log a VBT set">${icon('gauge', 'sm')}<span>Log</span></button>` : ''}</div>`;
    }).join('') || '<div class="muted small">No exercises yet.</div>'}</div>
    <div class="wo-actions">
      ${w.completed ? `<button class="btn sm" data-act="completeWorkout" data-id="${w.id}">${icon('edit', 'sm')}Session RPE</button>` : `<button class="btn sm primary" data-act="completeWorkout" data-id="${w.id}">${icon('check', 'sm')}Complete</button>`}
      <button class="btn sm" data-act="editWorkout" data-id="${w.id}">${icon('edit', 'sm')}Edit</button>
      <button class="btn sm" data-act="dupWorkout" data-id="${w.id}">${icon('copy', 'sm')}Duplicate</button>
    </div>
  </div>`;
}
A.newWorkout = el => openWorkoutModal(null, { athleteId: el.dataset.a, date: el.dataset.date });
A.editWorkout = el => { const w = getRec('workouts', el.dataset.id); if (w) openWorkoutModal(w); };
A.logFromWorkout = el => { const w = getRec('workouts', el.dataset.w); if (w) openVbtModal(null, { athleteId: w.athleteId, exerciseId: el.dataset.ex, date: w.date, load: num(el.dataset.load), workoutId: w.id }); };

function exerciseOptions(selected, { vbtFirst = false, allowNew = true } = {}) {
  const groups = EX_CATS.map(c => ({ group: c, options: S.exercises.filter(e => e.category === c).sort((x, y) => x.name.localeCompare(y.name)).map(e => [e.id, e.name + (e.vbt ? ' ⚡' : '')]) })).filter(g => g.options.length);
  const other = S.exercises.filter(e => !EX_CATS.includes(e.category)).map(e => [e.id, e.name]);
  if (other.length) groups.push({ group: 'Other', options: other });
  let opts = [['', 'Choose exercise…']];
  if (vbtFirst) {
    const v = S.exercises.filter(e => e.vbt).sort((x, y) => x.name.localeCompare(y.name)).map(e => [e.id, e.name]);
    if (v.length) opts.push({ group: 'VBT-tracked', options: v });
  }
  opts = opts.concat(groups);
  if (allowNew) opts.push(['__new', '+ New exercise…']);
  return sel('exerciseId', opts, selected);
}

function openWorkoutModal(w, def = {}) {
  const isNew = !w;
  const x = w ? JSON.parse(JSON.stringify(w)) : { athleteId: def.athleteId, date: def.date || today(), title: '', phase: '', notes: '', items: [], completed: false };
  if (!x.items.length) x.items.push(blankItem());
  const a = getAthlete(x.athleteId);
  const phases = [...new Set(S.workouts.filter(o => o.athleteId === x.athleteId).map(o => o.phase).filter(Boolean))];
  const body = `
    <div class="fields">
      ${field('Title', inp('title', x.title, 'placeholder="e.g. Lower A — Strength" list="woTitles"'))}
      ${field('Date', inp('date', x.date, 'type="date" required'))}
      ${field('Block / phase', inp('phase', x.phase, 'placeholder="e.g. GPP wk 2" list="woPhases"'), { cls: 'full' })}
    </div>
    <div class="field"><span class="field-label">Exercises</span><div id="itemsHost"></div>
      <button type="button" class="btn block" data-add-item>${icon('plus', 'sm')}Add exercise</button></div>
    ${field('Workout notes', ta('notes', x.notes, 'rows="2" placeholder="Warm-up, focus, coaching points…"'))}
    ${isNew ? field('Repeat', sel('repeat', [['1', 'Just this day'], ['2', 'Weekly for 2 weeks'], ['3', 'Weekly for 3 weeks'], ['4', 'Weekly for 4 weeks'], ['6', 'Weekly for 6 weeks'], ['8', 'Weekly for 8 weeks']], '1'), { hint: 'Creates a copy of this workout on the same weekday for following weeks.' }) : ''}
    <datalist id="woTitles">${[...new Set(S.workouts.map(o => o.title).filter(Boolean))].slice(0, 40).map(t => `<option value="${esc(t)}">`).join('')}</datalist>
    <datalist id="woPhases">${phases.map(t => `<option value="${esc(t)}">`).join('')}</datalist>`;
  openModal({
    title: `${isNew ? 'New' : 'Edit'} workout — ${athleteName(a, true)}`, body, size: 'wide',
    onSubmit: v => {
      if (!isDS(v.date)) return 'Please choose a date.';
      const items = x.items.filter(it => it.exerciseId);
      if (!items.length) return 'Add at least one exercise.';
      for (const it of items) {
        if (it.intensity === 'pct' && it.pct != null && (it.pct <= 0 || it.pct > 120)) return '%1RM should be between 1 and 120.';
        if (it.intensity === 'vel' && ((it.vMin != null && (it.vMin <= 0 || it.vMin > 4)) || (it.vMax != null && (it.vMax <= 0 || it.vMax > 4)))) return 'Velocity targets should be in m/s (e.g. 0.75).';
        if (it.vlCutoff != null && (it.vlCutoff <= 0 || it.vlCutoff > 80)) return 'Velocity-loss cut-off should be 1–80%.';
      }
      const rec = { ...x, title: v.title.trim(), date: v.date, phase: v.phase.trim(), notes: v.notes.trim(), items };
      if (isNew) {
        const n = +v.repeat || 1;
        for (let i = 0; i < n; i++) upsert('workouts', { ...JSON.parse(JSON.stringify(rec)), id: uid(), date: addDays(v.date, 7 * i), completed: false });
        toast(n > 1 ? `${n} workouts added` : 'Workout added');
      } else { upsert('workouts', rec); toast('Workout saved'); }
      const P = (UI.prog[x.athleteId] ||= {}); P.sel = v.date; P.cursor = v.date;
      if (parseHash().name === 'athlete') refresh(); else go(`#/athlete/${x.athleteId}/program`);
    },
    onDelete: isNew ? null : async () => {
      if (!(await confirmBox('Delete this workout?', 'Logged VBT sets are kept.'))) return false;
      removeRec('workouts', x.id); toast('Workout deleted'); refresh();
    },
    onMount: m => {
      const host = $('#itemsHost', m.wrap);
      const draw = () => { host.innerHTML = x.items.map((it, i) => itemEditor(it, i, x.items.length, x.athleteId)).join(''); };
      draw();
      $('[data-add-item]', m.wrap).addEventListener('click', () => {
        const prev = x.items[x.items.length - 1];
        x.items.push(blankItem(prev ? { sets: prev.sets, reps: prev.reps, intensity: prev.intensity === 'bw' ? 'load' : prev.intensity } : {}));
        draw();
        host.lastElementChild?.querySelector('select')?.focus();
      });
      host.addEventListener('click', e => {
        const b = e.target.closest('[data-it]');
        if (!b) return;
        const i = +b.dataset.i, op = b.dataset.it;
        if (op === 'rm') { x.items.splice(i, 1); if (!x.items.length) x.items.push(blankItem()); }
        if (op === 'up' && i > 0) [x.items[i - 1], x.items[i]] = [x.items[i], x.items[i - 1]];
        if (op === 'down' && i < x.items.length - 1) [x.items[i + 1], x.items[i]] = [x.items[i], x.items[i + 1]];
        draw();
      });
      const onField = async e => {
        const el = e.target;
        const box = el.closest('[data-item]');
        if (!box || !el.dataset.k) return;
        const i = +box.dataset.item, k = el.dataset.k, it = x.items[i];
        if (k === 'exerciseId' && el.value === '__new') {
          const ex = await quickExercise();
          if (ex) it.exerciseId = ex.id; else el.value = it.exerciseId || '';
          draw(); return;
        }

function lvProfileCard(aid, exId, win, exAct, winAct, exIds) {
  const ex = getExercise(exId);
  const from = win === 'all' ? null : addDays(today(), -(+win));
  const p = lvProfile(aid, exId, { from });
  const all = lvProfile(aid, exId);
  const pts = all.points.map(q => ({ x: U.massOut(q.x), y: q.y, old: from && q.date < from, tip: `${fmtDate(q.date)} · ${fmtMass(q.x)} @ ${fmtNum(q.y, 2)} m/s`, color: from && q.date < from ? 'var(--text-3)' : 'var(--accent)' }));
  const reg = p.reg;
  const conv = U.imp() ? 2.2046226218 : 1;
  const spec = { type: 'scatter', points: pts, h: 260, xLabel: `Load (${U.mass()})`, yLabel: 'Fastest-rep velocity (m/s)' };
  if (reg && reg.b < 0) {
    const maxX = p.e1rm || Math.max(...p.points.map(q => q.x));
    spec.line = { a: reg.a, b: reg.b / conv, from: 0, to: U.massOut(maxX) };
  }
  if (p.mvt) { spec.hline = p.mvt; spec.hlineLabel = `MVT ${fmtNum(p.mvt, 2)} m/s`; }
  if (p.e1rm) spec.marker = { x: U.massOut(p.e1rm), y: p.mvt, label: `e1RM ${fmtMass(p.e1rm)}`, tip: `Estimated 1RM ${fmtMass(p.e1rm)}` };
  const pctRows = p.e1rm && reg ? [95, 90, 85, 80, 75, 70, 65, 60, 50, 40, 30].map(pc => {
    const kg = p.e1rm * pc / 100, v = reg.a + reg.b * kg, z = zoneOf(v);
    return `<tr><td>${pc}%</td><td class="n">${esc(fmtMass(roundLoad(kg)))}</td><td class="n">${fmtNum(v, 2)}</td><td><span class="zone-sw" style="background:${z?.color || 'var(--text-3)'}"></span>${esc(z?.name || '')}</td></tr>`;
  }).join('') : '';
  const quality = reg ? (reg.r2 >= 0.9 ? ['good', 'Strong fit'] : reg.r2 >= 0.75 ? ['warn', 'Moderate fit'] : ['bad', 'Weak fit']) : null;
  return `<div class="card">
    <div class="card-head" style="flex-wrap:wrap"><h3>Load–velocity profile</h3>
      ${exIds && exIds.length ? sel('ex', exIds.map(id => [id, getExercise(id).name]), exId, `data-change="${exAct}" style="width:auto;min-height:34px;padding-top:5px;padding-bottom:5px" aria-label="Exercise"`) : ''}
      ${sel('win', [['28', 'Last 4 weeks'], ['42', 'Last 6 weeks'], ['84', 'Last 12 weeks'], ['all', 'All time']], win, `data-change="${winAct}" style="width:auto;min-height:34px;padding-top:5px;padding-bottom:5px" aria-label="Window"`)}
    </div>
    ${all.points.length ? chart(spec) : '<div class="muted small">No sets logged for this exercise.</div>'}
    <div class="kv" style="margin-top:10px">
      <span>Sets <b>${p.points.length}</b></span><span>Distinct loads <b>${p.loadsN}</b></span>
      ${reg ? `<span>R² <b>${fmtNum(reg.r2, 2)}</b> <span class="badge ${quality[0]}">${quality[1]}</span></span><span>Slope <b>${fmtNum(reg.b * 10, 3)}</b> m/s per 10 kg</span>` : ''}
      ${p.e1rm ? `<span>Estimated 1RM <b>${esc(fmtMass(p.e1rm))}</b></span>` : ''}
    </div>
    ${!p.mvt && ex ? `<div class="banner info" style="margin:12px 0 0">${icon('info')}<div class="grow small">Set a minimum velocity threshold (MVT) for <b>${esc(ex.name)}</b> in the Exercise Library to estimate 1RM. Ballistic lifts (jumps, cleans) don't use an MVT.</div></div>` : ''}
    ${p.mvt && !p.e1rm ? `<div class="faint small" style="margin-top:8px">Need sets at 3+ distinct loads (ideally spanning ~40–90% 1RM) in this window to estimate 1RM.</div>` : ''}
    ${pctRows ? `<details class="group" style="margin-top:14px"><summary>Load & velocity targets by %1RM</summary><div class="group-body table-wrap"><table class="t"><thead><tr><th>%1RM</th><th class="n">Load</th><th class="n">Velocity</th><th>Zone</th></tr></thead><tbody>${pctRows}</tbody></table>
      <p class="faint tiny" style="margin-top:8px">From this athlete's own profile. Estimated 1RMs can over-predict (Banyard et al. 2017) — treat as guidance.</p></div></details>` : ''}
  </div>`;
}

A.vlCalc = () => {
  const reps = parseVels($('#vlIn').value);
  const cut = num($('#vlCut').value);
  const out = $('#vlOut');
  if (!reps.length) { out.innerHTML = 'Enter rep velocities to see velocity loss and where to stop the set.'; return; }
  const st = velStats(reps);
  let stopAt = null;
  if (cut > 0) { const best = []; for (let i = 0; i < reps.length; i++) { best.push(reps[i]); const b = Math.max(...best); if ((b - reps[i]) / b * 100 >= cut) { stopAt = i + 1; break; } } }
  const z = zoneOf(st.best);
  out.innerHTML = `Reps <b>${st.n}</b> · fastest <b>${fmtNum(st.best, 2)}</b> · mean <b>${fmtNum(st.mean, 2)}</b> · last <b>${fmtNum(st.last, 2)}</b> m/s<br>
    Velocity loss <b style="color:${st.vl > 40 ? 'var(--bad)' : st.vl > 25 ? 'var(--warn)' : 'var(--good)'}">${fmtNum(st.vl, 1)}%</b>${z ? ` · fastest rep in <b>${esc(z.name)}</b>` : ''}<br>
    ${cut > 0 ? (stopAt ? `Cut-off of ${fmtNum(cut, 0)}% reached on <b>rep ${stopAt}</b> — stop the set there.` : `Cut-off of ${fmtNum(cut, 0)}% not reached (velocity at stop threshold: <b>${fmtNum(st.best * (1 - cut / 100), 2)} m/s</b>).`) : ''}`;
};

function openVbtModal(log, def = {}) {
  const isNew = !log;
  const x = log ? { ...log } : { athleteId: def.athleteId || '', exerciseId: def.exerciseId || (UI.vbt.exerciseId || ''), date: def.date || today(), load: def.load ?? null, reps: [], vBest: null, peak: null, notes: '', workoutId: def.workoutId || null };
  if (!S.exercises.some(e => e.vbt) && !S.exercises.length) { toast('Add an exercise to your library first'); return go('#/library'); }
  const body = `
    <div class="fields">
      ${field('Athlete', sel('athleteId', athleteOptions(!isNew), x.athleteId))}
      ${field('Exercise', exerciseOptions(x.exerciseId, { vbtFirst: true, allowNew: false }))}
      ${field('Date', inp('date', x.date, 'type="date"'))}
      ${field('Load', numInp('load', x.load != null ? inVal(U.massOut(x.load), 1) : '', 'autofocus'), { unit: U.mass() })}
    </div>
    ${field('Rep velocities (mean, m/s)', inp('reps', (x.reps || []).join(', '), 'inputmode="decimal" placeholder="0.82, 0.80, 0.77, 0.71" data-input="vbtPreview"'), { hint: 'Enter each rep in order. Or leave blank and enter a single velocity below.' })}
    <div class="fields">
      ${field('Single velocity', numInp('vSingle', x.reps?.length ? '' : (x.vBest ?? ''), 'data-input="vbtPreview"'), { unit: 'm/s', hint: 'Best/mean rep if not entering each rep' })}
      ${field('Peak velocity', numInp('peak', x.peak ?? ''), { unit: 'm/s', hint: 'Optional' })}
    </div>
    <div class="computed" id="vbtCalc">—</div>
    ${field('Notes', inp('notes', x.notes, 'placeholder="Optional"'))}`;
  const read = v => {
    const reps = parseVels(v.reps);
    const single = num(v.vSingle);
    const st = reps.length ? velStats(reps) : single > 0 ? { n: null, best: single, mean: single, vl: null } : null;
    return { reps, st };
  };
  const save = (v, keepOpen, m) => {
    if (!v.athleteId) return 'Choose an athlete.';
    if (!v.exerciseId) return 'Choose an exercise.';
    if (!isDS(v.date)) return 'Choose a date.';
    const load = num(v.load);
    if (load == null || load < 0) return 'Enter the load (use 0 for bodyweight-only).';
    const { reps, st } = read(v);
    if (v.reps.trim() && !reps.length) return 'Rep velocities should be numbers in m/s, e.g. 0.82, 0.79';
    if (!st) return 'Enter rep velocities or a single velocity.';
    if (st.best > 4) return 'Velocities look too high — enter metres per second (e.g. 0.75).';
    const peak = num(v.peak);
    upsert('vbt', { ...x, id: keepOpen ? undefined : x.id, createdAt: keepOpen ? null : x.createdAt, athleteId: v.athleteId, exerciseId: v.exerciseId, date: v.date, load: U.massIn(load), reps, n: st.n ?? (reps.length || null), vBest: st.best, vMean: st.mean, vl: st.vl, peak: peak > 0 ? peak : null, notes: v.notes.trim() });
    UI.vbt.athleteId = v.athleteId; UI.vbt.exerciseId = v.exerciseId;
    if (keepOpen) {
      toast('Set saved — log the next one');
      m.form.reps.value = ''; m.form.vSingle.value = ''; m.form.peak.value = ''; m.form.notes.value = '';
      m.form.load.focus(); m.form.load.select();
      A.vbtPreview(); refresh();
      return false;
    }
    toast(isNew ? 'Set logged' : 'Saved'); refresh();
  };
  openModal({
    title: isNew ? 'Log VBT set' : 'Edit VBT set', body,
    footer: isNew ? `<button type="button" class="btn" data-next>Save & log next set</button>` : '',
    onSubmit: (v, f, m) => save(v, false, m),
    onDelete: isNew ? null : async () => { if (!(await confirmBox('Delete this set?'))) return false; removeRec('vbt', x.id); toast('Set deleted'); refresh(); },
    onMount: m => {
      A.vbtPreview = () => {
        const { st } = read(formData(m.form));
        const box = $('#vbtCalc', m.wrap);
        if (!box) return;
        if (!st) { box.innerHTML = 'Velocity loss, fastest rep and zone appear here.'; return; }
        const z = zoneOf(st.best);
        box.innerHTML = `${st.n ? `Reps <b>${st.n}</b> · ` : ''}Fastest <b>${fmtNum(st.best, 2)} m/s</b>${st.n ? ` · mean <b>${fmtNum(st.mean, 2)}</b> · velocity loss <b style="color:${st.vl > 40 ? 'var(--bad)' : st.vl > 25 ? 'var(--warn)' : 'var(--good)'}">${fmtNum(st.vl, 1)}%</b>` : ''}${z ? ` · <span class="zone-sw" style="background:${z.color};display:inline-block;width:9px;height:9px;border-radius:3px"></span> ${esc(z.name)}` : ''}`;
      };
      A.vbtPreview();
      $('[data-next]', m.wrap)?.addEventListener('click', () => {
        const r = save(formData(m.form), true, m);
        if (typeof r === 'string') m.error(r); else m.error('');
      });
    },
  });
}

async function onImportFile(e) {

  let parsed;
  try { parsed = JSON.parse(await f.text()); } catch { return toast('That file isn’t a valid backup', 'err'); }
  const inc = parsed?.data && parsed.app === 'performance-hq' ? parsed.data : null;
  if (!inc || !COLS.some(c => Array.isArray(inc[c]))) return toast('That file isn’t a Performance HQ backup', 'err');
  const n = COLS.reduce((s, c) => s + (inc[c]?.length || 0), 0);
  const mode = await choose('Import backup', `${esc(f.name)} contains ${plural(n, 'record')}${parsed.exportedAt ? ` (exported ${esc(new Date(parsed.exportedAt).toLocaleString())})` : ''}.<br><br><b>Merge</b> combines it with this device, keeping the newest version of each record. <b>Replace</b> discards everything on this device first.`, [
    { label: 'Merge (recommended)', value: 'merge', style: 'primary' }, { label: 'Replace all data', value: 'replace', style: 'danger-ghost' }, { label: 'Cancel', value: null }]);
  if (!mode) return;
  if (mode === 'replace' && !(await confirmBox('Replace all data on this device?', 'Everything currently on this device will be overwritten by the backup.', { ok: 'Replace' }))) return;
  if (mode === 'replace') {
    const keep = { lockEnabled: S.settings.lockEnabled, pinHash: S.settings.pinHash, pinSalt: S.settings.pinSalt, pinLen: S.settings.pinLen, autoLockMin: S.settings.autoLockMin };
    S = normalizeState(inc);
    Object.assign(S.settings, keep, { onboarded: true });
  } else {
    const res = mergeState(normalizeState(inc));
    toast(`Merged: ${res.added} added, ${res.updated} updated${res.removed ? `, ${res.removed} removed` : ''}`);
  }
  await flush(); applyTheme(); updateBrand();
  if (mode === 'replace') toast('Backup restored');
  refresh();
}
function mergeState(inc) {
  let added = 0, updated = 0, removed = 0;
  Object.entries(inc.deleted || {}).forEach(([id, t]) => { S.deleted[id] = Math.max(S.deleted[id] || 0, t); });
  COLS.forEach(c => {
    const map = new Map(S[c].map(r => [r.id, r]));
    inc[c].forEach(r => {
      if (S.deleted[r.id] && S.deleted[r.id] >= (r.updatedAt || 0)) return;
      const cur = map.get(r.id);
      if (!cur) { map.set(r.id, r); added++; }
      else if ((r.updatedAt || 0) > (cur.updatedAt || 0)) { map.set(r.id, r); updated++; }
    });
    const before = map.size;
    S[c] = [...map.values()].filter(r => !(S.deleted[r.id] && S.deleted[r.id] >= (r.updatedAt || 0)));
    removed += before - S[c].length;
  });
  ['businessName', 'coachName'].forEach(k => { if (!S.settings[k] && inc.settings?.[k]) S.settings[k] = inc.settings[k]; });
  S.settings.onboarded = true;
  persist();
  return { added, updated, removed };
}

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (window.crypto?.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (const b of data) { h1 = Math.imul(h1 ^ b, 16777619) >>> 0; h2 = Math.imul(h2 ^ b, 2246822519) >>> 0; }
  return 'f' + h1.toString(16) + h2.toString(16);
}
function pinPrompt(title, sub = '') {

      onSubmit: v => { if (!/^\d{4,6}$/.test(v.pin)) return 'Use 4 to 6 digits.'; resolve(v.pin); },
    });
    const wrap = modalStack[modalStack.length - 1].wrap;
    const obs = new MutationObserver(() => { if (!document.body.contains(wrap)) { obs.disconnect(); resolve(null); } });
    obs.observe(document.body, { childList: true });
  });
}

function showLock() {

  document.body.style.overflow = '';

}
function lockKey(k) {
  if (lockBusy) return;
  if (k === 'del') lockEntry = lockEntry.slice(0, -1);
  else if (k === 'forgot') return forgotPin();
  else if (/^\d$/.test(k) && lockEntry.length < (S.settings.pinLen || 4)) lockEntry += k;
  $$('#pinDots span').forEach((s, i) => s.classList.toggle('on', i < lockEntry.length));
  if (lockEntry.length === (S.settings.pinLen || 4)) {
    lockBusy = true;
    hashPin(lockEntry, S.settings.pinSalt).then(h => {
      lockBusy = false;
      if (h === S.settings.pinHash) unlockUI();
      else {
        lockEntry = '';
        const d = $('#pinDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
        setTimeout(() => $$('#pinDots span').forEach(s => s.classList.remove('on')), 250);
      }
    });
  }
}
document.addEventListener('keydown', e => {

    { a: jordan, base: { sprint10: 1.74, sprint40yd: 4.72, fly10: 1.05, cmj: 58, sj: 54, broad: 280, djHeight: 44, djGct: 0.19, cmjPF: 2480, cmjPP: 5600, imtpPF: 3350, ttt: 0.72, asym: 9 }, step: { sprint10: -0.008, sprint40yd: -0.018, fly10: -0.003, cmj: 0.6, sj: 0.6, broad: 1.5, djHeight: 0.3, djGct: 0, cmjPF: 10, cmjPP: 45, imtpPF: 60, ttt: -0.004, asym: 1.4 } },
    { a: ava, base: { sprint10: 2.02, cmj: 42, sj: 41.5, vj: 52, broad: 230, djHeight: 33, djGct: 0.29, cmjPF: 1850, cmjPP: 3500, imtpPF: 2050, ttt: 0.86, asym: 5 }, step: { sprint10: -0.004, cmj: 0.35, sj: 0.5, vj: 0.4, broad: 1, djHeight: 0.4, djGct: -0.004, cmjPF: 15, cmjPP: 30, imtpPF: 30, ttt: -0.006, asym: 0 } },
    { a: marcus, base: { sprint10: 1.80, sprint20: 3.05, fly10: 1.12, proAgility: 4.55, cmj: 52, sj: 47, vj: 70, broad: 255, djHeight: 40, djGct: 0.18, cmjPF: 1900, cmjPP: 4400, imtpPF: 2650, ttt: 0.70, asym: 7 }, step: { sprint10: -0.004, sprint20: -0.006, fly10: -0.003, proAgility: -0.02, cmj: 0.3, sj: 0.3, vj: 0.3, broad: 1.2, djHeight: 0.3, djGct: 0, cmjPF: 8, cmjPP: 25, imtpPF: 45, ttt: -0.003, asym: 0 } },
  ];
  plan.forEach((p, ai) => {
    for (let i = 0; i < 6; i++) {
      const date = addDays(T, -(150 - i * 28) - ai);
      const m = {};
      Object.entries(p.base).forEach(([k, v]) => {
        const def = M[k]; const noise = (def.te || 3) / 100 * 0.45 * Math.abs(v);
        let val = v + p.step[k] * i * (k === 'asym' ? 1 : 1) + n(0, noise);
        if (p.a === marcus && k === 'cmj' && i === 5) val = v + p.step[k] * 4 - v * 0.07; // fatigue dip in latest test
        m[k] = round(Math.max(0, val), def.unit === 's' ? 3 : def.kind === 'len' ? 1 : def.unit === '%' ? 1 : 0);
      });
      upsert('tests', { ...D, athleteId: p.a.id, date, m, bodyMassKg: round(p.a.massKg + n(0, 0.6) + i * (p.a === jordan ? 0.4 : 0.1), 1), asymSide: p.a === jordan ? 'Right' : '', notes: i === 0 ? 'Baseline battery' : '' });
    }
  });

  /* VBT: back squat & bench, last ~10 weeks, linear L–V relationship + noise; progressing strength */
  const lv = [
    { a: jordan, ex: 'Back Squat', orm: 165, mvt: 0.30, v0: 1.62 },
    { a: jordan, ex: 'Bench Press', orm: 120, mvt: 0.17, v0: 1.55 },
    { a: marcus, ex: 'Back Squat', orm: 125, mvt: 0.30, v0: 1.6 },
    { a: maya, ex: 'Trap Bar Deadlift', orm: 115, mvt: 0.20, v0: 1.5 },
    { a: ava, ex: 'Back Squat', orm: 92, mvt: 0.30, v0: 1.58 },
  ];
  lv.forEach(cfg => {
    const exId = ex(cfg.ex);
    for (let wk = 0; wk < 10; wk++) {
      for (const dayOff of [0, 3]) {
        const date = addDays(startOfWeek(T), -7 * (9 - wk) + 1 + dayOff + (cfg.a === marcus ? 1 : 0));
        if (date > T) continue;
        const orm = cfg.orm * (1 + wk * 0.006);
        const slope = (cfg.mvt - cfg.v0) / orm;
        const fatigue = cfg.a === marcus && daysBetween(date, T) <= 4 ? -0.08 : 0;
        const pcts = dayOff === 0 ? [0.5, 0.65, 0.8, 0.85] : [0.4, 0.55, 0.7];
        pcts.forEach(pc => {
          const load = roundLoad(orm * pc);
          const vb = cfg.v0 + slope * load + n(0, 0.025) + fatigue;
          const reps = pc >= 0.8 ? 3 : 5;
          const vl = pc >= 0.8 ? 0.18 : 0.10;
          const rv = [...Array(reps)].map((_, r) => round(vb * (1 - vl * (r / (reps - 1)) ** 1.3) + n(0, 0.008), 2));
          rv[0] = round(vb, 2);
          const st = velStats(rv);
          upsert('vbt', { ...D, athleteId: cfg.a.id, exerciseId: exId, date, load, reps: rv, n: st.n, vBest: st.best, vMean: st.mean, vl: st.vl, peak: null, notes: '' });
        });
      }
    }
  });
  upsert('maxes', { ...D, athleteId: jordan.id, exerciseId: ex('Back Squat'), kg: 160, date: addDays(T, -85), notes: 'Pre-block test' });

  /* Programs: 2 per week per athlete, from 4 weeks ago to 2 weeks ahead */
  const lower = (sq) => [
    { exerciseId: ex('Countermovement Jump'), sets: '3', reps: '3', intensity: 'bw', notes: 'Max intent' },
    { exerciseId: ex(sq), sets: '4', reps: '3-5', intensity: 'zone', zone: 'acc', vlCutoff: 20, rest: '2–3 min' },
    { exerciseId: ex('Romanian Deadlift'), sets: '3', reps: '6', intensity: 'rpe', rpe: 7, rest: '90 s' },
    { exerciseId: ex('Rear-Foot Elevated Split Squat'), sets: '3', reps: '6/side', intensity: 'rpe', rpe: 7 },
    { exerciseId: ex('Copenhagen Plank'), sets: '3', reps: '20 s/side', intensity: 'bw' },
  ];
  const speed = () => [
    { exerciseId: ex('A-Skip'), sets: '2', reps: '20 m', intensity: 'bw' },
    { exerciseId: ex('Acceleration Sprint (10–20 m)'), sets: '6', reps: '1 × 15 m', intensity: 'bw', rest: '2 min', notes: 'Full recovery, timed' },
    { exerciseId: ex('Flying Sprint (10–30 m)'), sets: '4', reps: '1 × 20 m fly', intensity: 'bw', rest: '3 min' },
    { exerciseId: ex('Hurdle Hops'), sets: '3', reps: '5', intensity: 'bw' },
    { exerciseId: ex('Bench Press'), sets: '4', reps: '4', intensity: 'pct', pct: 80, vlCutoff: 20, rest: '2–3 min' },
  ];
  created.forEach((a, ai) => {
    const sq = a === maya ? 'Trap Bar Deadlift' : 'Back Squat';
    for (let wk = -4; wk <= 2; wk++) {
      [[1, 'Lower — Strength', lower(sq)], [4, 'Speed + Upper', speed()]].forEach(([dow, title, items]) => {
        const date = addDays(startOfWeek(T), wk * 7 + dow);
        const past = date < T;
        const rpe = Math.min(10, Math.max(3, Math.round(n(6.3, 1) + (a === jordan && wk === -1 ? 2 : 0))));
        const dur = a === jordan && wk === -1 ? 90 : 65;
        upsert('workouts', { ...D, athleteId: a.id, date, title, phase: wk < 0 ? 'Block 2 — Strength' : 'Block 3 — Power', notes: '', items: items.filter(i => i.exerciseId).map(i => ({ ...blankItem(), ...i, id: uid() })), completed: past, rpe: past ? rpe : null, durationMin: past ? dur : null });
        if (a === jordan && wk === -1) upsert('workouts', { ...D, athleteId: a.id, date: addDays(date, 1), title: 'Extra conditioning', phase: 'Block 2 — Strength', items: [{ ...blankItem(), exerciseId: ex('Tempo Runs'), sets: '1', reps: '12 × 100 m', intensity: 'bw' }], completed: true, rpe: 8, durationMin: 60 });
      });
    }
  });

  /* Calendar: this week + next week, plus evaluations */
  const slots = [['06:30', jordan], ['15:30', maya], ['16:30', marcus], ['17:30', ava]];
  for (let wk = -2; wk <= 1; wk++) {
    [1, 4].forEach(dow => {
      slots.forEach(([start, a]) => {
        const date = addDays(startOfWeek(T), wk * 7 + dow);
        upsert('events', { ...D, type: 'session', date, start, duration: 60, athleteIds: [a.id], title: '', location: 'Main facility', notes: '', status: date < T ? 'completed' : 'scheduled' });
      });
    });
  }
  upsert('events', { ...D, type: 'session', date: T, start: '07:30', duration: 60, athleteIds: [maya.id, ava.id], title: 'Speed group', location: 'Turf', notes: 'Acceleration focus — bring timing gates', status: 'scheduled' });
  upsert('events', { ...D, type: 'evaluation', date: addDays(T, 3), start: '16:00', duration: 90, athleteIds: [marcus.id], title: '', location: 'Main facility', notes: 'Full battery: 10/20 m, flying 10, CMJ, SJ, DJ, IMTP', status: 'scheduled' });
  upsert('events', { ...D, type: 'evaluation', date: addDays(T, 9), start: '07:00', duration: 90, athleteIds: [jordan.id], title: 'Pre-pro-day testing', location: 'Indoor track', notes: '', status: 'scheduled' });
  upsert('events', { ...D, type: 'consult', date: addDays(T, 1), start: '12:00', duration: 30, athleteIds: [ava.id], title: 'Parent check-in — Ava', location: 'Zoom', notes: '', status: 'scheduled' });
  upsert('notes', { ...D, athleteId: jordan.id, date: addDays(T, -6), text: 'Reported tight right hamstring after Thursday sprints. Reduced fly volume; monitor.' });
  upsert('notes', { ...D, athleteId: marcus.id, date: addDays(T, -2), text: 'Exams this week — sleeping ~6 h. Expect lower readiness.' });
}

/* ---------- Onboarding ---------- */
function onboarding() {
  openModal({
    title: 'Welcome', submit: 'Get started', cancel: 'Skip',
    body: `<div style="text-align:center;margin:4px 0 18px"><div class="brand-mark" style="width:56px;height:56px;border-radius:16px;margin:0 auto 12px">${BOLT}</div>
      <h3 style="font-size:20px">${APP_NAME}</h3><p class="muted small">Your private sports-performance workspace. Everything is stored on this device and works offline.</p></div>
      ${field('Business name', inp('businessName', '', 'placeholder="e.g. Apex Performance"'))}
      ${field('Your name', inp('coachName', '', 'placeholder="Coach"'))}
      ${field('Units', segmented('units', [['imperial', 'Imperial (lb, in)'], ['metric', 'Metric (kg, cm)']], 'imperial'))}
      <label class="check"><input type="checkbox" name="starter" checked> Add the starter exercise library (${STARTER.length} exercises, fully editable)</label>
      <label class="check"><input type="checkbox" name="demo"> Load sample athletes & data to explore (removable)</label>`,
    onSubmit: v => {
      Object.assign(S.settings, { businessName: v.businessName.trim(), coachName: v.coachName.trim(), units: v.units || 'imperial', onboarded: true });
      if (v.starter) addStarterLibrary();
      if (v.demo) buildDemo();
      persist(); updateBrand(); refresh();
    },
  });
  // "Skip" still counts as onboarded
  S.settings.onboarded = true; persist();
}

/* ---------- Theme, brand, shell ---------- */
const BOLT = '<svg viewBox="0 0 24 24" width="60%" height="60%" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.5z" fill="#fff"/></svg>';
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0b0d12' : '#f4f5f8');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
function updateBrand() {
  const el = $('#brandSub');
  if (el) el.textContent = S.settings.businessName || 'Coach workspace';
}
const NAV = [['dashboard', 'Dashboard', 'home'], ['calendar', 'Calendar', 'calendar'], ['athletes', 'Athletes', 'users'], ['library', 'Library', 'book'], ['vbt', 'VBT', 'gauge']];
function buildShell() {
  $('#app').innerHTML = `
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">${BOLT}</div><div><div class="brand-name">${APP_NAME}</div><div class="brand-sub" id="brandSub"></div></div></div>
      ${NAV.map(([k, l, ic]) => `<a class="nav-link" data-nav="${k}" href="#/${k}">${icon(ic)}${l}</a>`).join('')}
      <a class="nav-link" data-nav="insights" href="#/insights">${icon('bulb')}Insights</a>
      <span class="nav-spacer"></span>
      <a class="nav-link" data-nav="settings" href="#/settings">${icon('settings')}Settings</a>
    </aside>
    <div class="main"><header class="topbar" id="topbar"></header><main class="view" id="view"></main></div>
    <nav class="tabbar">${NAV.map(([k, l, ic]) => `<a class="tab" data-nav="${k}" href="#/${k}">${icon(ic)}<span>${l}</span></a>`).join('')}</nav>`;
  updateBrand();
  window.addEventListener('scroll', () => $('#topbar')?.classList.toggle('scrolled', window.scrollY > 4), { passive: true });
}
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});

async function boot() {
  buildShell();
  const mode = await Store.init();
  try {
    const saved = await Store.get('state');
    if (saved) S = normalizeState(saved);
  } catch (e) {
    console.error(e);
    toast('Could not read saved data', 'err');
  }
  applyTheme(); updateBrand();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if (S.settings.lockEnabled && S.settings.pinHash) showLock();
  window.addEventListener('hashchange', render);
  render();
  if (!S.settings.onboarded && !S.athletes.length && mode !== 'none') onboarding();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  }
}
boot();

</script>
