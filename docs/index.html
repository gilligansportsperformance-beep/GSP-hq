const modalStack = [];
function openModal({ title, body, submit = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', size = '', onMount, footer = '', cancel = 'Cancel', center = false }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap' + (center ? ' center' : '');
  const hasFoot = onDelete || footer;
  wrap.innerHTML = `
    <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <form class="modal-form" novalidate autocomplete="off">
        <header class="modal-head">
          <button type="button" class="btn-text" data-close>${esc(cancel)}</button>
          <h2>${esc(title)}</h2>
          ${onSubmit ? `<button type="submit" class="btn-text strong">${esc(submit)}</button>` : `<span></span>`}
        </header>
        <div class="modal-body"><div class="form-error hidden" role="alert"></div>${body}</div>
        ${hasFoot ? `<footer class="modal-foot">${onDelete ? `<button type="button" class="btn danger-ghost" data-del>${icon('trash', 'sm')}${esc(deleteLabel)}</button>` : ''}<span class="grow"></span>${footer}</footer>` : ''}
      </form>
    </div>`;
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  const form = $('form', wrap);
  const m = { wrap, form, close };
  modalStack.push(m);
  function close() {
    const i = modalStack.indexOf(m);
    if (i >= 0) modalStack.splice(i, 1);
    wrap.remove();
    if (!modalStack.length) document.body.style.overflow = '';
  }
  m.error = msg => {
    const el = $('.form-error', wrap);
    if (!msg) { el.classList.add('hidden'); return; }
    el.textContent = msg; el.classList.remove('hidden');
    $('.modal-body', wrap).scrollTop = 0;
  };
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) m._bd = true; });
  wrap.addEventListener('click', e => {
    if (e.target === wrap && m._bd) close();
    m._bd = false;
    if (e.target.closest('[data-close]')) close();
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!onSubmit) return close();
    let res;
    try { res = await onSubmit(formData(form), form, m); }
    catch (err) { console.error(err); res = 'Something went wrong: ' + err.message; }
    if (typeof res === 'string') m.error(res);
    else if (res !== false) close();
  });
  if (onDelete) $('[data-del]', wrap).addEventListener('click', async () => {
    const r = await onDelete(m);
    if (r !== false) close();
  });
  onMount?.(m);

  return m;
}

function formData(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name || el.disabled) continue;
    const arr = el.name.endsWith('[]');
    const k = arr ? el.name.slice(0, -2) : el.name;
    if (el.type === 'checkbox') {
      if (arr) { (o[k] ??= []); if (el.checked) o[k].push(el.value); }
      else o[k] = el.checked;
    } else if (el.type === 'radio') {
      if (el.checked) o[k] = el.value; else if (!(k in o)) o[k] = undefined;
    } else o[k] = el.value;
  }
  return o;
}

  $$('.chart[id]').forEach(el => {
    const spec = CHARTS.get(el.id);
    if (!spec) return;
    const W = Math.max(200, el.clientWidth || 300);
    try { el.innerHTML = spec.type === 'scatter' ? drawScatter(spec, W) : spec.type === 'bar' ? drawBar(spec, W) : drawLine(spec, W); }
    catch (e) { console.error(e); el.innerHTML = '<div class="muted small">Chart unavailable</div>'; }
  });
}
window.addEventListener('resize', debounce(drawCharts, 150));

function niceTicks(min, max, count = 4) {
  const span = max - min;
  if (!(span > 0)) return [min];
  const step0 = span / count;
  const mag = 10 ** Math.floor(Math.log10(step0));
  const n = step0 / mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-6; v += step) out.push(+v.toPrecision(12));
  return out;
}
function tickFmt(v, ticks) {
  const step = ticks.length > 1 ? Math.abs(ticks[1] - ticks[0]) : Math.abs(v) || 1;
  const d = step >= 1 ? 0 : Math.min(3, Math.ceil(-Math.log10(step)));
  return fmtNum(v, d);
}
function domain(vals, padFrac = 0.12) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * padFrac || Math.abs(hi) * 0.05 || 1;
  return [lo - pad, hi + pad];
}

function drawLine(spec, W) {
  const H = spec.h || 170, pl = 46, pr = 16, pt = 12, pb = 26;
  const pts = spec.points;
  if (!pts.length) return '';
  const xs = pts.map(p => parseDS(p.x).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 864e5 * 14; x1 += 864e5 * 14; }
  const yVals = pts.map(p => p.y).concat(spec.refY != null ? [spec.refY] : []);
  let [y0, y1] = domain(yVals);
  const ticks = niceTicks(y0, y1, H < 140 ? 3 : 4);
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const col = spec.color || 'var(--accent)';
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  for (const t of ticks) {
    if (t < y0 || t > y1) continue;
    s += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(spec.yFmt ? spec.yFmt(t) : tickFmt(t, ticks))}</text>`;
  }
  if (spec.refY != null) {
    s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(spec.refY)}" y2="${Y(spec.refY)}" stroke="var(--text-3)" stroke-dasharray="4 4"/>`;
    if (spec.refLabel) s += `<text x="${W - pr}" y="${Y(spec.refY) - 5}" text-anchor="end">${esc(spec.refLabel)}</text>`;
  }
  // x labels
  const spanDays = (x1 - x0) / 864e5;
  const xo = spanDays > 300 ? { month: 'short', year: '2-digit' } : { month: 'short', day: 'numeric' };
  const nLab = Math.max(2, Math.min(5, Math.floor(W / 110)));
  for (let i = 0; i < nLab; i++) {
    const t = x0 + (x1 - x0) * i / (nLab - 1);
    s += `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === nLab - 1 ? 'end' : 'middle'}">${esc(new Date(t).toLocaleDateString(undefined, xo))}</text>`;
  }
  const P = pts.map((p, i) => [X(xs[i]), Y(p.y)]);
  if (P.length > 1) {
    const d = P.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
    const gid = 'g' + Math.random().toString(36).slice(2, 8);
    s += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
    s += `<path d="${d}L${P[P.length - 1][0].toFixed(1)} ${H - pb}L${P[0][0].toFixed(1)} ${H - pb}Z" fill="url(#${gid})"/>`;
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  P.forEach((q, i) => {
    const last = i === P.length - 1;
    s += `<circle cx="${q[0]}" cy="${q[1]}" r="${last ? 4.5 : 3.5}" fill="${last ? col : 'var(--surface)'}" stroke="${col}" stroke-width="2"/>`;
    s += `<circle class="hit" cx="${q[0]}" cy="${q[1]}" r="13" data-tip="${esc(pts[i].tip || '')}"/>`;
  });
  return s + '</svg>';
}

function drawScatter(spec, W) {
  const H = spec.h || 240, pl = 48, pr = 18, pt = 14, pb = 34;
  const pts = spec.points;
  if (!pts.length) return '';
  const xv = pts.map(p => p.x).concat(spec.marker ? [spec.marker.x] : []);
  const yv = pts.map(p => p.y).concat(spec.hline != null ? [spec.hline] : []);
  let [x0, x1] = domain(xv, 0.08), [y0, y1] = domain(yv, 0.1);
  x0 = Math.max(0, x0); y0 = Math.max(0, y0);
  const xt = niceTicks(x0, x1, Math.max(3, Math.min(6, Math.floor(W / 90)))), yt = niceTicks(y0, y1, 4);
  const X = v => pl + (v - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  yt.forEach(t => { if (t >= y0 && t <= y1) s += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${tickFmt(t, yt)}</text>`; });
  xt.forEach(t => { if (t >= x0 && t <= x1) s += `<text x="${X(t)}" y="${H - 16}" text-anchor="middle">${esc(spec.xFmt ? spec.xFmt(t) : tickFmt(t, xt))}</text>`; });
  if (spec.xLabel) s += `<text x="${(pl + W - pr) / 2}" y="${H - 1}" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  if (spec.yLabel) s += `<text x="${pl}" y="${pt - 2}" text-anchor="start" style="font-weight:600">${esc(spec.yLabel)}</text>`;
  if (spec.hline != null) {
    s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(spec.hline)}" y2="${Y(spec.hline)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    if (spec.hlineLabel) s += `<text x="${pl + 6}" y="${Y(spec.hline) - 6}" text-anchor="start" style="fill:var(--bad)">${esc(spec.hlineLabel)}</text>`;
  }
  if (spec.line) {
    const { a, b } = spec.line;
    const la = Math.max(x0, spec.line.from ?? x0), lb = Math.min(x1, spec.line.to ?? x1);
    s += `<line x1="${X(la)}" y1="${Y(a + b * la)}" x2="${X(lb)}" y2="${Y(a + b * lb)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="${spec.line.dash ? '6 5' : ''}"/>`;
  }
  pts.forEach(p => {
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.color || 'var(--accent)'}" fill-opacity="${p.old ? .35 : .85}" stroke="var(--surface)" stroke-width="1.5"/>`;
    s += `<circle class="hit" cx="${X(p.x)}" cy="${Y(p.y)}" r="12" data-tip="${esc(p.tip || '')}"/>`;
  });
  if (spec.marker) {
    const m = spec.marker;
    s += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="7" fill="none" stroke="var(--bad)" stroke-width="2.5"/>`;
    s += `<circle class="hit" cx="${X(m.x)}" cy="${Y(m.y)}" r="13" data-tip="${esc(m.tip || '')}"/>`;
    if (m.label) s += `<text x="${X(m.x) - 12}" y="${Y(m.y) - 14}" text-anchor="end" style="fill:var(--bad);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:4px">${esc(m.label)}</text>`;
  }
  return s + '</svg>';
}

function drawBar(spec, W) {
  const H = spec.h || 170, pl = 46, pr = 10, pt = 12, pb = 26;
  const bars = spec.bars;
  if (!bars.length) return '';
  const max = Math.max(1, ...bars.map(b => b.v));
  const ticks = niceTicks(0, max * 1.1, 4);
  const top = ticks[ticks.length - 1] || max;
  const Y = v => pt + (1 - v / top) * (H - pt - pb);
  const bw = (W - pl - pr) / bars.length;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t => { s += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 8}" y="${Y(t) + 4}" text-anchor="end">${tickFmt(t, ticks)}</text>`; });
  const every = Math.ceil(bars.length / Math.max(2, Math.floor(W / 60)));
  bars.forEach((b, i) => {
    const x = pl + i * bw + bw * 0.18, w = bw * 0.64, y = Y(b.v);
    s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0, H - pb - y)}" rx="3" fill="${b.color || 'var(--accent)'}" opacity="${b.dim ? .45 : 1}"/>`;
    s += `<rect class="hit" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" data-tip="${esc(b.tip || '')}"/>`;
    if (i % every === 0 || i === bars.length - 1) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  return s + '</svg>';
}

function sparkline(vals, color = 'var(--accent)') {
  if (vals.length < 2) return '';
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 60 + 2).toFixed(1)},${(20 - (v - lo) / r * 16).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 64 22" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* Tooltip for chart points (tap on iPhone, hover on Mac) */
(function () {
  let tip = null;
  const hide = () => { tip?.remove(); tip = null; };
  const show = el => {
    const text = el.getAttribute('data-tip');
    if (!text) return;
    hide();
    tip = document.createElement('div');
    tip.className = 'chart-tip';
    tip.textContent = text;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - 80, Math.max(80, r.left + r.width / 2)) + 'px';
    tip.style.top = (r.top + r.height / 2 - 4) + 'px';
    document.body.appendChild(tip);
  };
  document.addEventListener('pointerover', e => { if (e.pointerType === 'mouse' && e.target.matches?.('.chart .hit')) show(e.target); });
  document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.matches?.('.chart .hit')) hide(); });
  document.addEventListener('click', e => { if (e.target.matches?.('.chart .hit')) show(e.target); else hide(); }, true);
  window.addEventListener('scroll', hide, { passive: true });
})();

function metricUnit(def) { return def.kind === 'len' ? U.len() : def.kind === 'mass' ? U.mass() : def.unit; }

/* All metric values for a test, including calculated ones */
function testMetrics(t) {

  if (m.rsiMod == null && m.cmj != null && m.ttt > 0) m.rsiMod = (m.cmj / 100) / m.ttt;
  if (m.cmjRelPP == null && m.cmjPP != null && bm > 0) m.cmjRelPP = m.cmjPP / bm;
  if (m.imtpRel == null && m.imtpPF != null && bm > 0 && (!t.isoType || t.isoType === 'IMTP')) m.imtpRel = m.imtpPF / bm;
  if (m.peakBrakeF != null && bm > 0) m.relBrakeF = m.peakBrakeF / bm;
  if (m.cmjPF != null && bm > 0) m.relPropF = m.cmjPF / bm;
  if (m.imtpF100 != null && m.imtpPF > 0) m.f100Pct = m.imtpF100 / m.imtpPF * 100;
  if (m.cmjPF != null && m.imtpPF > 0 && (!t.isoType || t.isoType === 'IMTP' || t.isoType === 'ISQ')) m.dsi = m.cmjPF / m.imtpPF;

function metricSeries(aid, key) {

/* Trend summary for a series */
function trendOf(series, def) {

  const pct = (a, b) => (b ? (a - b) / Math.abs(b) * 100 : null);
  const t = { last, prev, first, best, n: series.length, isBest: def.dir !== 0 && last.v === best && series.length > 1 };
  t.dPrevPct = prev ? pct(last.v, prev.v) : null;

/* 'good' | 'bad' | 'flat' — flat when within typical error */
function changeClass(def, pctChange) {

}
function deltaHtml(def, pctChange, label = '') {

/* ---------- Velocity-based training ---------- */
const ZONES = [
  { key: 'abs', name: 'Absolute strength', min: 0.15, max: 0.5, pct: '≈ 80–100% 1RM', color: '#d92d3a', use: 'Maximal strength; heavy triples–singles.' },
  { key: 'acc', name: 'Accelerative strength', min: 0.5, max: 0.75, pct: '≈ 65–80% 1RM', color: '#e0661b', use: 'Strength with intent to accelerate; 3–5 reps.' },
  { key: 'ss', name: 'Strength-speed', min: 0.75, max: 1.0, pct: '≈ 45–65% 1RM', color: '#c9a20c', use: 'Moving moderately heavy loads fast; power development.' },
  { key: 'sps', name: 'Speed-strength', min: 1.0, max: 1.3, pct: '≈ 30–45% 1RM', color: '#12965a', use: 'Light loads, high velocity; ballistic emphasis.' },
  { key: 'st', name: 'Starting strength', min: 1.3, max: 1.8, pct: '< 30% 1RM', color: '#2f5bff', use: 'Very light/ballistic; rate of force development.' },
];
function zoneOf(v) { if (v == null) return null; return ZONES.find(z => v >= z.min && v < z.max) || (v >= 1.8 ? ZONES[4] : v < 0.15 ? ZONES[0] : null); }

function parseVels(str) {

}
function velStats(reps) {

}
function linreg(points) {
  const n = points.length;
  if (n < 2) return null;
  const mx = mean(points.map(p => p.x)), my = mean(points.map(p => p.y));
  let sxy = 0, sxx = 0, syy = 0;
  points.forEach(p => { sxy += (p.x - mx) * (p.y - my); sxx += (p.x - mx) ** 2; syy += (p.y - my) ** 2; });
  if (sxx === 0) return null;
  const b = sxy / sxx, a = my - b * mx;
  const r2 = syy === 0 ? 1 : (sxy * sxy) / (sxx * syy);
  return { a, b, r2, n };
}
/* Load–velocity profile from logged sets (fastest rep of each set) */
function lvProfile(aid, exId, { from = null, to = null } = {}) {
  const ex = getExercise(exId);
  const logs = S.vbt.filter(l => l.athleteId === aid && l.exerciseId === exId && l.load > 0 && l.vBest > 0 && (!from || l.date >= from) && (!to || l.date <= to));
  const points = logs.map(l => ({ x: l.load, y: l.vBest, date: l.date, id: l.id }));
  const loads = new Set(points.map(p => round(p.x, 1)));
  const out = { points, logs, ex, loadsN: loads.size, reg: null };
  if (loads.size >= 2) out.reg = linreg(points);
  const v = velocityE1rm(aid, exId, logs);   // only for back squat, front squat, bench press, trap bar deadlift
  Object.assign(out, { lift: v.lift, mvt: v.mvt, mvtSource: v.mvtSource, mvtNote: v.mvtNote, e1rm: v.e1rm, quality: v.quality, excluded: v.excluded || 0 });
  return out;
}
function bestOneRM(aid, exId) {
  const r = e1rmFor(aid, exId);
  if (!r) return null;
  return { kg: r.kg, source: r.source === 'tested' ? 'tested' : 'estimated', date: r.date, conf: r.conf, prof: r.prof };
}

/* ---------- Training load (session-RPE) ---------- */
function sessionLoads(aid) {
  return S.workouts.filter(w => w.athleteId === aid && w.completed && w.rpe != null && w.durationMin > 0).map(w => ({ date: w.date, load: w.rpe * w.durationMin }));
}
function loadWindow(loads, end, days) { const start = addDays(end, -(days - 1)); return loads.filter(l => l.date >= start && l.date <= end).reduce((s, l) => s + l.load, 0); }

  if (daysBetween(firstDate, end) < 21) return null;
  const acute = loadWindow(loads, end, 7);
  const chronic = loadWindow(loads, end, 28) / 4;
  if (!chronic) return null;
  return { acute, chronic, ratio: acute / chronic };
}

/* =========================================================
   Insight engine — rule-based, every rule cites its evidence
   ========================================================= */
const LEVEL_ORDER = { alert: 0, warn: 1, good: 2, info: 3 };
const LEVEL_ICON = { alert: 'alert', warn: 'alert', good: 'checkCircle', info: 'bulb' };

function athleteInsights(a) {
  const out = [];
  const name = a.firstName;
  const T = today();
  const add = (level, title, text, action, refs, extra = {}) => out.push({ id: a.id + ':' + out.length, athleteId: a.id, level, title, text, action, refs, ...extra });
  const tests = testsFor(a.id);
  const lastTest = tests[tests.length - 1];
  const latestOf = key => { const s = metricSeries(a.id, key); return s.length ? s[s.length - 1] : null; };
  const recent = (p, days = 120) => p && daysBetween(p.date, T) <= days;

  /* --- Testing cadence --- */
  if (!tests.length) {
    if (daysBetween(toDS(new Date(a.createdAt || Date.now())), T) >= 3)
      add('info', 'No baseline testing yet', `${name} has no test results on file.`, 'Run a baseline battery (e.g. 10 m sprint, CMJ, drop-jump RSI, IMTP) so progress and readiness can be tracked against their own norms.', ['hopkins2000', 'haugen2016']);
  } else {
    const d = daysBetween(lastTest.date, T);
    if (d > 56) add('info', `Last tested ${plural(Math.round(d / 7), 'week')} ago`, `${name}'s most recent testing was ${fmtDateFull(lastTest.date)}.`, 'Re-test every 4–8 weeks (or at the end of each training block) to confirm the program is working.', ['haugen2016']);
  }

  /* --- DSI --- */
  const dsi = latestOf('dsi');
  if (recent(dsi)) {
    const v = dsi.v, pctTxt = Math.round(v * 100);
    if (v < 0.6) add('warn', `Low DSI (${fmtNum(v, 2)}) — prioritise ballistic & explosive work`, `CMJ peak force is only ${pctTxt}% of IMTP peak force: ${name} has strength they can't yet express quickly.`, 'Emphasise ballistic training — loaded/unloaded jumps, trap-bar jumps at ~20–40% 1RM, Olympic-lift derivatives and plyometrics — while maintaining heavy strength work.', ['sheppard2011', 'comfort2018']);
    else if (v > 0.8) add('warn', `High DSI (${fmtNum(v, 2)}) — prioritise maximal strength`, `CMJ peak force is ${pctTxt}% of IMTP peak force: ${name} already expresses most of their available strength ballistically, so the force ceiling is the limiter.`, 'Emphasise maximal-strength work (≈80–90% 1RM, 2–5 reps; e.g. squat, trap-bar deadlift, IMTP-type pulls) while keeping plyometric exposure.', ['sheppard2011', 'comfort2018', 'suchomel2016']);
    else add('info', `DSI in the balanced range (${fmtNum(v, 2)})`, `CMJ peak force is ${pctTxt}% of IMTP peak force (0.60–0.80 band).`, 'Continue a concurrent approach — heavy strength plus ballistic/plyometric work — and re-assess DSI each block.', ['sheppard2011', 'comfort2018']);
  }

  /* --- EUR --- */
  const eur = latestOf('eur');
  if (recent(eur)) {
    if (eur.v < 1.0) add('warn', `EUR below 1.0 (${fmtNum(eur.v, 2)}) — limited stretch-shortening cycle use`, `${name} jumps no higher with a countermovement than from a static squat position.`, 'Add slow- and fast-SSC plyometrics (countermovement jumps, hurdle hops, low drop jumps) and coach a quick, committed countermovement.', ['mcguigan2006', 'flanagan2008']);
    else if (eur.v >= 1.1) add('good', `Good SSC utilisation (EUR ${fmtNum(eur.v, 2)})`, `${name} gains ${Math.round((eur.v - 1) * 100)}% jump height from the countermovement.`, 'If jump height is still a goal, concentric strength/power (squat jumps, heavy strength) may offer more return than additional SSC work.', ['mcguigan2006']);
  }

  /* --- Drop jump contact time --- */
  const gct = latestOf('djGct');
  if (recent(gct, 90) && gct.v > 0.25) {
    add('info', `Drop-jump contact time ${fmtNum(gct.v * 1000, 0)} ms (>250 ms)`, `This is a slow stretch-shortening response — reactive (fast-SSC) ability isn't being expressed.`, 'Use lower drop heights, cue "bounce off a hot floor", and only progress box height while contact stays under ~250 ms and RSI holds.', ['flanagan2008']);
  }

  /* --- CMJ readiness / adaptation --- */
  const cmjS = metricSeries(a.id, 'cmj');
  if (cmjS.length >= 2) {
    const last = cmjS[cmjS.length - 1];
    const prior = cmjS.slice(-4, -1).map(p => p.v);
    const ref = mean(prior);
    const ch = (last.v - ref) / ref * 100;
    if (daysBetween(last.date, T) <= 21) {
      if (ch <= -M.cmj.te) add('warn', `CMJ down ${fmtNum(-ch, 1)}% vs recent average`, `Latest ${fmtMetric(M.cmj, last.v)} vs ${fmtMetric(M.cmj, ref)} average of the previous ${plural(prior.length, 'test')} — larger than typical test noise (~${M.cmj.te}%).`, 'Possible neuromuscular fatigue. Check sleep, soreness and recent load; consider trimming high-intensity and plyometric volume for 48–72 h, then retest.', ['claudino2017', 'hopkins2000']);
      else if (ch >= M.cmj.te) add('good', `CMJ up ${fmtNum(ch, 1)}% vs recent average`, `Latest ${fmtMetric(M.cmj, last.v)} vs ${fmtMetric(M.cmj, ref)} — a change beyond typical test noise.`, 'Positive adaptation / good readiness. Current loading appears well tolerated.', ['claudino2017', 'hopkins2000']);
    }
  }

  /* --- Meaningful changes in the latest test (vs previous) --- */
  if (lastTest && daysBetween(lastTest.date, T) <= 60) {
    const keys = ['sprint10', 'sprint20', 'sprint30', 'sprint40yd', 'fly10', 'proAgility', 'broad', 'vj', 'djRsi', 'rsiMod', 'rsi105', 'cod505', 'takeoffVel', 'propImp', 'imtpPF', 'imtpF100', 'cmjPP', 'cmjRelPP'];
    const ups = [], downs = [];
    keys.forEach(k => {
      const s = metricSeries(a.id, k);
      if (s.length < 2 || s[s.length - 1].id !== lastTest.id) return;
      const t = trendOf(s, M[k]);
      const line = `${M[k].label}: ${fmtMetric(M[k], t.prev.v)} → ${fmtMetric(M[k], t.last.v)} (${t.dPrevPct > 0 ? '+' : ''}${fmtNum(t.dPrevPct, 1)}%)`;
      if (t.cls === 'good') ups.push(line); else if (t.cls === 'bad') downs.push(line);
    });
    if (ups.length) add('good', `${plural(ups.length, 'meaningful improvement')} in latest testing`, `Changes larger than the typical error of each test (${fmtDate(lastTest.date)}):`, 'Keep the current emphasis; consider progressing load or complexity in the qualities that are improving.', ['hopkins2000'], { list: ups });
    if (downs.length) add('warn', `${plural(downs.length, 'meaningful decline')} in latest testing`, `Changes larger than the typical error of each test (${fmtDate(lastTest.date)}):`, 'Check testing conditions (surface, warm-up, timing method) first; if confirmed, review fatigue, recent load and whether those qualities are still being trained.', ['hopkins2000', 'haugen2016'], { list: downs });
  }

  const s10 = metricSeries(a.id, 'sprint10'), sf = metricSeries(a.id, 'fly10');

    const mv = -(sf[sf.length - 1].v - sf[0].v) / sf[0].v * 100;
    if (mv >= M.fly10.te && acc < M.sprint10.te) add('info', 'Max velocity improving faster than acceleration', `Since ${fmtDate(s10[0].date)}: flying 10 m ${mv > 0 ? 'improved' : 'changed'} ${fmtNum(mv, 1)}%, 10 m acceleration ${fmtNum(acc, 1)}%.`, 'Shift emphasis toward acceleration: resisted sprints (sled loads that keep good posture), 10–20 m starts, and horizontal force work (e.g. heavy sled pushes, horizontal jumps).', ['haugen2016', 'morin2016']);
    else if (acc >= M.sprint10.te && mv < M.fly10.te) add('info', 'Acceleration improving faster than max velocity', `Since ${fmtDate(s10[0].date)}: 10 m acceleration improved ${fmtNum(acc, 1)}%, flying 10 m ${fmtNum(mv, 1)}%.`, 'Add regular max-velocity exposure: flying 10–30 m sprints at ≥95% effort with full recovery (2–3 min per 10 m), plus upright sprint technique drills.', ['haugen2016', 'morin2016']);
  }

  /* --- Asymmetry (all OVR asymmetry metrics) --- */
  const asyms = ASYM_KEYS.map(k => ({ k, p: latestOf(k) })).filter(x => recent(x.p, 90) && x.p.v >= 10);
  if (asyms.length) {
    const worst = asyms.reduce((a, b) => (b.p.v > a.p.v ? b : a));
    const tt = tests.find(t => t.id === worst.p.id);
    const side = tt?.sides?.[worst.k] || (worst.k === 'asym' ? tt?.asymSide : '');
    add(worst.p.v >= 15 ? 'alert' : 'warn', `${M[worst.k].label} ${fmtNum(worst.p.v, 1)}%${side ? ` (${side} greater)` : ''}`, `Asymmetries above ~10–15% have been linked to reduced jump, sprint and change-of-direction performance.${asyms.length > 1 ? ` Also ≥10%: ${asyms.filter(x => x !== worst).map(x => `${M[x.k].label} ${fmtNum(x.p.v, 1)}%`).join(', ')}.` : ''}`, 'Retest to confirm (asymmetry is task-specific and varies session to session) and check whether the same side leads across braking, propulsion and isometric tests. If it persists, add unilateral strength and plyometric work for the weaker side and review injury history.', ['bishop2018']);
  }

  /* --- VBT: velocity loss, readiness, e1RM --- */
  const logs = S.vbt.filter(l => l.athleteId === a.id);
  const recentLogs = logs.filter(l => daysBetween(l.date, T) <= 14 && daysBetween(l.date, T) >= 0);
  const highVL = recentLogs.filter(l => l.vl != null && l.vl > 40);
  if (highVL.length) add('warn', `${plural(highVL.length, 'set')} exceeded 40% velocity loss (last 14 days)`, `High within-set velocity loss means sets are being taken close to failure, increasing fatigue.`, 'For strength and power goals, cap sets at ~10–25% velocity loss; reserve ~40% only for hypertrophy-focused blocks.', ['pareja2017', 'sanchez2011']);

  const exIds = [...new Set(recentLogs.map(l => l.exerciseId))];
  exIds.forEach(exId => {
    const ex = getExercise(exId);
    if (!ex) return;
    const exLogs = logs.filter(l => l.exerciseId === exId && l.vBest > 0 && l.load > 0);
    const lastDate = exLogs.map(l => l.date).sort().pop();
    if (!lastDate || daysBetween(lastDate, T) > 14) return;
    const todays = exLogs.filter(l => l.date === lastDate);
    const diffs = [];
    todays.forEach(l => {
      const prior = exLogs.filter(p => p.date < lastDate && Math.abs(p.load - l.load) <= Math.max(2.5, l.load * 0.025)).map(p => p.vBest);
      if (prior.length >= 2) diffs.push({ d: l.vBest - mean(prior), load: l.load, v: l.vBest, ref: mean(prior) });

      if (avg <= -0.06) add('warn', `${ex.name}: bar speed ${fmtNum(-avg, 2)} m/s below normal`, `${fmtDate(lastDate)} — ${fmtMass(ex1.load)} moved at ${fmtNum(ex1.v, 2)} m/s vs a usual ${fmtNum(ex1.ref, 2)} m/s at that load.`, 'Reduced readiness is likely. Autoregulate: reduce the load (≈5–10%) to hit the prescribed velocity, or cut a set, rather than grinding through the planned loads.', ['gonzalez2010', 'weakley2021']);
      else if (avg >= 0.06) add('good', `${ex.name}: bar speed ${fmtNum(avg, 2)} m/s above normal`, `${fmtDate(lastDate)} — ${fmtMass(ex1.load)} moved at ${fmtNum(ex1.v, 2)} m/s vs a usual ${fmtNum(ex1.ref, 2)} m/s.`, 'Good readiness / strength gain. If velocities stay above target, increase load (≈2.5–5%) until bar speed is back in the prescribed zone.', ['gonzalez2010', 'weakley2021']);

      }

  return out.sort((x, y) => LEVEL_ORDER[x.level] - LEVEL_ORDER[y.level]);

    ${isNew ? field('Repeat', sel('repeat', [['1', 'Does not repeat'], ['2', 'Weekly for 2 weeks'], ['4', 'Weekly for 4 weeks'], ['6', 'Weekly for 6 weeks'], ['8', 'Weekly for 8 weeks'], ['12', 'Weekly for 12 weeks'], ['16', 'Weekly for 16 weeks']], '1')) : ''}
    ${!isNew && series.length > 1 ? `<label class="check"><input type="checkbox" name="applySeries"> Apply time, athletes, type & details to all later events in this series (${series.filter(x => x.date > e.date).length})</label>` : ''}
    ${!isNew ? eventLinks(e) : ''}`;

    title: isNew ? 'New event' : 'Edit event', body, submit: isNew ? 'Add' : 'Save',

      if (!isDS(v.date)) return 'Please choose a date.';

        if (v.applySeries) {
          series.filter(x => x.date > ev.date && x.id !== rec.id).forEach(x => upsert('events', { ...x, type: rec.type, athleteIds: rec.athleteIds, title: rec.title, start: rec.start, duration: rec.duration, location: rec.location, notes: rec.notes }));

function weeklyLoadBars(aid) {
  const loads = sessionLoads(aid);
  if (!loads.length) return '';
  const w0 = startOfWeek(today());
  const bars = [...Array(8)].map((_, i) => {
    const ws = addDays(w0, -7 * (7 - i)), we = addDays(ws, 6);
    const v = loads.filter(l => l.date >= ws && l.date <= we).reduce((s, l) => s + l.load, 0);
    return { label: fmtDate(ws, { month: 'numeric', day: 'numeric' }), v, tip: `Week of ${fmtDate(ws)}: ${fmtNum(v, 0)} AU`, dim: i === 7 };
  });
  return chart({ type: 'bar', bars, h: 150 });
}

          ${t.dPrevPct != null ? `<span>vs prev ${deltaHtml(m, t.dPrevPct)}</span>` : ''}
          ${t.n > 2 ? `<span>vs first ${deltaHtml(m, t.dBasePct)}</span>` : ''}
          ${m.dir ? `<span>Best ${esc(fmtMetric(m, t.best))}</span>` : ''}
          <span>${plural(t.n, 'test')}</span>
        </div>
        ${s.length > 1 ? chart({ type: 'line', points: pts, h: 140, color: c.color, ...ref }) : ''}
      </div>`;
    }).join('');
    return `<div class="section-title">${esc(c.label)}</div><div class="grid metrics">${cards}</div>`;
  }).join('');
  const table = `<div class="section-title">Test history</div><div class="card flush"><div class="table-wrap"><table class="t">
    <thead><tr><th>Date</th><th>Results</th><th class="n">Body mass</th><th></th></tr></thead>
    <tbody>${[...tests].reverse().map(t => {
      const keys = Object.keys(t.m || {}).filter(k => M[k]);
      return `<tr class="click" data-act="editTest" data-id="${t.id}"><td class="nowrap">${esc(fmtDateFull(t.date))}</td>
        <td>${keys.slice(0, 4).map(k => `<span class="nowrap">${esc(M[k].label)} <b>${esc(fmtMetric(M[k], t.m[k]))}</b></span>`).join(' · ')}${keys.length > 4 ? ` <span class="faint">+${keys.length - 4} more</span>` : ''}${t.notes ? `<div class="faint small">${esc(t.notes)}</div>` : ''}</td>
        <td class="n nowrap">${t.bodyMassKg ? esc(fmtMass(t.bodyMassKg)) : '–'}</td><td>${icon('chevR', 'sm')}</td></tr>`;
    }).join('')}</tbody></table></div></div>`;
  const filter = `<div class="chips scroll" style="margin-bottom:4px"><button class="chip ${cat === 'all' ? 'on' : ''}" data-act="testCat" data-a="${a.id}" data-v="all">All</button>${cats.map(c => `<button class="chip ${cat === c.key ? 'on' : ''}" data-act="testCat" data-a="${a.id}" data-v="${c.key}">${esc(c.label)}</button>`).join('')}</div>`;
  return {
    body: filter + sections + table + `<p class="faint tiny" style="margin-top:12px">Tap any chart point for its value. Changes are coloured only when they exceed the approximate typical error of the test (e.g. ~2% for 10 m sprint, ~4% for CMJ height) — see <a href="#/references">methods & references</a>.</p>`,
    actions: `<button class="btn primary" data-act="newTest" data-athlete="${a.id}">${icon('plus', 'sm')}<span class="lbl">Add test</span></button>`,
  };
}

function openTestModal(aid, test, def = {}) {
  const isNew = !test;
  const a = aid ? getAthlete(aid) : null;
  const lastBm = aid ? [...testsFor(aid)].reverse().find(t => t.bodyMassKg)?.bodyMassKg : null;
  const t = test ? { ...test, m: { ...(test.m || {}) }, sides: { ...(test.sides || {}) } } : { athleteId: aid, date: def.date || today(), m: {}, sides: {}, isoType: 'IMTP', bodyMassKg: a?.massKg ?? lastBm ?? null, notes: '' };
  if (t.asymSide && !t.sides.asym) t.sides.asym = t.asymSide;
  const groups = TEST_CATS.filter(c => !['derived', 'body'].includes(c.key)).map(c => {
    const defs = METRICS.filter(m => m.cat === c.key && !m.calc);
    if (!defs.length) return '';
    const has = defs.filter(m => t.m[m.key] != null).length;
    return `<details class="group" ${isNew || has ? 'open' : ''}><summary>${esc(c.label)} ${has ? `<span class="count">${has} entered</span>` : ''}</summary><div class="group-body"><div class="fields">
      ${c.key === 'iso' ? field('Test', sel('isoType', ISO_TYPES, t.isoType || 'IMTP'), { cls: 'full', hint: 'DSI uses IMTP (or isometric squat) peak force.' }) : ''}
      ${defs.map(m => field(esc(m.label), numInp('m_' + m.key, t.m[m.key] != null ? inVal(metricDisp(m, t.m[m.key]), m.kind === 'len' ? 1 : m.dec) : '', `placeholder="${esc(m.hint && m.hint.startsWith('e.g.') ? m.hint.slice(5) : '')}" data-input="testPreview"`), { unit: metricUnit(m), hint: m.hint && !m.hint.startsWith('e.g.') && m.hint.length < 40 ? esc(m.hint) : '' }) + (m.side ? field(esc(m.label.replace(/ asymmetry$/i, '')) + ' — greater side', sel('side_' + m.key, [['', '—'], ['Left', 'Left'], ['Right', 'Right']], t.sides[m.key] || '')) : '')).join('')}
    </div></div></details>`;
  }).join('');
  const body = `
    ${!aid ? field('Athlete', sel('athleteId', athleteOptions(), '', 'required')) : ''}
    <div class="fields">
      ${field('Test date', inp('date', t.date, 'type="date" required'))}
      ${field('Body mass', numInp('bodyMass', t.bodyMassKg != null ? inVal(U.massOut(t.bodyMassKg), 1) : '', 'data-input="testPreview"'), { unit: U.mass(), hint: 'Used for relative force/power' })}
    </div>
    <div class="computed" id="testCalc">Enter results — calculated values (RSI, RSI-mod, DSI, EUR, max velocity, relative force/power) appear here.</div>
    <p class="faint small" style="margin:-4px 0 12px">Fill in only what you tested. Leave the rest blank.</p>
    ${groups}
    ${field('Notes', ta('notes', t.notes, 'rows="2" placeholder="Conditions, surface, timing system, device…"'))}`;
  const read = form => {
    const fdv = formData(form), m = {}, errs = [];
    METRICS.filter(d => !d.calc).forEach(d => {
      const raw = fdv['m_' + d.key];
      if (raw == null || raw.trim() === '') return;
      const v = num(raw);
      if (v == null || v < 0) { errs.push(`${d.label}: “${raw}” isn't a valid number.`); return; }
      if (d.unit === '%' && v > 100) { errs.push(`${d.label} must be 0–100%.`); return; }
      if (d.unit === 's' && (v <= 0 || v > 120)) { errs.push(`${d.label}: enter seconds (e.g. 1.85).`); return; }
      m[d.key] = d.kind === 'len' ? U.lenIn(v) : v;
    });
    const bm = num(fdv.bodyMass);
    return { fdv, m, errs, bm: bm != null && bm > 0 ? U.massIn(bm) : null };
  };
  openModal({
    title: isNew ? `New test${a ? ' — ' + athleteName(a, true) : ''}` : `Edit test — ${athleteName(a, true)}`, body, size: 'wide', submit: 'Save',
    onSubmit: (v, form) => {
      const { m, errs, bm } = read(form);
      const athleteId = aid || v.athleteId;
      if (!athleteId) return 'Please choose an athlete.';
      if (!isDS(v.date)) return 'Please choose a test date.';
      if (errs.length) return errs.join(' ');
      if (!Object.keys(m).length) return 'Enter at least one result.';
      const sides = {};
      ASYM_KEYS.forEach(k => { if (m[k] != null && v['side_' + k]) sides[k] = v['side_' + k]; });
      upsert('tests', { ...t, athleteId, date: v.date, m, sides, asymSide: sides.asym || '', isoType: v.isoType || t.isoType || 'IMTP', bodyMassKg: bm, notes: v.notes.trim() });
      toast('Test saved');
      if (!aid) go(`#/athlete/${athleteId}/testing`); else refresh();
    },
    onDelete: isNew ? null : async () => {
      if (!(await confirmBox('Delete this test?', `All results from ${fmtDateFull(t.date)} will be removed.`))) return false;
      removeRec('tests', t.id); toast('Test deleted'); refresh();
    },
    onMount: m => {
      A.testPreview = () => {
        const { m: vals, bm } = read(m.form);
        const tm = testMetrics({ m: vals, bodyMassKg: bm, isoType: m.form.isoType?.value });
        const out = [];
        if (vals.djRsi == null && tm.djRsi != null) out.push(`Drop jump RSI <b>${fmtNum(tm.djRsi, 2)}</b>`);
        if (vals.rsiMod == null && tm.rsiMod != null) out.push(`RSI-mod <b>${fmtNum(tm.rsiMod, 2)}</b>`);
        if (tm.dsi != null) out.push(`DSI <b>${fmtNum(tm.dsi, 2)}</b>`);
        if (tm.eur != null) out.push(`EUR <b>${fmtNum(tm.eur, 2)}</b>`);
        if (tm.vmax != null) out.push(`Max velocity <b>${fmtNum(tm.vmax, 2)} m/s</b>`);
        if (vals.cmjRelPP == null && tm.cmjRelPP != null) out.push(`Rel. power <b>${fmtNum(tm.cmjRelPP, 1)} W/kg</b>`);
        if (vals.imtpRel == null && tm.imtpRel != null) out.push(`Rel. peak force <b>${fmtNum(tm.imtpRel, 1)} N/kg</b>`);
        if (tm.relBrakeF != null) out.push(`Rel. braking force <b>${fmtNum(tm.relBrakeF, 1)} N/kg</b>`);
        if (tm.f100Pct != null) out.push(`F100 <b>${fmtNum(tm.f100Pct, 0)}%</b> of peak`);
        $('#testCalc', m.wrap).innerHTML = out.length ? 'Calculated: ' + out.join(' · ') : 'Enter results — calculated values (RSI, RSI-mod, DSI, EUR, max velocity, relative force/power) appear here.';
      };
      A.testPreview();
    },
  });
}

/* ---------------- Sessions & notes tab ---------------- */
function athHistory(a) {
  const T = today();
  const evs = eventsFor(a.id).sort((x, y) => (y.date + y.start).localeCompare(x.date + x.start));
  const past = evs.filter(e => e.date < T || (e.date === T && e.status !== 'scheduled'));
  const fut = evs.filter(e => !past.includes(e)).reverse();
  const notes = S.notes.filter(n => n.athleteId === a.id).sort((x, y) => y.date.localeCompare(x.date) || y.createdAt - x.createdAt);
  const counts = { completed: past.filter(e => athleteStatus(e, a.id) === 'completed').length, noshow: past.filter(e => athleteStatus(e, a.id) === 'noshow').length, cancelled: past.filter(e => e.status === 'cancelled').length };
  const attended = counts.completed + counts.noshow ? Math.round(counts.completed / (counts.completed + counts.noshow) * 100) : null;
  return {
    body: `<div class="grid halves">
      <div class="col">
        <div class="card"><div class="card-head"><h3>Notes</h3><button class="btn sm" data-act="newNote" data-athlete="${a.id}">${icon('plus', 'sm')}Add note</button></div>
          ${notes.length ? `<div class="list">${notes.map(n => `<button class="row" data-act="editNote" data-id="${n.id}" style="align-items:flex-start"><span class="row-time" style="width:64px">${esc(fmtDate(n.date))}</span><span class="row-main" style="white-space:pre-wrap">${esc(n.text)}</span></button>`).join('')}</div>` : `<div class="muted small">Session observations, conversations with parents/coaches, injury updates…</div>`}
        </div>
      </div>
      <div class="col">
        <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:0">
          <div class="stat"><div class="stat-label">Completed</div><div class="stat-value">${counts.completed}</div></div>
          <div class="stat"><div class="stat-label">Attendance</div><div class="stat-value">${attended != null ? attended + '%' : '–'}</div></div>
          <div class="stat"><div class="stat-label">Upcoming</div><div class="stat-value">${fut.length}</div></div>
        </div>
        <div class="card"><div class="card-head"><h3>Upcoming sessions</h3></div>${fut.length ? `<div class="list">${fut.slice(0, 10).map(e => eventRow(e, { showDate: true })).join('')}</div>` : '<div class="muted small">None scheduled.</div>'}</div>
        <div class="card"><div class="card-head"><h3>Past sessions</h3><span class="sub">${past.length}</span></div>${past.length ? `<div class="list">${past.slice(0, 30).map(e => eventRow(e, { showDate: true })).join('')}</div>` : '<div class="muted small">No past sessions.</div>'}</div>
      </div></div>`,
    actions: `<button class="btn primary" data-act="newNote" data-athlete="${a.id}">${icon('plus', 'sm')}<span class="lbl">Note</span></button>`,
  };
}
A.newNote = el => openNoteModal({ athleteId: el.dataset.athlete, date: today(), text: '' });
A.editNote = el => { const n = getRec('notes', el.dataset.id); if (n) openNoteModal(n); };
function openNoteModal(n) {

/* ---------------- Group (weekly) testing ---------------- */
const GROUP_METRICS = ['sprint10', 'sprint10yd', 'sprint20', 'sprint40yd', 'fly10', 'fly10yd', 'proAgility', 'cod505', 'cmj', 'broad', 'vj', 'rsiMod', 'djRsi', 'rsi105', 'takeoffVel', 'imtpPF'];
A.groupTest = () => {
  const ath = activeAthletes();
  if (!ath.length) return toast('Add athletes first');
  const st = { date: today(), keys: UI.groupKeys || ['sprint10', 'sprint20', 'fly10'], ids: ath.map(a => a.id), vals: {} };
  const grid = () => {
    const keys = st.keys, list = ath.filter(a => st.ids.includes(a.id));
    if (!keys.length || !list.length) return '<div class="muted small">Choose at least one test and one athlete.</div>';
    return `<div class="table-wrap"><table class="t grid-entry"><thead><tr><th>Athlete</th>${keys.map(k => `<th>${esc(M[k].label)}<div class="faint" style="text-transform:none;letter-spacing:0">${esc(metricUnit(M[k]) || '')}</div></th>`).join('')}</tr></thead><tbody>
      ${list.map(a => `<tr><td class="nowrap"><b>${esc(athleteName(a, true))}</b></td>${keys.map(k => `<td><input type="text" inputmode="decimal" data-g="${a.id}|${k}" value="${esc(st.vals[a.id + '|' + k] ?? '')}" aria-label="${esc(athleteName(a) + ' ' + M[k].label)}"></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  };
  openModal({
    title: 'Group testing', size: 'wide', submit: 'Save results',
    body: `${field('Date', inp('date', st.date, 'type="date"'))}
      <div class="field"><span class="field-label">Tests</span><div class="chips" id="gKeys">${groupMetrics().map(k => `<button type="button" class="chip ${st.keys.includes(k) ? 'on' : ''}" data-gk="${k}">${esc(M[k].label)}</button>`).join('')}</div></div>
      <div class="field"><span class="field-label">Athletes <span class="u"><button type="button" class="link" data-gall>All</button> · <button type="button" class="link" data-gnone>None</button></span></span><div class="chips" id="gIds">${ath.map(a => `<button type="button" class="chip ${st.ids.includes(a.id) ? 'on' : ''}" data-gi="${a.id}">${esc(athleteName(a, true))}</button>`).join('')}</div></div>
      <div id="gGrid">${grid()}</div>
      <p class="faint small">Results are added to each athlete’s test for that date (merged if they already have one). Leave cells blank for tests an athlete didn’t do.</p>`,
    onSubmit: v => {
      if (!isDS(v.date)) return 'Choose a date.';
      const errs = [];
      let saved = 0;
      st.ids.forEach(aid => {
        const m = {};
        st.keys.forEach(k => {
          const raw = st.vals[aid + '|' + k];
          if (raw == null || String(raw).trim() === '') return;
          const x = num(raw);
          if (x == null || x <= 0) { errs.push(`${athleteName(getAthlete(aid), true)} · ${M[k].label}: “${raw}”`); return; }
          m[k] = M[k].kind === 'len' ? U.lenIn(x) : x;
        });
        if (!Object.keys(m).length || errs.length) return;
        const ex = S.tests.find(t => t.athleteId === aid && t.date === v.date);
        const a = getAthlete(aid);
        if (ex) upsert('tests', { ...ex, m: { ...ex.m, ...m } });
        else upsert('tests', { athleteId: aid, date: v.date, m, sides: {}, isoType: 'IMTP', bodyMassKg: a.massKg ?? null, notes: 'Group testing' });
        saved++;
      });
      if (errs.length) return 'Check these values: ' + errs.join('; ');
      if (!saved) return 'Enter at least one result.';
      UI.groupKeys = st.keys;
      toast(`Saved results for ${plural(saved, 'athlete')}`); refresh();
    },
    onMount: m => {
      const redraw = () => { $('#gGrid', m.wrap).innerHTML = grid(); };
      m.wrap.addEventListener('input', e => { const g = e.target.dataset.g; if (g) st.vals[g] = e.target.value; });
      m.wrap.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.dataset.g) {
          e.preventDefault();
          const inputs = $$('[data-g]', m.wrap); const i = inputs.indexOf(e.target);
          const cols = st.keys.length; const next = inputs[i + cols] || inputs[(i % cols) + 1];
          next?.focus(); next?.select?.();
        }
      });
      m.wrap.addEventListener('click', e => {
        const k = e.target.closest('[data-gk]'), id = e.target.closest('[data-gi]');
        if (k) { const key = k.dataset.gk; st.keys = st.keys.includes(key) ? st.keys.filter(x => x !== key) : [...st.keys, key]; k.classList.toggle('on'); redraw(); }
        if (id) { const x = id.dataset.gi; st.ids = st.ids.includes(x) ? st.ids.filter(y => y !== x) : [...st.ids, x]; id.classList.toggle('on'); redraw(); }
        if (e.target.closest('[data-gall]')) { st.ids = ath.map(a => a.id); $$('[data-gi]', m.wrap).forEach(b => b.classList.add('on')); redraw(); }
        if (e.target.closest('[data-gnone]')) { st.ids = []; $$('[data-gi]', m.wrap).forEach(b => b.classList.remove('on')); redraw(); }
      });
      m.form.date.addEventListener('change', e => { st.date = e.target.value; });
    },
  });
};

/* =========================================================
   Programming: athlete program calendar & workout builder
   ========================================================= */
const INTENSITY = [['load', 'Load'], ['pct', '% 1RM'], ['rir', 'Reps in reserve (RIR)'], ['zone', 'Velocity zone'], ['vel', 'Target velocity'], ['rpe', 'RPE'], ['bw', 'Bodyweight / none']];

function athProgram(a, r) {
  const P = (UI.prog[a.id] ||= { cursor: today(), sel: today() });
  if (r.q.d && isDS(r.q.d) && P._deep !== r.q.d) { P.sel = r.q.d; P.cursor = r.q.d; P._deep = r.q.d; }
  const wos = S.workouts.filter(w => w.athleteId === a.id);
  const evs = eventsFor(a.id);
  const d = parseDS(P.cursor);
  const grid = monthGrid(P.cursor, P.sel, ds => {
    const dw = wos.filter(w => w.date === ds);
    const de = evs.filter(e => e.date === ds && e.status !== 'cancelled');
    const chips = dw.map(w => `<span class="ev-chip ${w.completed ? 'done' : ''}" style="--c:${w.completed ? 'var(--good)' : 'var(--accent)'}">${w.completed ? '✓ ' : ''}${esc(w.title || 'Workout')}</span>`).join('');
    const evc = de.map(e => `<span class="ev-chip" style="--c:${typeColor(e.type)};opacity:.7">${e.start ? esc(fmtTime(e.start)) + ' ' : ''}${esc(typeLabel(e.type))}</span>`).join('');
    const dots = `<span class="dots">${dw.map(w => `<span class="dot" style="--c:${w.completed ? 'var(--good)' : 'var(--accent)'}"></span>`).join('')}${de.map(e => `<span class="dot wodot" style="border-color:${typeColor(e.type)}"></span>`).join('')}</span>`;
    return chips + evc + dots;
  }, 'progSelect');
  const dayWos = wos.filter(w => w.date === P.sel);
  const dayEvs = evs.filter(e => e.date === P.sel);
  const done = wos.filter(w => w.completed).length;
  const body = `
    <div class="cal-bar">
      <button class="btn icon" data-act="progNav" data-a="${a.id}" data-d="-1" aria-label="Previous month">${icon('chevL')}</button>
      <button class="btn icon" data-act="progNav" data-a="${a.id}" data-d="1" aria-label="Next month">${icon('chevR')}</button>
      <h3>${esc(d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</h3>
      <button class="btn sm" data-act="progToday" data-a="${a.id}">Today</button>
      <span class="grow"></span>
      <span class="faint small">${plural(wos.length, 'workout')} · ${done} completed</span>
    </div>
    ${grid}
    <div class="agenda-day">
      <div class="split" style="margin-bottom:8px;flex-wrap:wrap"><h4 class="${P.sel === today() ? 'is-today' : ''}" style="margin:0">${esc(fmtDateLong(P.sel))}</h4>
        <div class="chips"><button class="btn sm" data-act="copyWeek" data-a="${a.id}" data-date="${P.sel}">${icon('copy', 'sm')}Copy week</button><button class="btn sm primary" data-act="newWorkout" data-a="${a.id}" data-date="${P.sel}">${icon('plus', 'sm')}Workout</button></div></div>
      ${dayEvs.length ? `<div class="card" style="padding:4px 12px;margin-bottom:12px">${dayEvs.map(e => eventRow(e)).join('')}</div>` : ''}
      ${dayWos.length ? dayWos.map(w => workoutCard(w)).join('') : `<div class="card">${emptyState_('dumbbell', 'No workout programmed', 'Build a session from your exercise library with sets, reps, loads, %1RM or velocity targets.', `<button class="btn primary" data-act="newWorkout" data-a="${a.id}" data-date="${P.sel}">${icon('plus', 'sm')}Add workout</button>`)}</div>`}
    </div>`;
  return { body, actions: `<button class="btn primary" data-act="newWorkout" data-a="${a.id}" data-date="${P.sel}">${icon('plus', 'sm')}<span class="lbl">Workout</span></button>` };
}

function intensityText(it, aid) {
  const orm = it.exerciseId ? bestOneRM(aid, it.exerciseId) : null;
  switch (it.intensity) {
    case 'load': return it.loads?.length > 1 ? `<b>${it.loads.map(x => esc(fmtMass(x, false))).join(' / ')} ${U.mass()}</b> <span class="faint">by set</span>` : it.load != null ? `<b>${esc(fmtMass(it.load))}</b>` : '';
    case 'rir': {

      const rec = { ...w, items, log: cleanLog, logMode, rpe: v.rpe === '' ? (w.rpe ?? null) : +v.rpe, durationMin: dur ? Math.round(dur) : (w.durationMin ?? null), completedNotes: v.completedNotes.trim(), completed: !!v.complete };
      delete rec._new;
      const saved = upsert('workouts', rec);
      const keep = new Set();
      items.forEach(it => (cleanLog[it.id] || []).forEach((r, i) => {
        if (r.load == null) return;
        const id = `${saved.id}~${it.id}~${i}`;
        const old = getRec('vbt', id);
        const base = { ...(old || {}), id, athleteId: saved.athleteId, exerciseId: it.exerciseId, date: saved.date, load: r.load, peak: old?.peak ?? null, notes: old?.notes || '', workoutId: saved.id };
        if (r.avg > 0) {
          keep.add(id);
          upsert('vbt', { ...base, reps: [], n: r.reps ?? null, vBest: r.avg, vMean: r.avg, vl: null, entry: 'avg' });
          return;
        }
        const reps = parseVels(r.vels);
        if (!reps.length) return;
        const stv = velStats(reps);
        keep.add(id);
        upsert('vbt', { ...base, reps, n: reps.length > 1 ? stv.n : (r.reps ?? 1), vBest: stv.best, vMean: stv.mean, vl: reps.length > 1 ? stv.vl : null, entry: 'reps' });
      }));
      S.vbt.filter(l => l.workoutId === saved.id && String(l.id).startsWith(saved.id + '~') && !keep.has(l.id)).forEach(l => removeRec('vbt', l.id));
      rst.workoutId = saved.id; saveReady(rst);
      clearDraft();
      if (rec.completed) S.events.filter(e => e.date === saved.date && (e.athleteIds || []).includes(saved.athleteId) && e.status === 'scheduled' && e.type === 'session').forEach(e => upsert('events', { ...e, status: 'completed' }));
      toast(`Session saved${keep.size ? ` · ${plural(keep.size, 'VBT set')}` : ''}`);
      refresh();
    },
    onMount: m => {
      const host = $('#logItems', m.wrap);
      bindReadyForm(m.wrap, rst, () => { const e = readyEval(readyRecFrom(rst)); const c = $('[data-ready-chip]', m.wrap); if (c && e.status) { const s = READY_STATUS[e.status]; c.innerHTML = `<span class="badge ${s.cls}">${esc(s.short)}</span>`; } saveDraft(); });
      $('[data-discard-draft]', m.wrap)?.addEventListener('click', async () => {
        if (!(await confirmBox('Discard the restored entries?', 'The session log goes back to what was last saved.'))) return;
        clearDraft(); m.close(); openSessionLogger(getRec('workouts', src.id) || { ...src, items: src.items || [] });
      });
      const redrawItem = id => { const it = w.items.find(x => x.id === id); const blk = $(`[data-block="${id}"]`, host); if (it && blk) blk.outerHTML = itemHtml(it); };
      const refreshCalc = (row, it, r) => {
        const calc = $('[data-calc]', row);
        if (calc) { const tmp = document.createElement('div'); tmp.innerHTML = rowHtml(it, r, +row.dataset.i); calc.innerHTML = $('[data-calc]', tmp).innerHTML; }
      };
      host.addEventListener('input', e => {
        const row = e.target.closest('.log-row'); const k = e.target.dataset.k;
        if (!row || !k) return;
        const id = row.dataset.item, rows = log[id], r = rows[+row.dataset.i];
        const it = w.items.find(x => x.id === id);
        if (k === 'load') {
          const x = num(e.target.value); r.load = x != null ? U.massIn(x) : null; r._t = true;
          if (!(it.loads?.length > 1)) for (let j = +row.dataset.i + 1; j < rows.length && !rows[j]._t; j++) {
            rows[j].load = r.load;
            const rj = $(`.log-row[data-item="${id}"][data-i="${j}"]`, host);
            const li = rj && $('[data-k="load"]', rj);
            if (li) { li.value = r.load != null ? inVal(U.massOut(r.load), 1) : ''; refreshCalc(rj, it, rows[j]); }
          }
        }
        else if (k === 'reps') r.reps = num(e.target.value) != null ? Math.round(num(e.target.value)) : null;
        else if (k === 'rpe') r.rpe = num(e.target.value);
        else if (k === 'avg') r.avg = num(e.target.value);
        else if (k === 'vels') {
          r.vels = e.target.value;
          const reps = parseVels(r.vels);
          if (reps.length > 1 && (r.reps == null || r.reps < reps.length)) { r.reps = reps.length; const ri = $('[data-k="reps"]', row); if (ri) ri.value = r.reps; }
        }
        refreshCalc(row, it, r);
        saveDraft();
      });
      host.addEventListener('click', e => {
        const vm = e.target.closest('[data-vmode]');
        if (vm) { mode[vm.dataset.item] = vm.dataset.vmode; S.settings.vbtEntry = vm.dataset.vmode; persist(); redrawItem(vm.dataset.item); saveDraft(); return; }
        const add = e.target.closest('[data-add-set]');
        if (add) { const id = add.dataset.addSet; const rows = (log[id] ||= []); const last = rows[rows.length - 1]; rows.push({ load: last?.load ?? null, reps: last?.reps ?? null, vels: '', avg: null, rpe: null }); redrawItem(id); saveDraft(); return; }
        const rm = e.target.closest('[data-rm-set]');
        if (rm) { const row = rm.closest('.log-row'); log[row.dataset.item].splice(+row.dataset.i, 1); redrawItem(row.dataset.item); saveDraft(); }
      });
      $('[data-add-ex]', m.wrap).addEventListener('change', e => {
        const exId = e.target.value;
        if (!exId) return;
        const it = { ...blankItem({ intensity: 'load' }), exerciseId: exId, sets: '1', reps: '' };
        w.items.push(it);
        log[it.id] = [{ load: null, reps: null, vels: '', avg: null, rpe: null }];
        host.insertAdjacentHTML('beforeend', itemHtml(it));
        saveDraft();
        e.target.value = '';
        $(`[data-block="${it.id}"] input`, host)?.focus();
      });
    },
  });
}

function lvProfileCard(aid, exId, win, exAct, winAct, exIds) {
  const ex = getExercise(exId);
  const from = win === 'all' ? null : addDays(today(), -(+win));
  const p = lvProfile(aid, exId, { from });
  const all = lvProfile(aid, exId);
  const pts = all.points.map(q => ({ x: U.massOut(q.x), y: q.y, old: from && q.date < from, tip: `${fmtDate(q.date)} · ${fmtMass(q.x)} @ ${fmtNum(q.y, 2)} m/s`, color: from && q.date < from ? 'var(--text-3)' : 'var(--accent)' }));
  const reg = p.reg;
  const conv = U.imp() ? 2.2046226218 : 1;
  const spec = { type: 'scatter', points: pts, h: 260, xLabel: `Load (${U.mass()})`, yLabel: 'Fastest-rep velocity (m/s)' };
  if (reg && reg.b < 0) {
    const maxX = p.e1rm || Math.max(...p.points.map(q => q.x));
    spec.line = { a: reg.a, b: reg.b / conv, from: 0, to: U.massOut(maxX) };
  }
  if (p.mvt) { spec.hline = p.mvt; spec.hlineLabel = `MVT ${fmtNum(p.mvt, 2)} m/s`; }
  if (p.e1rm) spec.marker = { x: U.massOut(p.e1rm), y: p.mvt, label: `e1RM ${fmtMass(p.e1rm)}`, tip: `Estimated 1RM ${fmtMass(p.e1rm)}` };
  const pctRows = p.e1rm && reg ? [95, 90, 85, 80, 75, 70, 65, 60, 50, 40, 30].map(pc => {
    const kg = p.e1rm * pc / 100, v = reg.a + reg.b * kg, z = zoneOf(v);
    return `<tr><td>${pc}%</td><td class="n">${esc(fmtMass(roundLoad(kg)))}</td><td class="n">${fmtNum(v, 2)}</td><td><span class="zone-sw" style="background:${z?.color || 'var(--text-3)'}"></span>${esc(z?.name || '')}</td></tr>`;
  }).join('') : '';
  const quality = reg ? (reg.r2 >= 0.9 ? ['good', 'Strong fit'] : reg.r2 >= 0.75 ? ['warn', 'Moderate fit'] : ['bad', 'Weak fit']) : null;
  return `<div class="card">
    <div class="card-head" style="flex-wrap:wrap"><h3>Load–velocity profile</h3>
      ${exIds && exIds.length ? sel('ex', exIds.map(id => [id, getExercise(id).name]), exId, `data-change="${exAct}" style="width:auto;min-height:34px;padding-top:5px;padding-bottom:5px" aria-label="Exercise"`) : ''}
      ${sel('win', [['28', 'Last 4 weeks'], ['42', 'Last 6 weeks'], ['84', 'Last 12 weeks'], ['all', 'All time']], win, `data-change="${winAct}" style="width:auto;min-height:34px;padding-top:5px;padding-bottom:5px" aria-label="Window"`)}
    </div>
    ${all.points.length ? chart(spec) : '<div class="muted small">No sets logged for this exercise.</div>'}
    <div class="kv" style="margin-top:10px">
      <span>Sets <b>${p.points.length}</b></span><span>Distinct loads <b>${p.loadsN}</b></span>
      ${reg ? `<span>R² <b>${fmtNum(reg.r2, 2)}</b> <span class="badge ${quality[0]}">${quality[1]}</span></span><span>Slope <b>${fmtNum(reg.b * 10, 3)}</b> m/s per 10 kg</span>` : ''}
      ${p.e1rm ? `<span>Estimated 1RM <b>${esc(fmtMass(p.e1rm))}</b></span>` : ''}
    </div>
    ${!p.lift && ex ? `<div class="faint small" style="margin-top:8px">Estimated 1RM is calculated for back squat, front squat, bench press and trap bar deadlift only.</div>` : ''}
    ${p.lift ? `<div class="faint small" style="margin-top:8px">Velocity threshold ${fmtNum(p.mvt, 2)} m/s — ${esc(p.mvtNote)}.${p.excluded ? ` ${p.excluded} set-average set(s) of 3+ reps not used for the estimate.` : ''}${!p.e1rm ? ' Needs sets at 3+ distinct loads (≈40–90% 1RM) in this window to estimate 1RM.' : ''}</div>` : ''}
    ${pctRows ? `<details class="group" style="margin-top:14px"><summary>Load & velocity targets by %1RM</summary><div class="group-body table-wrap"><table class="t"><thead><tr><th>%1RM</th><th class="n">Load</th><th class="n">Velocity</th><th>Zone</th></tr></thead><tbody>${pctRows}</tbody></table>
      <p class="faint tiny" style="margin-top:8px">From this athlete's own profile. Estimated 1RMs can over-predict (Banyard et al. 2017) — treat as guidance.</p></div></details>` : ''}
  </div>`;
}

  const out = $('#vlOut');
  if (!reps.length) { out.innerHTML = 'Enter rep velocities to see velocity loss and where to stop the set.'; return; }
  const st = velStats(reps);
  let stopAt = null;
  if (cut > 0) { const best = []; for (let i = 0; i < reps.length; i++) { best.push(reps[i]); const b = Math.max(...best); if ((b - reps[i]) / b * 100 >= cut) { stopAt = i + 1; break; } } }
  const z = zoneOf(st.best);
  out.innerHTML = `Reps <b>${st.n}</b> · fastest <b>${fmtNum(st.best, 2)}</b> · mean <b>${fmtNum(st.mean, 2)}</b> · last <b>${fmtNum(st.last, 2)}</b> m/s<br>
    Velocity loss <b style="color:${st.vl > 40 ? 'var(--bad)' : st.vl > 25 ? 'var(--warn)' : 'var(--good)'}">${fmtNum(st.vl, 1)}%</b>${z ? ` · fastest rep in <b>${esc(z.name)}</b>` : ''}<br>
    ${cut > 0 ? (stopAt ? `Cut-off of ${fmtNum(cut, 0)}% reached on <b>rep ${stopAt}</b> — stop the set there.` : `Cut-off of ${fmtNum(cut, 0)}% not reached (velocity at stop threshold: <b>${fmtNum(st.best * (1 - cut / 100), 2)} m/s</b>).`) : ''}`;
};

function vbtLogTable(logs, showAthlete) {

      <td class="n nowrap">${esc(fmtMass(l.load))}</td><td class="n">${l.n || '–'}</td><td class="n nowrap"><span class="zone-sw" style="background:${z?.color || 'transparent'}"></span>${fmtNum(l.vBest, 2)}</td>

}

function openVbtModal(log, def = {}) {
  const isNew = !log;
  const x = log ? { ...log } : { athleteId: def.athleteId || '', exerciseId: def.exerciseId || (UI.vbt.exerciseId || ''), date: def.date || today(), load: def.load ?? null, reps: [], vBest: null, peak: null, notes: '', workoutId: def.workoutId || null };
  if (!S.exercises.some(e => e.vbt) && !S.exercises.length) { toast('Add an exercise to your library first'); return go('#/library'); }
  const body = `
    <div class="fields">
      ${field('Athlete', sel('athleteId', athleteOptions(!isNew), x.athleteId))}
      ${field('Exercise', exerciseOptions(x.exerciseId, { vbtFirst: true, allowNew: false }))}
      ${field('Date', inp('date', x.date, 'type="date"'))}
      ${field('Load', numInp('load', x.load != null ? inVal(U.massOut(x.load), 1) : '', 'autofocus'), { unit: U.mass() })}
    </div>
    ${field('Rep velocities (mean, m/s)', inp('reps', (x.reps || []).join(', '), 'inputmode="decimal" placeholder="0.82, 0.80, 0.77, 0.71" data-input="vbtPreview"'), { hint: 'Enter each rep in order. Or leave blank and enter a single velocity below.' })}
    <div class="fields">
      ${field('Single velocity', numInp('vSingle', x.reps?.length ? '' : (x.vBest ?? ''), 'data-input="vbtPreview"'), { unit: 'm/s', hint: 'Best/mean rep if not entering each rep' })}
      ${field('Peak velocity', numInp('peak', x.peak ?? ''), { unit: 'm/s', hint: 'Optional' })}
    </div>
    <div class="computed" id="vbtCalc">—</div>
    ${field('Notes', inp('notes', x.notes, 'placeholder="Optional"'))}`;
  const read = v => {
    const reps = parseVels(v.reps);
    const single = num(v.vSingle);
    const st = reps.length ? velStats(reps) : single > 0 ? { n: null, best: single, mean: single, vl: null } : null;
    return { reps, st };
  };
  const save = (v, keepOpen, m) => {
    if (!v.athleteId) return 'Choose an athlete.';
    if (!v.exerciseId) return 'Choose an exercise.';
    if (!isDS(v.date)) return 'Choose a date.';
    const load = num(v.load);
    if (load == null || load < 0) return 'Enter the load (use 0 for bodyweight-only).';
    const { reps, st } = read(v);
    if (v.reps.trim() && !reps.length) return 'Rep velocities should be numbers in m/s, e.g. 0.82, 0.79';
    if (!st) return 'Enter rep velocities or a single velocity.';
    if (st.best > 4) return 'Velocities look too high — enter metres per second (e.g. 0.75).';
    const peak = num(v.peak);
    upsert('vbt', { ...x, id: keepOpen ? undefined : x.id, createdAt: keepOpen ? null : x.createdAt, athleteId: v.athleteId, exerciseId: v.exerciseId, date: v.date, load: U.massIn(load), reps, n: st.n ?? (reps.length || null), vBest: st.best, vMean: st.mean, vl: st.vl, peak: peak > 0 ? peak : null, notes: v.notes.trim() });
    UI.vbt.athleteId = v.athleteId; UI.vbt.exerciseId = v.exerciseId;
    if (keepOpen) {
      toast('Set saved — log the next one');
      m.form.reps.value = ''; m.form.vSingle.value = ''; m.form.peak.value = ''; m.form.notes.value = '';
      m.form.load.focus(); m.form.load.select();
      A.vbtPreview(); refresh();
      return false;
    }
    toast(isNew ? 'Set logged' : 'Saved'); refresh();
  };
  openModal({
    title: isNew ? 'Log VBT set' : 'Edit VBT set', body,
    footer: isNew ? `<button type="button" class="btn" data-next>Save & log next set</button>` : '',
    onSubmit: (v, f, m) => save(v, false, m),
    onDelete: isNew ? null : async () => { if (!(await confirmBox('Delete this set?'))) return false; removeRec('vbt', x.id); toast('Set deleted'); refresh(); },
    onMount: m => {
      A.vbtPreview = () => {
        const { st } = read(formData(m.form));
        const box = $('#vbtCalc', m.wrap);
        if (!box) return;
        if (!st) { box.innerHTML = 'Velocity loss, fastest rep and zone appear here.'; return; }
        const z = zoneOf(st.best);
        box.innerHTML = `${st.n ? `Reps <b>${st.n}</b> · ` : ''}Fastest <b>${fmtNum(st.best, 2)} m/s</b>${st.n ? ` · mean <b>${fmtNum(st.mean, 2)}</b> · velocity loss <b style="color:${st.vl > 40 ? 'var(--bad)' : st.vl > 25 ? 'var(--warn)' : 'var(--good)'}">${fmtNum(st.vl, 1)}%</b>` : ''}${z ? ` · <span class="zone-sw" style="background:${z.color};display:inline-block;width:9px;height:9px;border-radius:3px"></span> ${esc(z.name)}` : ''}`;
      };
      A.vbtPreview();
      $('[data-next]', m.wrap)?.addEventListener('click', () => {
        const r = save(formData(m.form), true, m);
        if (typeof r === 'string') m.error(r); else m.error('');
      });
    },
  });
}

    body: `${field('Exercise', exerciseOptions(x.exerciseId, { vbtFirst: true, allowNew: false }))}
      <div class="fields">${field('1RM', numInp('kg', x.kg != null ? inVal(U.massOut(x.kg), 1) : '', 'autofocus'), { unit: U.mass() })}${field('Date', inp('date', x.date, 'type="date"'))}</div>
      ${field('Velocity of the 1RM rep (optional)', numInp('v1rm', x.v1rm ?? ''), { unit: 'm/s', hint: 'Mean velocity from your VBT device on the successful max rep. This becomes the athlete’s own threshold and makes estimated 1RMs more accurate.' })}

    onSubmit: v => {

    },
    onDelete: isNew ? null : async () => { if (!(await confirmBox('Delete this 1RM?'))) return false; removeRec('maxes', x.id); refresh(); },

function newStarterCount() {
  const offered = new Set(S.settings.starterOffered || STARTER.slice(0, 60).map(x => x[0].toLowerCase()));
  return STARTER.filter(([n]) => !offered.has(n.toLowerCase()) && !S.exercises.some(e => e.name.toLowerCase() === n.toLowerCase())).length;
}
A.dismissStarter = () => { S.settings.starterOffered = STARTER.map(x => x[0].toLowerCase()); persist(); refresh(); };
function addStarterLibrary() {
  let n = 0;
  STARTER.forEach(([name, category, equipment, cues, mvt, ballistic]) => {
    if (S.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) return;
    upsert('exercises', { name, category, equipment, cues, videoUrl: '', vbt: mvt != null || !!ballistic, mvt: mvt ?? null, notes: '' });
    n++;
  });
  S.settings.starterOffered = STARTER.map(x => x[0].toLowerCase());
  persist();
  return n;
}

const FP_TOPICS = [
  { id: 'phases', title: 'The CMJ force–time curve: phases', tags: 'phase phases curve unweighting braking eccentric propulsive concentric flight landing weighing quiet standing',
    body: 'A countermovement jump on a force plate is split into phases: (1) <b>Weighing</b> — standing still so the plate can measure body weight (the reference for every other calculation); (2) <b>Unweighting</b> — the athlete starts to drop and force falls below body weight; (3) <b>Braking</b> (eccentric deceleration) — force rises above body weight to stop the downward movement, ending at the lowest point; (4) <b>Propulsion</b> (concentric) — pushing up until the feet leave the plate; (5) <b>Flight</b>; (6) <b>Landing</b>. OVR Force reports braking metrics (time, peak force, RFD, impulse, asymmetry) and propulsive metrics (time, peak force, impulse, asymmetry, power) from these phases.',
    tip: 'Make the athlete stand completely still for 1–2 s before each jump. A poor weighing period corrupts every metric that follows.', refs: ['mcmahon2018'] },
  { id: 'outcome-strategy', title: 'Outcome vs strategy: the most useful way to read a jump', tags: 'outcome strategy how why jump height mrsi time to takeoff driver framework',
    body: '<b>Outcome</b> metrics tell you <i>what</i> happened — jump height, takeoff velocity, mRSI. <b>Strategy/driver</b> metrics tell you <i>how</i> — time to takeoff, countermovement depth, braking time and RFD, propulsive impulse. Two athletes can jump the same height with very different strategies: one quick and stiff (short time to takeoff, high braking RFD), one slow and deep (long time to takeoff, deep countermovement). Always read jump height alongside mRSI or time to takeoff.',
    tip: 'Report one outcome metric (jump height or takeoff velocity), one efficiency metric (mRSI) and 2–3 driver metrics (braking RFD, propulsive impulse, countermovement depth). Fewer, reliable metrics beat a wall of numbers.', refs: ['bishop2022', 'anicic2023'] },
  { id: 'fatigue', title: 'Monitoring fatigue and readiness with the CMJ', tags: 'fatigue readiness recovery monitor daily weekly tired masked hidden neuromuscular',
    body: 'Fatigued athletes often <b>keep their jump height</b> by changing strategy — a deeper, slower countermovement and longer time to takeoff. So jump height alone can miss fatigue. Watch for: mRSI down, time to takeoff up, braking time up or braking RFD down while jump height looks normal. A drop in jump height bigger than the typical error (~4%) is a clearer signal.',
    tip: 'Compare to the athlete’s own rolling average (last 3–5 tests), not to team norms. Test at the same time of day after the same warm-up.', refs: ['gathercole2015', 'claudino2017'] },
  { id: 'protocol', title: 'Testing protocol that keeps OVR data trustworthy', tags: 'protocol standardise warm-up hands on hips arm swing trials how many best average footwear time of day calibration zero',
    body: '<ul><li>Zero/tare the plate, then weigh the athlete standing still (1–2 s) before each jump.</li><li>Same warm-up, footwear and time of day each session.</li><li><b>Hands on hips</b> (or a dowel) for CMJ, SJ and drop jumps — arm swing changes the numbers, so never mix the two in one trend.</li><li>3 good trials, ~30–60 s apart. Report the mean of the best two (more stable) or the best — just be consistent.</li><li>Cue “jump as high and as fast as you can” consistently; changing the cue changes the strategy.</li><li>Discard trials with a stutter, a double dip, tucking legs in flight or landing off the plate.</li><li>Squat jump: hold the bottom ~2–3 s and check there is no dip before the push — a dip makes it a countermovement.</li></ul>',
    tip: 'If a metric’s trial-to-trial variation is above ~10%, treat it as noise for that athlete.', refs: ['anicic2023', 'heishman2020', 'mcmahon2018'] },
  { id: 'jumpheight', title: 'Jump height: takeoff velocity vs flight time', tags: 'jump height takeoff velocity flight time method impulse momentum compare devices ovr jump laser',
    body: 'Force plates calculate jump height from <b>takeoff velocity</b> (impulse–momentum: height = v² ÷ 2g). Mats, lasers and apps use <b>flight time</b>, which can be inflated if the athlete tucks or lands with bent knees. The two methods give different numbers, so don’t compare OVR Force jump heights directly with a contact mat, OVR Jump or another brand’s plate — trend each device against itself.',
    tip: 'Takeoff velocity is the purest CMJ outcome metric: it is what jump height is calculated from.', refs: ['moir2008'] },
  { id: 'impulse', title: 'Why impulse matters more than peak force', tags: 'impulse peak force area under curve net impulse takeoff velocity momentum',
    body: 'Jump height is determined by <b>net propulsive impulse</b> (force above body weight × time). Takeoff velocity = net impulse ÷ body mass. Peak force is one point on the curve; impulse is the whole area. Better jumpers produce more braking and propulsive force <i>and</i> impulse. If peak propulsive force rises but jump height doesn’t, the athlete may be producing force over less time (shallower countermovement) — check depth and propulsive time.',
    tip: 'If propulsive impulse rises relative to body mass, jump height should rise. If it doesn’t, check that body mass was measured correctly.', refs: ['sole2018', 'cormie2009'] },
  { id: 'imtp', title: 'Force mode: IMTP and isometric testing', tags: 'imtp isometric mid-thigh pull isometric squat calf peak force rfd f100 force mode strength setup',
    body: 'OVR Force mode supports mid-thigh pulls, isometric squats and calf isometrics. <b>Peak force</b> is highly reliable and reflects maximal strength. <b>Relative peak force</b> (N/kg) matters most for sports where athletes move their own body. <b>Force at 100 ms</b> and <b>RFD</b> describe how quickly force rises — important for sprinting and jumping — but are less reliable, so need a strict set-up. Time to peak force is the least useful (athletes peak at different times in a 3–5 s pull).',
    tip: 'IMTP set-up: bar at mid-thigh, knee ~125–145°, hip ~140–150°, pre-tension without movement, then “pull as hard and fast as you can” for 3–5 s. 2–3 trials. Use the same bar height every time (write it in the test notes).', refs: ['comfort2019', 'thomas2015'] },
  { id: 'dsi', title: 'Dynamic Strength Index (DSI)', tags: 'dsi dynamic strength index ballistic strength ratio imtp cmj peak force',
    body: 'DSI = CMJ peak (propulsive) force ÷ IMTP peak force. <b>&lt;0.60</b>: the athlete has strength they can’t express quickly → emphasise ballistic and plyometric work. <b>&gt;0.80</b>: they already express most of their strength → raise the ceiling with maximal strength work. 0.60–0.80: concurrent approach. These cut-offs are practitioner guidelines; also look at the absolute values — a low DSI from a very strong IMTP is a different athlete from a low DSI from a weak CMJ.',
    tip: 'Collect CMJ and IMTP on the same day so DSI is meaningful. The app calculates it automatically.', refs: ['sheppard2011', 'comfort2018'] },
  { id: 'asymmetry', title: 'Reading asymmetries (two plates)', tags: 'asymmetry left right imbalance limb side dominant braking propulsive landing injury acl return',
    body: 'Asymmetry needs two plates (one under each foot). Look at <b>magnitude</b> (≥10% worth watching, ≥15% a priority), <b>direction</b> (is the same side leading in braking, propulsion and isometric tests?) and <b>consistency</b> (does it persist across sessions?). Braking asymmetries often show up after lower-limb injury even when propulsion looks balanced. Asymmetry is task-specific and fairly variable, so confirm before acting.',
    tip: 'Record which side is greater for each asymmetry so the app can check consistency over time.', refs: ['bishop2018', 'bishop2018b'] },
  { id: 'youth', title: 'Force plate data in youth athletes (10–18)', tags: 'youth kids adolescent maturation growth spurt phv puberty age development',
    body: 'Growth and maturation change force-plate numbers independently of training. Around the adolescent growth spurt, coordination can dip temporarily — jump strategy may get slower even while strength rises. Compare each athlete to <b>their own trend</b>, track body mass every test (relative metrics matter more as athletes grow), and keep building strength and movement skill throughout.',
    tip: 'Note growth spurts and height changes in test notes — they explain a lot of “unexplained” changes.', refs: ['lloyd2012'] },
  { id: 'sj-dj', title: 'Squat jump, drop jump and RSI hops on OVR Force', tags: 'squat jump sj drop jump dj rsi hops 10/5 reactive eur contact time',
    body: '<b>Squat jump</b> removes the countermovement and shows concentric-only ability; compare to CMJ for the eccentric utilisation ratio (EUR = CMJ ÷ SJ height). <b>Drop jump</b>: RSI = jump height ÷ ground contact time; contact under ~250 ms reflects fast stretch-shortening ability. <b>RSI hops</b> (e.g. 10/5) test repeated reactive ability — best for ankle stiffness and elastic qualities.',
    tip: 'Only increase drop-jump box height while contact time stays under ~250 ms and RSI holds.', refs: ['mcguigan2006', 'flanagan2008'] },
