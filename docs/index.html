  imtpRel: { what: 'Peak force ÷ body mass.', high: 'Strong relative to size — matters for sprinting and jumping.', low: 'Strength-to-mass is a limiter.', drivers: 'Strength and body mass.', train: 'Strength training; monitor body composition.', reliab: 'Very reliable.', refs: ['thomas2015'] },
  imtpF100: { what: 'Force produced in the first 100 ms of the pull — early, rapid force.', high: 'Explosive early force.', low: 'Slow to produce force.', drivers: 'Neural drive, intent, tendon stiffness, max strength.', train: 'Ballistic training, fast-intent isometrics, Olympic derivatives; stronger athletes also gain early force.', reliab: 'Moderate — needs strict pre-tension.', refs: ['comfort2019'] },
  imtpRfd: { what: 'Rate of force development over the reported window.', high: 'Rapid force production.', low: 'Slow force production.', drivers: 'Same as F100.', train: 'Ballistic and fast-intent work.', reliab: 'Lower than peak force; use trends.', refs: ['comfort2019'] },
  imtpTtpf: { what: 'Time to reach peak force.', high: '—', low: '—', drivers: 'Pull strategy.', train: 'Low practical value — use F100/RFD instead.', reliab: 'Poor.', refs: ['comfort2019'] },
  imtpImp: { what: 'Force × time over a set window of the pull.', high: 'More force over time.', low: 'Less.', drivers: 'Strength and rate.', train: 'Strength and rapid-force work.', reliab: 'Good over longer windows.', refs: ['comfort2019'] },
  imtpAvgF: { what: 'Average force during the pull.', high: 'Sustained force.', low: 'Less sustained force.', drivers: 'Strength.', train: 'Strength training.', reliab: 'Good.', refs: ['comfort2019'] },
  imtpAsym: { what: 'Left vs right difference in the isometric pull.', high: 'Strength imbalance.', low: 'Balanced.', drivers: 'Strength differences, injury.', train: 'Unilateral strength for the weaker side.', reliab: 'Moderate.', refs: ['bishop2018'] },
  sj: { what: 'Concentric-only jump from a held squat.', high: 'Strong concentric power.', low: 'Concentric power limiter.', drivers: 'Strength and power.', train: 'Strength, squat jumps, loaded jumps.', reliab: 'Reliable if no dip.', refs: ['mcguigan2006'] },
  djRsi: { what: 'Drop jump height ÷ contact time.', high: 'Strong fast stretch-shortening ability.', low: 'Reactive limiter.', drivers: 'Stiffness, eccentric strength, technique.', train: 'Pogo/hurdle hops, low drop jumps.', reliab: 'Moderate–good.', refs: ['flanagan2008'] },
  rsi105: { what: 'Repeated hop RSI (best 5 of 10 hops).', high: 'Elastic, stiff ankles.', low: 'Elastic limiter.', drivers: 'Ankle stiffness, reactive strength.', train: 'Pogo hops, line hops, low-amplitude plyometrics.', reliab: 'Good.', refs: ['flanagan2008'] },
};

/* ---------- Data analyzer: patterns + what's missing ---------- */
function fpAnalyze(a) {
  const T = today();
  const tests = testsFor(a.id);
  const fpKeys = METRICS.filter(m => ['cmjfp', 'iso'].includes(m.cat)).map(m => m.key).concat(['cmj', 'sj', 'djRsi', 'djGct', 'rsi105']);
  const fpTests = tests.filter(t => fpKeys.some(k => t.m?.[k] != null));
  const latest = fpTests[fpTests.length - 1];
  const out = { latest, n: fpTests.length, sections: [], missing: [], priorities: [] };
  if (!latest) return out;
  const L = testMetrics(latest);
  const ser = k => metricSeries(a.id, k);
  const vsPrior = k => {
    const s = ser(k);
    if (s.length < 2 || s[s.length - 1].id !== latest.id) return null;
    const prior = s.slice(-4, -1).map(p => p.v);
    const ref = mean(prior);
    return { v: s[s.length - 1].v, ref, pct: (s[s.length - 1].v - ref) / Math.abs(ref) * 100, n: prior.length };
  };
  const sig = (k, ch) => ch && M[k].te != null && Math.abs(ch.pct) >= M[k].te;
  const line = (k, ch) => `${M[k].label}: ${fmtMetric(M[k], ch.v)} vs ${fmtMetric(M[k], ch.ref)} recent avg (${ch.pct > 0 ? '+' : ''}${fmtNum(ch.pct, 1)}%)`;
  const sec = (title, items) => { if (items.length) out.sections.push({ title, items }); };
  const F = (level, title, text, refs = [], action = '') => ({ level, title, text, refs, action });

  /* Output */
  const outI = [];
  ['cmj', 'takeoffVel', 'cmjRelPP'].forEach(k => {
    const ch = vsPrior(k);
    if (sig(k, ch)) outI.push(F(ch.pct * M[k].dir > 0 ? 'good' : 'warn', `${M[k].label} ${ch.pct > 0 ? 'up' : 'down'} ${fmtNum(Math.abs(ch.pct), 1)}%`, line(k, ch) + ' — beyond typical test noise.', ['hopkins2000']));
  });
  sec('Output — how high', outI);

  /* Strategy */
  const stI = [];
  const jh = vsPrior('cmj'), tt = vsPrior('ttt'), mr = vsPrior('rsiMod'), dp = vsPrior('cmDepth'), bt = vsPrior('brakeTime'), br = vsPrior('brakeRfd');
  if (jh && !sig('cmj', jh) && ((tt && tt.pct >= M.ttt.te) || (mr && mr.pct <= -M.rsiMod.te))) {
    stI.push(F('warn', 'Jump height held, but the jump got slower', `${tt ? line('ttt', tt) + '. ' : ''}${mr ? line('rsiMod', mr) + '. ' : ''}Height is within normal noise, so the athlete is “finding” the same height with a slower strategy — a classic sign of hidden neuromuscular fatigue.`, ['gathercole2015', 'bishop2022'], 'Check sleep, soreness and recent load. Reduce high-intensity plyometric and sprint volume for 48–72 h and retest before progressing.'));
  } else if (mr && sig('rsiMod', mr)) {
    stI.push(F(mr.pct > 0 ? 'good' : 'warn', `mRSI ${mr.pct > 0 ? 'improved' : 'declined'} ${fmtNum(Math.abs(mr.pct), 1)}%`, line('rsiMod', mr) + '.', ['ebben2010']));
  }
  if (dp && Math.abs(dp.pct) >= 10) stI.push(F('info', `Countermovement depth ${dp.pct > 0 ? 'deeper' : 'shallower'} by ${fmtNum(Math.abs(dp.pct), 0)}%`, `${line('cmDepth', dp)}. Depth changes alter forces and timing on their own — ${dp.pct > 0 ? 'a deeper dip usually lowers peak forces and lengthens time to takeoff' : 'a shallower dip usually raises peak forces and shortens time to takeoff'}. Interpret force changes in this test with that in mind.`, ['bishop2022', 'mcmahon2018']));
  if (L.ttt != null && L.cmj != null && L.rsiMod != null && L.rsiMod < 0.4 && L.ttt > 0.85) stI.push(F('info', 'Slow, long jump strategy', `Time to takeoff ${fmtNum(L.ttt, 3)} s with mRSI ${fmtNum(L.rsiMod, 2)}. The athlete takes a long time to produce their jump.`, ['ebben2010', 'bishop2022'], 'Add fast-SSC work (pogo hops, hurdle hops, low drop jumps) and cue “fast down, fast up”. Re-check that the cue used in testing is the same each time.'));
  sec('Strategy — how they jump', stI);

  /* Braking */
  const bI = [];
  if (br && sig('brakeRfd', br)) bI.push(F(br.pct > 0 ? 'good' : 'warn', `Braking RFD ${br.pct > 0 ? 'up' : 'down'} ${fmtNum(Math.abs(br.pct), 0)}%`, line('brakeRfd', br) + '. Braking RFD is variable, so confirm the trend over 2–3 tests.', ['mcmahon2018', 'anicic2023'], br.pct < 0 ? 'Add eccentric emphasis: snap-downs, drop landings, accentuated-eccentric jumps, controlled-tempo eccentric squats.' : ''));
  if (bt && sig('brakeTime', bt) && bt.pct > 0) bI.push(F('warn', `Braking phase ${fmtNum(bt.pct, 0)}% longer`, line('brakeTime', bt) + '. Taking longer to stop the downward movement suggests reduced eccentric capacity or fatigue.', ['mcmahon2018'], 'Prioritise eccentric strength and fast-deceleration drills; retest when fresh.'));
  if (L.relBrakeF != null && L.relPropF != null && L.relBrakeF < L.relPropF * 0.75) bI.push(F('info', 'Braking force well below propulsive force', `Peak braking ${fmtNum(L.relBrakeF, 1)} N/kg vs propulsive ${fmtNum(L.relPropF, 1)} N/kg. The athlete brakes softly and generates most force on the way up.`, ['sole2018', 'mcmahon2018'], 'If faster, stiffer jumps are the goal, develop eccentric braking (snap-downs, depth drops) — higher braking forces support a bigger, quicker propulsive phase.'));
  sec('Braking — eccentric deceleration', bI);

  /* Propulsion */
  const pI = [];
  const pi = vsPrior('propImp'), pf = vsPrior('cmjPF');
  if (pi && sig('propImp', pi)) pI.push(F(pi.pct > 0 ? 'good' : 'warn', `Propulsive impulse ${pi.pct > 0 ? 'up' : 'down'} ${fmtNum(Math.abs(pi.pct), 1)}%`, line('propImp', pi) + '. Impulse is what determines takeoff velocity.', ['sole2018']));
  if (pf && sig('cmjPF', pf) && jh && !sig('cmj', jh) && pf.pct > 0) pI.push(F('info', 'More peak force without more height', `${line('cmjPF', pf)}, but jump height is unchanged. Force is likely being produced over a shorter time (shallower dip) — check depth and propulsive time before calling it a strength gain.`, ['sole2018', 'cormie2009']));
  sec('Propulsion — concentric push', pI);

  /* Isometric */
  const iI = [];
  const ip = vsPrior('imtpPF');
  if (ip && sig('imtpPF', ip)) iI.push(F(ip.pct > 0 ? 'good' : 'warn', `Isometric peak force ${ip.pct > 0 ? 'up' : 'down'} ${fmtNum(Math.abs(ip.pct), 1)}%`, line('imtpPF', ip) + '.', ['comfort2019']));
  if (L.f100Pct != null) {
    const s = ser('f100Pct');
    if (L.f100Pct < 50 && s.length) iI.push(F('info', `Early force is ${fmtNum(L.f100Pct, 0)}% of peak force`, `Force at 100 ms is ${fmtMetric(M.imtpF100, L.imtpF100)} of a ${fmtMetric(M.imtpPF, L.imtpPF)} peak. The athlete is strong but slow to switch force on.`, ['comfort2019', 'suchomel2016'], 'Add rapid-force work: ballistic jumps, fast-intent short isometrics (1–2 s “as fast as possible”), Olympic-lift derivatives.'));
  }
  if (L.dsi != null) iI.push(F(L.dsi < 0.6 || L.dsi > 0.8 ? 'warn' : 'info', `DSI ${fmtNum(L.dsi, 2)} — ${L.dsi < 0.6 ? 'ballistic emphasis' : L.dsi > 0.8 ? 'maximal strength emphasis' : 'balanced'}`, `CMJ peak force is ${Math.round(L.dsi * 100)}% of ${latest.isoType === 'ISQ' ? 'isometric squat' : 'IMTP'} peak force.`, ['sheppard2011', 'comfort2018'], L.dsi < 0.6 ? 'Emphasise ballistic work — loaded/unloaded jumps, trap-bar jumps at ~20–40% 1RM, Olympic-lift derivatives, plyometrics — while maintaining heavy strength.' : L.dsi > 0.8 ? 'Emphasise maximal strength (≈80–90% 1RM, 2–5 reps) while keeping plyometric exposure.' : 'Keep a concurrent approach (heavy strength + ballistic work) and re-assess DSI next block.'));
  sec('Isometric strength & rapid force', iI);

  /* Asymmetry */
  const aI = [];
  const sides = {};
  ASYM_KEYS.forEach(k => { if (L[k] != null) sides[k] = latest.sides?.[k] || (k === 'asym' ? latest.asymSide : ''); });
  const big = ASYM_KEYS.filter(k => L[k] != null && L[k] >= 10);
  big.forEach(k => aI.push(F(L[k] >= 15 ? 'alert' : 'warn', `${M[k].label} ${fmtNum(L[k], 1)}%${sides[k] ? ` (${sides[k]} greater)` : ''}`, L[k] >= 15 ? 'Above 15% — a priority to confirm and address.' : '10–15% — worth watching.', ['bishop2018'])));
  const sideVals = Object.entries(sides).filter(([k, v]) => v && L[k] >= 5);
  if (new Set(sideVals.map(x => x[1])).size > 1) aI.push(F('info', 'Asymmetry direction differs between phases', sideVals.map(([k, v]) => `${M[k].label}: ${v}`).join(' · ') + '. Different sides leading in different phases often reflects strategy or task-specific differences rather than one weak limb.', ['bishop2018b']));
  sec('Asymmetry', aI);

  /* What's missing */
  const has = k => fpTests.some(t => testMetrics(t)[k] != null);
  const miss = (cond, title, why, refs = []) => { if (cond) out.missing.push({ title, why, refs }); };
  miss(!latest.bodyMassKg, 'Body mass on the latest test', 'Relative force and power (N/kg, W/kg) and takeoff-velocity checks need body mass from the same day.', ['mcmahon2018']);
  miss(!has('rsiMod') && !has('ttt'), 'mRSI / time to takeoff', 'Without a timing metric you can’t tell whether jump height was produced quickly or slowly — the main way hidden fatigue shows up.', ['gathercole2015', 'bishop2022']);
  miss(!has('brakeRfd') && !has('peakBrakeF') && !has('brakeTime'), 'Braking (eccentric) metrics', 'Braking time, peak braking force and braking RFD describe how well the athlete decelerates — often the limiter for change of direction and reactive ability.', ['mcmahon2018']);
  miss(!has('propImp') && !has('takeoffVel'), 'Propulsive impulse or takeoff velocity', 'These are the “engine” behind jump height and are among the most reliable metrics.', ['sole2018', 'anicic2023']);
  miss(!has('cmDepth'), 'Countermovement depth', 'Depth explains many changes in force and timing. Without it, a shallower or deeper dip can look like a strength change.', ['bishop2022']);
  miss(!has('imtpPF'), 'An isometric test (IMTP)', 'Needed for maximal strength and the Dynamic Strength Index (which tells you whether to prioritise strength or speed-strength).', ['sheppard2011', 'comfort2019']);
  miss(has('imtpPF') && !has('imtpF100') && !has('imtpRfd'), 'Early force (F100 or RFD) from the IMTP', 'Peak force shows how strong; F100/RFD shows how fast that strength switches on.', ['comfort2019']);
  miss(!has('sj'), 'Squat jump', 'Pairs with the CMJ to give the eccentric utilisation ratio (how much the countermovement helps).', ['mcguigan2006']);
  miss(!has('djRsi') && !has('rsi105'), 'A reactive test (drop jump or RSI hops)', 'The CMJ is a slow stretch-shortening action; sprinting and cutting rely on fast SSC, measured by drop jumps or hops.', ['flanagan2008']);
  miss(!ASYM_KEYS.some(has), 'Asymmetry (two plates)', 'Braking and propulsive asymmetries need one plate under each foot.', ['bishop2018']);
  miss(fpTests.length < 3, 'More test history', `Only ${plural(fpTests.length, 'test')} so far. With 3+ tests the app can compare against the athlete’s own normal range rather than a single previous value.`, ['hopkins2000']);
  miss(daysBetween(latest.date, T) > 35, 'A recent test', `Last force-plate test was ${ago(latest.date)}. Weekly or bi-weekly CMJs make trends far more useful.`, ['claudino2017']);

  /* Priorities */
  const all = out.sections.flatMap(s => s.items);
  all.filter(i => i.action && (i.level === 'alert' || i.level === 'warn')).slice(0, 3).forEach(i => out.priorities.push(i.action));
  if (!out.priorities.length && L.dsi != null) out.priorities.push(L.dsi < 0.6 ? 'Ballistic and plyometric emphasis while maintaining strength.' : L.dsi > 0.8 ? 'Maximal strength emphasis while maintaining plyometric exposure.' : 'Concurrent strength + power; re-assess DSI next block.');
  return out;
}

/* ---------- View ---------- */
ROUTES.fpai = r => {
  const tab = ['analyze', 'ask', 'guide'].includes(r.parts[0]) ? r.parts[0] : 'analyze';
  const tabs = `<nav class="tabs" style="margin-top:0">${[['analyze', 'Analyze athlete'], ['ask', 'Ask the AI'], ['guide', 'OVR metric guide']].map(([k, l]) => `<a href="#/fpai/${k}" class="${k === tab ? 'active' : ''}">${l}</a>`).join('')}</nav>`;
  const v = tab === 'ask' ? fpAsk() : tab === 'guide' ? fpGuide(r.q.q || '') : fpAnalyzeView();
  return { title: 'Force Plate AI', body: tabs + v.body, mount: v.mount };
};

function fpAnalyzeView() {
  const list = activeAthletes().filter(a => testsFor(a.id).length);
  if (!list.some(a => a.id === UI.fp.athleteId)) UI.fp.athleteId = list[0]?.id || '';
  if (!list.length) return { body: `<div class="card">${emptyState_('activity', 'No test data yet', 'Record OVR Force results in an athlete’s Testing tab (CMJ “Jump mode” and “Force mode” sections). The analyzer then explains what the numbers mean, flags patterns and lists what’s missing.', '<a class="btn primary" href="#/athletes">Go to athletes</a>')}</div>` };
  const a = getAthlete(UI.fp.athleteId);
  const res = fpAnalyze(a);
  const finding = i => `<div class="insight ${i.level}"><div class="ic">${icon(LEVEL_ICON[i.level])}</div><div class="row-main" style="white-space:normal"><div class="in-title">${esc(i.title)}</div><div class="in-text">${esc(i.text)}</div>${i.action ? `<div class="in-action"><b>Suggestion:</b> ${esc(i.action)}</div>` : ''}${refLinks(i.refs)}</div></div>`;
  const L = res.latest ? testMetrics(res.latest) : {};
  const snapKeys = ['cmj', 'takeoffVel', 'rsiMod', 'ttt', 'cmDepth', 'brakeRfd', 'peakBrakeF', 'propImp', 'cmjPF', 'cmjRelPP', 'imtpPF', 'imtpRel', 'imtpF100', 'dsi', 'eur', 'brakeAsym', 'propAsym'].filter(k => L[k] != null);
  const body = `
    <div class="card" style="padding-bottom:6px"><div class="toolbar" style="margin:0">${sel('a', list.map(x => [x.id, athleteName(x)]), a.id, 'data-change="fpAthlete" style="flex:1" aria-label="Athlete"')}
      ${aiReady() ? `<button class="btn primary" data-act="fpAskAbout" data-id="${a.id}">${icon('bulb', 'sm')}Ask AI about this athlete</button>` : ''}</div></div>
    ${!res.latest ? `<div class="card" style="margin-top:16px">${emptyState_('activity', 'No force-plate results for this athlete', 'Add OVR Force CMJ or isometric results in their Testing tab.', `<button class="btn primary" data-act="newTest" data-athlete="${a.id}">Add test</button>`)}</div>` : `
    <div class="grid two" style="margin-top:16px">
      <div class="col">
        <div class="card"><div class="card-head"><h3>Latest force-plate snapshot</h3><span class="sub">${esc(fmtDateFull(res.latest.date))} · ${plural(res.n, 'test')} on file</span></div>
          <div class="tiles">${snapKeys.map(k => `<div class="tile"><div class="t-name">${esc(M[k].label)}</div><div class="t-val">${esc(fmtMetric(M[k], L[k], false))} <small>${esc(metricUnit(M[k]))}</small></div></div>`).join('')}</div></div>
        ${res.sections.length ? res.sections.map(s => `<div class="card"><div class="card-head"><h3>${esc(s.title)}</h3></div>${s.items.map(finding).join('')}</div>`).join('') : `<div class="card"><div class="muted small">No notable patterns in the latest test compared with this athlete’s recent results. That's useful too — keep testing consistently.</div></div>`}
      </div>
      <div class="col">
        ${res.priorities.length ? `<div class="card"><div class="card-head"><h3>Training priorities</h3></div><ol style="margin:0;padding-left:20px">${res.priorities.map(p => `<li style="margin-bottom:6px">${esc(p)}</li>`).join('')}</ol></div>` : ''}
        <div class="card"><div class="card-head"><h3>What may be missing</h3><span class="sub">${res.missing.length}</span></div>
          ${res.missing.length ? res.missing.map(m => `<div class="insight info"><div class="ic">${icon('target')}</div><div class="row-main" style="white-space:normal"><div class="in-title">${esc(m.title)}</div><div class="in-text">${esc(m.why)}</div>${refLinks(m.refs)}</div></div>`).join('') : '<div class="muted small">This athlete has a complete force-plate profile. 👏</div>'}
        </div>
        <div class="card prose small"><b>How this works:</b> the analyzer compares the latest test with the athlete's own recent average and flags changes larger than each metric's typical error, then applies published interpretation frameworks (outcome vs strategy, phase analysis, DSI, asymmetry). It never invents values. ${aiReady() ? '' : 'Connect Claude in the <a href="#/fpai/ask">Ask the AI</a> tab for free-form questions.'}</div>
      </div>
    </div>`}`;
  return { body };
}
A.fpAthlete = el => { UI.fp.athleteId = el.value; refresh(); };
A.fpAskAbout = el => { UI.fp.chatAthlete = el.dataset.id; go('#/fpai/ask'); };

function fpGuide(q) {
  const ql = q.trim().toLowerCase();
  const match = (t) => !ql || t.toLowerCase().includes(ql);
  const topics = FP_TOPICS.filter(t => match(t.title + ' ' + t.tags + ' ' + t.body));
  const groups = [['cmjfp', 'Jump mode — CMJ metrics'], ['iso', 'Force mode — isometric metrics'], ['other', 'Other jumps']];
  const metricCard = k => {
    const g = FP_GUIDE[k], m = M[k];
    if (!g || !m || !match(m.label + ' ' + g.what + ' ' + g.train)) return '';
    return `<details class="group"><summary>${esc(m.label)} <span class="faint small">${esc(metricUnit(m) || '')}</span></summary><div class="group-body prose small" style="padding-bottom:12px">
      <p><b>What it is:</b> ${esc(g.what)}</p>
      <p><b>Higher:</b> ${esc(g.high)}<br><b>Lower:</b> ${esc(g.low)}</p>
      <p><b>Driven by:</b> ${esc(g.drivers)}</p>
      <p><b>How to train it:</b> ${esc(g.train)}</p>
      <p><b>Reliability:</b> ${esc(g.reliab)}${m.te ? ` Changes under ~${m.te}% are treated as noise in this app.` : ''}</p>
      ${refLinks(g.refs)}</div></details>`;
  };
  const body = `
    <div class="toolbar"><div class="searchbox grow">${icon('search', 'sm')}<input type="search" placeholder="Search: braking, fatigue, asymmetry, IMTP…" value="${esc(q)}" data-input="fpGuideSearch" aria-label="Search guide"></div></div>
    <div class="grid halves">
      <div class="col"><div class="section-title" style="margin-top:0">Key concepts</div>
        ${topics.map(t => `<details class="group" ${ql ? 'open' : ''}><summary>${esc(t.title)}</summary><div class="group-body prose small" style="padding-bottom:12px">${t.body}<div class="in-action" style="margin-top:8px"><b>Coach tip:</b> ${esc(t.tip)}</div>${refLinks(t.refs)}</div></details>`).join('') || '<div class="muted small">No matching concepts.</div>'}
      </div>
      <div class="col">${groups.map(([c, l]) => {
        const keys = c === 'other' ? ['sj', 'djRsi', 'rsi105'] : METRICS.filter(m => m.cat === c && FP_GUIDE[m.key]).map(m => m.key);
        const cards = keys.map(metricCard).join('');
        return cards ? `<div class="section-title" style="margin-top:0">${esc(l)}</div>${cards}` : '';
      }).join('')}</div>
    </div>`;
  return { body, mount() { const i = $('[data-input="fpGuideSearch"]'); if (q && i) { i.focus(); i.setSelectionRange(q.length, q.length); } } };
}
A.fpGuideSearch = debounce(el => { location.replace('#/fpai/guide?q=' + encodeURIComponent(el.value)); }, 350);

/* ---------- Ask the AI (Claude via the coach's own API key) ---------- */

const AI_MODEL = 'claude-opus-5-5';
function aiReady() { return !!AI_KEY; }

const chat = { msgs: [], busy: false };

function fpAsk() {
  const athletes = activeAthletes();
  const ctxId = UI.fp.chatAthlete || '';
  const offline = !navigator.onLine;
  const body = `
    <div class="grid two">
      <div class="col">
        <div class="card" style="display:flex;flex-direction:column;min-height:420px">
          <div class="card-head" style="flex-wrap:wrap"><h3>Force plate assistant</h3>
            ${sel('ctx', [['', 'No athlete context'], ...athletes.map(a => [a.id, 'Context: ' + athleteName(a)])], ctxId, 'data-change="fpCtx" style="width:auto;min-height:34px;padding-top:5px;padding-bottom:5px" aria-label="Athlete context"')}
            ${chat.msgs.length ? '<button class="btn sm ghost" data-act="fpClear">Clear</button>' : ''}</div>

/* Minimal, safe markdown: escape first, then bold / italics / lists / headings / paragraphs */
function mdLite(t) {
  const lines = esc(t).split('\n');
  let html = '', list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^#{1,4}\s+(.*)/))) { close(); html += `<p><b>${inline(m[1])}</b></p>`; }
    else if (ln.trim() === '') close();
    else { close(); html += `<p>${inline(ln)}</p>`; }
  }
  close();
  return html;
}

function kbSearch(q) {
  const words = q.toLowerCase().replace(/[^a-z0-9/ ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !['the', 'and', 'what', 'does', 'how', 'why', 'for', 'with', 'should', 'mean', 'when', 'this', 'that', 'from', 'are', 'can', 'did', 'but', 'stay', 'same'].includes(w));
  const score = txt => { const t = txt.toLowerCase(); return words.reduce((s, w) => s + (t.includes(w) ? 1 : 0), 0); };
  const items = [
    ...FP_TOPICS.map(t => ({ s: score(t.title + ' ' + t.tags) * 2 + score(t.body), html: `<p><b>${esc(t.title)}</b></p>${t.body}<p><b>Coach tip:</b> ${esc(t.tip)}</p>${refLinks(t.refs)}` })),
    ...Object.entries(FP_GUIDE).filter(([k]) => M[k]).map(([k, g]) => ({ s: score(M[k].label) * 3 + score(g.what + ' ' + g.train + ' ' + g.drivers), html: `<p><b>${esc(M[k].label)}</b> — ${esc(g.what)}</p><p><b>Higher:</b> ${esc(g.high)} <b>Lower:</b> ${esc(g.low)}</p><p><b>How to train it:</b> ${esc(g.train)}</p>${refLinks(g.refs)}` })),
  ].filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 2);
  return items.length ? items.map(x => x.html).join('<hr class="sep">') : '<p>I couldn’t find that in the built-in guide. Try terms like <i>braking</i>, <i>mRSI</i>, <i>asymmetry</i>, <i>IMTP</i>, <i>fatigue</i> or <i>protocol</i>.</p>';
}

function athleteContext(aid) {
  const a = getAthlete(aid);
  if (!a) return '';
  const tests = testsFor(aid).slice(-8);
  const keys = METRICS.filter(m => tests.some(t => testMetrics(t)[m.key] != null)).map(m => m.key);
  const rows = tests.map(t => { const m = testMetrics(t); return `${t.date}: ` + keys.filter(k => m[k] != null).map(k => `${M[k].label}=${fmtNum(metricDisp(M[k], m[k]), M[k].kind === 'len' ? 1 : Math.max(M[k].dec, 2))}${metricUnit(M[k]) ? ' ' + metricUnit(M[k]) : ''}`).join('; ') + (t.sides && Object.keys(t.sides).length ? ` | greater side: ${Object.entries(t.sides).map(([k, v]) => `${M[k]?.label} ${v}`).join(', ')}` : '') + (t.isoType && t.m?.imtpPF != null ? ` | isometric test: ${t.isoType}` : ''); });
  const an = fpAnalyze(a);
  return `ATHLETE CONTEXT (name withheld): sport ${a.sport || 'unknown'}${a.position ? ' (' + a.position + ')' : ''}; age ${ageFrom(a.dob) ?? 'unknown'}; sex ${a.sex || 'unknown'}; body mass ${a.massKg ? fmtMass(a.massKg) : 'unknown'}.
Goals: ${a.goals || '—'}. Injury notes: ${a.injuries || '—'}.
Test history (oldest→newest, units as shown):
${rows.join('\n') || 'none'}
App analyzer findings: ${an.sections.flatMap(s => s.items.map(i => i.title)).join('; ') || 'none'}.
Data gaps flagged: ${an.missing.map(m => m.title).join('; ') || 'none'}.`;
}
function aiSystemPrompt() {
  const kb = FP_TOPICS.map(t => `## ${t.title}\n${t.body.replace(/<[^>]+>/g, ' ')}\nTip: ${t.tip}`).join('\n\n');
  const guide = Object.entries(FP_GUIDE).filter(([k]) => M[k]).map(([k, g]) => `- ${M[k].label}: ${g.what} Higher: ${g.high} Lower: ${g.low} Train: ${g.train} Reliability: ${g.reliab}`).join('\n');
  return `You are the force-plate specialist inside ${S.settings.businessName || 'a sports performance coach'}'s private coaching app. The coach uses OVR Force plates (OVR Performance): Jump mode (CMJ, squat jump, drop jump, RSI hops) and Force mode (isometric mid-thigh pull, isometric squat, calf isometric); 1000 Hz; two plates give asymmetry. Help the coach interpret metrics, spot patterns and gaps in the data, and turn findings into practical training decisions.

How to answer:
- Be practical and concise; lead with the answer, then the reasoning. Use short bullet lists.
- Separate outcome (how high) from strategy (how): read jump height alongside mRSI/time to takeoff, depth and braking metrics.
- Treat changes smaller than a metric's typical error as noise. Prefer the athlete's own trend over population norms; if you give a norm, say how uncertain it is.
- If the data can't answer the question, say what test or metric is missing.
- Most athletes are youth (10–18): consider growth and maturation.

Coach's training philosophy (align recommendations with it):
${philosophyText()}

Reference knowledge:
${kb}

Metric guide:

async function askFp(q) {
  if (chat.busy) return;
  chat.msgs.push({ role: 'user', text: q });
  if (!aiReady() || !navigator.onLine) {
    chat.msgs.push({ role: 'assistant', html: kbSearch(q), src: aiReady() ? 'Offline — answered from the built-in knowledge base' : 'From the built-in OVR knowledge base' });
    return refresh();
  }
  chat.busy = true;
  const reply = { role: 'assistant', text: '', src: '' };
  chat.msgs.push(reply);
  refresh();
  const ctx = UI.fp.chatAthlete ? athleteContext(UI.fp.chatAthlete) : '';
  const history = chat.msgs.slice(0, -1).slice(-10).filter(m => m.text).map(m => ({ role: m.role, content: m.text }));
  if (ctx && history.length) history[history.length - 1] = { role: 'user', content: `${ctx}\n\nQUESTION: ${q}` };
  try {
    await streamClaude(aiSystemPrompt(), history, txt => {
      reply.text = txt;
      const last = $('#chatLog .bubble.assistant:last-child');
      if (last) { last.innerHTML = mdLite(txt); const log = $('#chatLog'); log.scrollTop = log.scrollHeight; }
    });
    reply.src = 'Claude · check important decisions against the cited research';
  } catch (e) {
    console.error(e);
    reply.text = '';
    reply.html = `<p style="color:var(--bad)"><b>Couldn’t reach Claude:</b> ${esc(e.message)}</p>${kbSearch(q)}`;
    reply.src = 'Fallback: built-in knowledge base';
  }
  chat.busy = false;
  if (parseHash().name === 'fpai') refresh();
}

/* Raw HTTP (this offline, single-file app has no bundler for the SDK) */
async function streamClaude(system, messages, onText) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: claudeHeaders(),
    body: JSON.stringify({ model: AI_MODEL, max_tokens: 16000, stream: true, fallbacks: 'default', thinking: { type: 'adaptive' }, output_config: { effort: 'medium' }, system, messages }),
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); msg = j.error?.message || msg; } catch { }
    if (res.status === 401) msg = 'The API key was rejected — check it in console.anthropic.com.';
    if (res.status === 429) msg = 'Rate limited — wait a moment and try again.';
    throw new Error(msg);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', stop = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const dataLine = chunk.split('\n').find(l => l.startsWith('data:'));
      if (!dataLine) continue;
      let ev; try { ev = JSON.parse(dataLine.slice(5)); } catch { continue; }
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText(text); }
      else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
      else if (ev.type === 'error') throw new Error(ev.error?.message || 'Stream error');
    }
  }
  if (stop === 'refusal' && !text) throw new Error('Claude declined to answer that request.');
  if (stop === 'max_tokens') onText(text + '\n\n*(Answer was cut off — ask a follow-up to continue.)*');
  return text;
}

    toast(`Merged: ${res.added} added, ${res.updated} updated${res.removed ? `, ${res.removed} removed` : ''}`);
  }

function mergeState(inc) {
  let added = 0, updated = 0, removed = 0;
  Object.entries(inc.deleted || {}).forEach(([id, t]) => { S.deleted[id] = Math.max(S.deleted[id] || 0, t); });
  COLS.forEach(c => {
    const map = new Map(S[c].map(r => [r.id, r]));
    inc[c].forEach(r => {
      if (S.deleted[r.id] && S.deleted[r.id] >= (r.updatedAt || 0)) return;
      const cur = map.get(r.id);
      if (!cur) { map.set(r.id, r); added++; }
      else if ((r.updatedAt || 0) > (cur.updatedAt || 0)) { map.set(r.id, r); updated++; }
    });
    const before = map.size;
    S[c] = [...map.values()].filter(r => !(S.deleted[r.id] && S.deleted[r.id] >= (r.updatedAt || 0)));
    removed += before - S[c].length;
  });
  let settings = false;
  if ((inc.settingsAt || 0) > (S.settingsAt || 0)) {
    SHARED_SETTINGS.forEach(k => { if (inc.settings && k in inc.settings) S.settings[k] = inc.settings[k]; });
    S.settingsAt = inc.settingsAt; lastSharedSig = sharedSettingsSig(); settings = true;
  } else ['businessName', 'coachName'].forEach(k => { if (!S.settings[k] && inc.settings?.[k]) S.settings[k] = inc.settings[k]; });
  if (!S.settings.onboarded) { S.settings.onboarded = true; settings = true; }
  if (added || updated || removed || settings) persist();
  return { added, updated, removed, settings };
}

/* ---------- Passcode lock ---------- */
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (window.crypto?.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (const b of data) { h1 = Math.imul(h1 ^ b, 16777619) >>> 0; h2 = Math.imul(h2 ^ b, 2246822519) >>> 0; }
  return 'f' + h1.toString(16) + h2.toString(16);
}
function pinPrompt(title, sub = '') {

      onSubmit: v => { if (!/^\d{4,6}$/.test(v.pin)) return 'Use 4 to 6 digits.'; resolve(v.pin); },

    obs.observe(document.body, { childList: true });
  });
}

/* Wrong-passcode throttling: after 5 misses, wait 30 s, doubling each time (max 15 min). Survives reloads. */
let lockFails = { n: 0, until: 0 };
async function loadLockFails() { try { lockFails = (await Store.get('lockFails')) || { n: 0, until: 0 }; } catch { } }
function lockWaitMsg() {
  const s = Math.ceil((lockFails.until - Date.now()) / 1000);
  const el = $('#lockMsg');
  if (el) el.textContent = s > 0 ? `Too many attempts — try again in ${s >= 60 ? Math.ceil(s / 60) + ' min' : s + ' s'}` : 'Enter passcode';
  return s > 0;
}
setInterval(() => { if (document.body.classList.contains('locked')) lockWaitMsg(); }, 1000);
function lockKey(k) {
  if (lockBusy) return;
  if (k !== 'forgot' && lockWaitMsg()) return;
  if (k === 'del') lockEntry = lockEntry.slice(0, -1);
  else if (k === 'forgot') return forgotPin();
  else if (/^\d$/.test(k) && lockEntry.length < (S.settings.pinLen || 4)) lockEntry += k;
  $$('#pinDots span').forEach((s, i) => s.classList.toggle('on', i < lockEntry.length));
  if (lockEntry.length === (S.settings.pinLen || 4)) {
    lockBusy = true;
    hashPin(lockEntry, S.settings.pinSalt).then(h => {
      lockBusy = false;
      if (h === S.settings.pinHash) { lockFails = { n: 0, until: 0 }; Store.set('lockFails', lockFails); unlockUI(); }
      else {
        lockFails.n++;
        if (lockFails.n >= 5) lockFails.until = Date.now() + Math.min(15 * 60, 30 * 2 ** (lockFails.n - 5)) * 1000;
        Store.set('lockFails', lockFails); lockWaitMsg();
        lockEntry = '';
        const d = $('#pinDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
        setTimeout(() => $$('#pinDots span').forEach(s => s.classList.remove('on')), 250);
      }
    });
  }
}

function shrinkImage(file, max) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth || max, img.naturalHeight || max));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.naturalWidth || max) * s)); c.height = Math.max(1, Math.round((img.naturalHeight || max) * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const REPORT_SECTIONS = [
  ['highlights', 'Highlights'], ['testing', 'Performance testing table'], ['charts', 'Trend charts'], ['forceplate', 'Force plate profile'],
  ['strength', 'Strength & VBT'], ['attendance', 'Attendance & training'], ['assessment', 'Coach’s assessment'], ['next', 'Focus for next period'], ['philosophy', 'Training philosophy'],
];
const REPORT_KEYS = ['sprint10', 'sprint10yd', 'sprint20', 'sprint30', 'sprint40yd', 'fly10', 'fly10yd', 'vmax', 'proAgility', 'cod505', 'cmj', 'sj', 'vj', 'broad', 'djRsi', 'rsi105', 'rsiMod', 'takeoffVel', 'propImp', 'cmjRelPP', 'brakeRfd', 'imtpPF', 'imtpRel', 'imtpF100', 'dsi', 'eur', 'bm'];
function repDefaults(aid) {
  return { athleteId: aid, period: '30', from: addDays(today(), -30), to: today(), title: 'Monthly Progress Report', recipient: '', sections: Object.fromEntries(REPORT_SECTIONS.map(([k]) => [k, k !== 'philosophy'])), metrics: null, assessment: '', next: '', reportId: null };
}
function repRange(c) {
  if (c.period === 'custom') return { from: isDS(c.from) ? c.from : addDays(today(), -30), to: isDS(c.to) ? c.to : today() };
  return { from: addDays(today(), -(+c.period)), to: today() };
}
function repData(c) {
  const a = getAthlete(c.athleteId);
  const { from, to } = repRange(c);
  const tests = testsFor(a.id);
  const inP = tests.filter(t => t.date >= from && t.date <= to);
  const metricRows = [...REPORT_KEYS, ...customKeys()].filter(k => M[k]).map(k => {
    const s = metricSeries(a.id, k).filter(p => p.date <= to);
    const inside = s.filter(p => p.date >= from);
    if (!inside.length) return null;
    const before = s.filter(p => p.date < from);
    const start = before.length ? before[before.length - 1] : inside[0];
    const last = inside[inside.length - 1];
    const pct = start !== last ? (last.v - start.v) / Math.abs(start.v) * 100 : null;
    const vals = s.map(p => p.v);
    const best = M[k].dir === -1 ? Math.min(...vals) : Math.max(...vals);
    const pb = M[k].dir !== 0 && s.length > 1 && last.v === best && s.filter(p => p.v === best).length === 1;
    const cls = changeClass(M[k], pct);
    return { k, def: M[k], start, last, pct, best, pb, cls, series: s };
  }).filter(Boolean);
  const evs = eventsFor(a.id).filter(e => e.date >= from && e.date <= to);
  const done = evs.filter(e => athleteStatus(e, a.id) === 'completed').length, noshow = evs.filter(e => athleteStatus(e, a.id) === 'noshow').length;
  const sched = evs.filter(e => e.status !== 'cancelled' && (e.date < today() || e.status !== 'scheduled')).length;
  const wos = S.workouts.filter(w => w.athleteId === a.id && w.date >= from && w.date <= to);
  const woDone = wos.filter(w => w.completed);
  const rpes = woDone.filter(w => w.rpe != null).map(w => w.rpe);
  const vbt = S.vbt.filter(l => l.athleteId === a.id && l.date >= from && l.date <= to);
  const lifts = [...new Set(S.vbt.filter(l => l.athleteId === a.id).map(l => l.exerciseId).concat(S.maxes.filter(m => m.athleteId === a.id).map(m => m.exerciseId)))].map(id => ({ ex: getExercise(id), orm: bestOneRM(a.id, id), sets: vbt.filter(l => l.exerciseId === id) })).filter(x => x.ex && (x.orm || x.sets.length));
  return { a, from, to, inP, metricRows, evs, done, noshow, sched, attend: done + noshow ? Math.round(done / (done + noshow) * 100) : null, wos, woDone, avgRpe: rpes.length ? mean(rpes) : null, vbt, lifts, fp: fpAnalyze(a) };
}
function metricLine(r, name) {
  const d = r.def, ch = r.pct;
  const verb = d.dir === -1 ? (ch < 0 ? 'improved' : 'slowed') : (ch > 0 ? 'improved' : 'dropped');
  return `${name}'s ${d.label.toLowerCase()} ${d.dir === 0 ? 'changed' : verb} from ${fmtMetric(d, r.start.v)} to ${fmtMetric(d, r.last.v)} (${ch > 0 ? '+' : ''}${fmtNum(ch, 1)}%)`;
}
function autoAssessment(D) {
  const name = D.a.firstName;
  const parts = [];
  if (D.sched) parts.push(`Over this period ${name} completed ${D.done} of ${D.sched} scheduled sessions${D.attend != null ? ` (${D.attend}% attendance)` : ''}.`);
  const good = D.metricRows.filter(r => r.cls === 'good' && r.pct != null).sort((x, y) => Math.abs(y.pct) - Math.abs(x.pct));
  const bad = D.metricRows.filter(r => r.cls === 'bad' && r.pct != null);
  const pbs = D.metricRows.filter(r => r.pb);
  if (good.length) parts.push(good.slice(0, 3).map(r => metricLine(r, name)).join('; ') + ' — ' + (good.length > 1 ? 'all larger than normal test-to-test variation.' : 'larger than normal test-to-test variation.'));
  if (pbs.length) parts.push(`New personal bests: ${pbs.map(r => r.def.label).join(', ')}.`);
  const flat = D.metricRows.filter(r => r.cls === 'flat' && r.pct != null && r.def.dir !== 0);
  if (flat.length && !good.length) parts.push(`${name}'s results held steady (${flat.slice(0, 3).map(r => r.def.label).join(', ')}), within normal test-to-test variation.`);
  if (bad.length) parts.push(`${bad.slice(0, 2).map(r => r.def.label).join(' and ')} ${bad.length > 1 ? 'were' : 'was'} lower than the start of the period; we will keep an eye on ${bad.length > 1 ? 'these' : 'this'} and adjust training if the trend continues.`);
  if (!parts.length) parts.push(`${name} is building a baseline — more testing data will make trends visible in the next report.`);
  return parts.join(' ');
}
function autoNext(D) {
  const ins = athleteInsights(D.a).filter(i => i.level === 'warn' || i.level === 'alert' || i.level === 'info').slice(0, 3);
  const items = ins.map(i => `• ${i.action}`);
  D.fp.priorities.slice(0, 2).forEach(p => { if (!items.some(x => x.includes(p))) items.push('• ' + p); });
  return items.slice(0, 4).join('\n') || '• Continue the current program and retest weekly.';
}

let fontCache = null;
const FONT_FILES = [['Bebas Neue', 'bebas-neue', '400'], ['DM Sans', 'dm-sans', '100 1000'], ['DM Serif Display', 'dm-serif-display', '400']];
function fontFaceUrls() { return FONT_FILES.map(([f, n, w]) => `@font-face{font-family:'${f}';src:url('fonts/${n}.woff2') format('woff2');font-weight:${w};font-display:swap}`).join(''); }
async function fontFaceCss() {
  const files = FONT_FILES;
  if (fontCache) return fontCache;
  const parts = await Promise.all(files.map(async ([f, n, w]) => {
    try {
      const b = await (await fetch(`fonts/${n}.woff2`)).blob();
      const d = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
      return `@font-face{font-family:'${f}';src:url('${d}') format('woff2');font-weight:${w}}`;
    } catch { return ''; }
  }));
  return (fontCache = parts.join(''));
}

      ${D.metricRows.map(r => `<tr><td>${esc(r.def.label)}</td><td>${esc(fmtMetric(r.def, r.start.v))}</td><td><b>${esc(fmtMetric(r.def, r.last.v))}</b></td><td>${fmtChange(r)}</td><td>${r.def.dir ? esc(fmtMetric(r.def, r.best)) : '—'}</td><td>${status(r)}</td></tr>`).join('')}

    ${sec.charts && c.metrics?.length ? `<section class="r-sec">${h('Progress over time')}<div class="r-charts">${c.metrics.map(chartFor).join('')}</div></section>` : ''}

/* =========================================================
   Custom tests (created in Settings, no code needed)
   Stored in settings.customMetrics and synced between devices.
   ========================================================= */
const CUSTOM_KINDS = [['number', 'Number (enter a unit)'], ['time', 'Time (seconds)'], ['len', 'Height / distance (in or cm)'], ['mass', 'Weight (lb or kg)']];
function customMetricDefs() { return Array.isArray(S.settings.customMetrics) ? S.settings.customMetrics : []; }
function customKeys() { return customMetricDefs().map(c => c.key); }
/* Rebuild the custom entries in METRICS / M from settings (call after load, settings change or sync) */
function registerCustomMetrics() {
  for (let i = METRICS.length - 1; i >= 0; i--) if (METRICS[i].custom) { delete M[METRICS[i].key]; METRICS.splice(i, 1); }
  if (!TEST_CATS.some(c => c.key === 'custom')) TEST_CATS.splice(TEST_CATS.findIndex(c => c.key === 'derived'), 0, { key: 'custom', label: 'Custom tests', color: '#0f766e' });
  const calcAt = METRICS.findIndex(m => m.calc);
  customMetricDefs().forEach((c, i) => {
    const def = { key: c.key, cat: c.cat || 'custom', label: c.label, dir: c.dir ?? 1, dec: c.dec ?? 2, te: c.te ?? null, custom: true };
    if (c.kind === 'len') def.kind = 'len';
    else if (c.kind === 'mass') def.kind = 'mass';
    else def.unit = c.kind === 'time' ? 's' : (c.unit || '');
    METRICS.splice(calcAt + i, 0, def);
    M[c.key] = def;
  });
}
function groupMetrics() { return [...GROUP_METRICS, ...customKeys()]; }

A.customTests = () => {
  const list = () => customMetricDefs().map(c => {
    const n = S.tests.filter(t => t.m?.[c.key] != null).length;
    return `<div class="row"><span class="row-main"><span class="row-title">${esc(c.label)}</span><span class="row-sub">${esc(TEST_CATS.find(x => x.key === (c.cat || 'custom'))?.label || 'Custom tests')} · ${esc(c.kind === 'number' ? (c.unit || 'no unit') : CUSTOM_KINDS.find(k => k[0] === c.kind)[1])} · ${c.dir === -1 ? 'lower is better' : c.dir === 0 ? 'no better/worse' : 'higher is better'} · ${plural(n, 'result')}</span></span><button type="button" class="btn sm" data-ced="${c.key}">${icon('edit', 'sm')}Edit</button></div>`;
  }).join('') || '<div class="muted small" style="padding:8px 0">No custom tests yet.</div>';
  const m = openModal({
    title: 'Custom tests', size: 'wide',
    body: `<p class="muted small">Add any test you run — e.g. “Med ball chest throw”, “5-0-5 left”, “Grip strength”. Custom tests appear in test entry, group testing, gym-floor quick tests, trend charts, the leaderboard, GSP records, reports, CSV import and export.</p>
      <div class="list" id="ctList">${list()}</div>
      <button type="button" class="btn primary" style="margin-top:12px" data-cnew>${icon('plus', 'sm')}New custom test</button>`,
  });
  m.wrap.addEventListener('click', e => {
    if (e.target.closest('[data-cnew]')) editCustomTest(null, () => { $('#ctList', m.wrap).innerHTML = list(); });
    const b = e.target.closest('[data-ced]');
    if (b) editCustomTest(customMetricDefs().find(c => c.key === b.dataset.ced), () => { $('#ctList', m.wrap).innerHTML = list(); });
  });
};
function editCustomTest(c, done) {
  const isNew = !c;
  const x = c || { label: '', cat: 'custom', kind: 'number', unit: '', dir: 1, dec: 2, te: 5 };
  const used = isNew ? 0 : S.tests.filter(t => t.m?.[x.key] != null).length;
  openModal({
    title: isNew ? 'New custom test' : 'Edit custom test', size: 'narrow', center: true,
    body: `${field('Test name', inp('label', x.label, 'autofocus placeholder="e.g. Med ball chest throw"'))}
      ${field('Section', sel('cat', TEST_CATS.filter(t => !['derived', 'body'].includes(t.key)).map(t => [t.key, t.label]), x.cat || 'custom'))}
      ${field('Type of result', sel('kind', CUSTOM_KINDS, x.kind, used ? 'disabled' : ''), { hint: used ? 'Can’t change once results are entered.' : 'Height/distance and weight follow your lb/in or kg/cm setting.' })}
      ${field('Unit', inp('unit', x.unit, 'placeholder="e.g. m, reps, kg, N"'), { hint: 'Only used for “Number”.' })}
      ${field('Which is better?', segmented('dir', [['1', 'Higher'], ['-1', 'Lower'], ['0', 'Neither']], String(x.dir)))}
      <div class="fields">${field('Decimal places', sel('dec', [['0', '0'], ['1', '1'], ['2', '2'], ['3', '3']], String(x.dec)))}
      ${field('Typical test noise', numInp('te', x.te ?? ''), { unit: '%', hint: 'Changes smaller than this show as “within noise”. 5% if unsure.' })}</div>`,
    onSubmit: v => {
      const label = v.label.trim();
      if (!label) return 'Give the test a name.';
      if (METRICS.some(m => m.label.toLowerCase() === label.toLowerCase() && m.key !== x.key)) return 'A test with that name already exists.';
      const te = num(v.te);
      if (v.te.trim() && (te == null || te < 0 || te > 100)) return 'Typical noise should be 0–100%.';
      const rec = { key: x.key || 'c_' + uid(), label, cat: v.cat, kind: used ? x.kind : v.kind, unit: v.unit.trim(), dir: +v.dir, dec: +v.dec, te: te ?? null };
      const arr = customMetricDefs().filter(o => o.key !== rec.key);
      S.settings.customMetrics = isNew ? [...arr, rec] : customMetricDefs().map(o => (o.key === rec.key ? rec : o));
      registerCustomMetrics(); persist(); recordBaseline();
      toast(isNew ? 'Custom test added' : 'Saved'); done?.(); refresh();
    },
    onDelete: isNew ? null : async () => {
      if (!(await confirmBox(`Delete “${x.label}”?`, used ? `${plural(used, 'result')} will be hidden (not erased) — re-create a test with the same name won’t bring them back.` : ''))) return false;
      S.settings.customMetrics = customMetricDefs().filter(o => o.key !== x.key);
      registerCustomMetrics(); persist(); recordBaseline(); done?.(); refresh();
    },
  });
}

/* =========================================================
   Operations: encrypted iPhone ↔ Mac sync (private GitHub repo),
   weekly backup routine, CSV import (OVR Connect etc.), gym-floor mode
   ========================================================= */

/* ---------- Byte helpers ---------- */
function bytesToB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(b64) {
  const s = atob(String(b64).replace(/\s+/g, ''));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function gzip(bytes, inflate) {
  const cs = inflate ? new DecompressionStream('gzip') : new CompressionStream('gzip');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
  return new Uint8Array(buf);
}

/* ---------- End-to-end encryption (AES-GCM, key from passphrase via PBKDF2) ---------- */
const Crypt = {
  ITER: 310000,
  async key(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: this.ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async seal(obj, key, salt) {
    let bytes = new TextEncoder().encode(JSON.stringify(obj));
    const gz = typeof CompressionStream !== 'undefined';
    if (gz) bytes = await gzip(bytes);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
    return { app: 'performance-hq', v: 1, kdf: 'PBKDF2-SHA256', iter: this.ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), gz, ct: bytesToB64(ct), at: Date.now() };
  },
  async open(env, key) {
    let bytes;
    try { bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(env.iv) }, key, b64ToBytes(env.ct))); }
    catch { throw new Error('Wrong sync passphrase — use the same passphrase on every device.'); }
    if (env.gz) {
      if (typeof DecompressionStream === 'undefined') throw new Error('This browser is too old to read the sync file — update iOS/macOS.');
      bytes = await gzip(bytes, true);
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  },
};

/* ---------- GitHub contents API ---------- */

/* Make the restored version authoritative everywhere: stamp its records as newest and tombstone anything newer */
async function restoreVersion(data) {
  const now = Date.now();
  const keep = Object.fromEntries([...LOCAL_ONLY, ...LOCK_KEYS].map(k => [k, S.settings[k]]));
  const keepIds = new Set(COLS.flatMap(c => data[c].map(r => r.id)));
  const deleted = { ...data.deleted };
  COLS.forEach(c => S[c].forEach(r => { if (!keepIds.has(r.id)) deleted[r.id] = now; }));
  COLS.forEach(c => data[c].forEach(r => { r.updatedAt = now; delete deleted[r.id]; }));
  S = data;
  S.deleted = deleted;
  Object.assign(S.settings, keep, { onboarded: true });
  S.settingsAt = now;
  registerCustomMetrics(); lastSharedSig = sharedSettingsSig(); recordBaseline();
  await flush();
  Sync.meta.sha = null; Sync.meta.sig = null;
  await Sync.run({ manual: true });
  applyTheme(); updateBrand(); toast('Version restored'); refresh();
}

const LB_EXCLUDE = new Set([...ASYM_KEYS, 'ttt', 'djGct', 'brakeTime', 'imtpTtpf', 'f100Pct', 'dropBox', 'peakLandF', 'propTime', 'cmDepth', 'bm', 'dsi']);
const LB_POPULAR = ['sprint10', 'sprint10yd', 'sprint20', 'sprint40yd', 'fly10', 'fly10yd', 'vmax', 'proAgility', 'cmj', 'vj', 'broad', 'rsiMod', 'djRsi', 'imtpRel'];
const AGE_GROUPS = [['all', 'All ages'], ['u12', '12 & under'], ['13', '13–14'], ['15', '15–16'], ['17', '17–18'], ['19', '19+']];
function ageGroupOf(age) { return age == null ? null : age <= 12 ? 'u12' : age <= 14 ? '13' : age <= 16 ? '15' : age <= 18 ? '17' : '19'; }
function ageAt(dob, date) {
  if (!isDS(dob) || !isDS(date)) return null;
  const b = parseDS(dob), d = parseDS(date);
  let a = d.getFullYear() - b.getFullYear();
  if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--;
  return a;
}
function lbMetricDefs() {
  const tests = METRICS.filter(m => m.dir !== 0 && !LB_EXCLUDE.has(m.key)).map(m => ({ key: m.key, label: m.label, cat: TEST_CATS.find(c => c.key === m.cat)?.label || '', dir: m.dir, fmt: v => fmtMetric(m, v) }));
  const lifts = [...new Set(S.maxes.map(x => x.exerciseId))].map(getExercise).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name)).flatMap(ex => [
    { key: 'lift:' + ex.id, label: `${ex.name} 1RM`, cat: 'Strength (tested 1RM)', dir: 1, fmt: v => fmtMass(v) },
    { key: 'rel:' + ex.id, label: `${ex.name} 1RM ÷ body mass`, cat: 'Strength (tested 1RM)', dir: 1, fmt: v => fmtNum(v, 2) + ' × BW' },
  ]);
  return [...tests, ...lifts];
}
function lbDef(key) { return lbMetricDefs().find(d => d.key === key); }
function bodyMassOn(aid, date) {
  const t = testsFor(aid).filter(x => x.bodyMassKg && x.date <= date).pop() || testsFor(aid).find(x => x.bodyMassKg);
  return t?.bodyMassKg ?? getAthlete(aid)?.massKg ?? null;
}
/* Every result for a metric: { aid, v, date, at } */
function lbEntries(key) {
  if (key.startsWith('lift:') || key.startsWith('rel:')) {
    const exId = key.split(':')[1], rel = key.startsWith('rel:');
    return S.maxes.filter(x => x.exerciseId === exId && x.kg > 0 && getAthlete(x.athleteId)).map(x => {
      const bm = rel ? bodyMassOn(x.athleteId, x.date) : null;
      return { aid: x.athleteId, v: rel ? (bm ? x.kg / bm : null) : x.kg, date: x.date, at: x.createdAt || 0 };
    }).filter(e => e.v != null);
  }
  const out = [];
  S.tests.forEach(t => {
    if (!getAthlete(t.athleteId)) return;
    let tm = TM_CACHE.get(t);
    if (!tm) { tm = testMetrics(t); TM_CACHE.set(t, tm); }
    const v = tm[key];
    if (v != null && Number.isFinite(v) && v > 0) out.push({ aid: t.athleteId, v, date: t.date, at: t.createdAt || 0 });
  });
  return out;
}
const TM_CACHE = new WeakMap();
const better = (dir, a, b) => (dir === -1 ? a < b : a > b);
function lbFilter(entries, f) {
  return entries.filter(e => {
    const a = getAthlete(e.aid);
    if (!f.archived && a.archived) return false;
    if (f.sex !== 'all' && a.sex !== f.sex) return false;
    if (f.sport !== 'all' && (a.sport || '') !== f.sport) return false;
    if (f.age !== 'all' && ageGroupOf(ageAt(a.dob, e.date)) !== f.age) return false;
    if (f.period !== 'all' && e.date < addDays(today(), -(+f.period))) return false;

}
function lbRank(entries, dir) {
  const best = new Map();
  entries.forEach(e => { const b = best.get(e.aid); if (!b || better(dir, e.v, b.v) || (e.v === b.v && e.date < b.date)) best.set(e.aid, e); });
  return [...best.values()].sort((x, y) => (dir === -1 ? x.v - y.v : y.v - x.v) || x.date.localeCompare(y.date));
}
/* Chronological record progression for one metric */
function recordHistory(key, dir, entries) {
  const list = [...entries].sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
  const out = []; let best = null;
  list.forEach(e => { if (!best || better(dir, e.v, best.v)) { out.push({ ...e, prev: best }); best = e; } });

/* ---------- New-record detection (runs after every save) ---------- */
let RECORD_BASE = null;
function currentRecords() {
  const map = {};
  lbMetricDefs().forEach(d => { const r = lbRank(lbEntries(d.key), d.dir)[0]; if (r) map[d.key] = r; });
  return map;
}
function recordBaseline() { try { RECORD_BASE = currentRecords(); } catch (e) { RECORD_BASE = {}; } }

  RECORD_BASE = now;

  const out = { lift, mvt: m.mvt, mvtSource: m.source, mvtNote: m.note, n: pts.length, loadsN, excluded: logs.length - q.length, e1rm: null, quality: null };

  const e = size - 0, s0 = 0;

  svg += tri([[s0, s0], [e, s0], [c, c]], PROFILES.elastic.color) + tri([[s0, e], [e, e], [c, c]], PROFILES.strength.color) + tri([[s0, s0], [s0, e], [c, c]], PROFILES.eccentric.color) + tri([[e, s0], [e, e], [c, c]], PROFILES.concentric.color);
  svg += `<line x1="0" y1="0" x2="${size}" y2="${size}" class="q-diag"/><line x1="${size}" y1="0" x2="0" y2="${size}" class="q-diag"/>`;
  svg += `<line x1="${c}" y1="8" x2="${c}" y2="${size - 8}" class="q-axis"/><line x1="8" y1="${c}" x2="${size - 8}" y2="${c}" class="q-axis"/>`;
  svg += `<rect x="${c - u}" y="${c - u}" width="${2 * u}" height="${2 * u}" class="q-thr"/>`;
  svg += `<circle cx="${c}" cy="${c}" r="${0.5 * u}" class="q-bal"/>`;
  const lab = (x, y, t, col, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="q-lab" style="fill:${col}">${t}</text>`;
  svg += lab(c, 26, 'ELASTIC', PROFILES.elastic.color) + lab(c, size - 14, 'STRENGTH', PROFILES.strength.color) + lab(14, c - 8, 'ECCENTRIC', PROFILES.eccentric.color, 'start') + lab(size - 14, c - 8, 'CONCENTRIC', PROFILES.concentric.color, 'end');
  svg += `<text x="${c + u + 4}" y="${c - u - 4}" class="q-tick">DSI 0.80 · EUR 1.00</text>`;
  if (points.length > 1) svg += `<polyline points="${points.map(p => P(p).join(',')).join(' ')}" class="q-trail"/>`;

/* ---- 89r-rir.js ---- */
/* =========================================================
   Reps in reserve (RIR) ↔ bar velocity
   A rep's mean velocity shows roughly how many reps are left in the set. The velocities are
   similar whatever the load, but specific to each lift (Morán-Navarro et al. 2019).
   Back squat default = the coach's GSP reference chart. Other lifts are entered by the coach.
   Each athlete is personalised from their own logged sets (last-rep velocity + RPE).
   ========================================================= */
Object.assign(REFS, {
  moran2019: { cite: 'Morán-Navarro R, Martínez-Cava A, Sánchez-Medina L, Mora-Rodríguez R, González-Badillo JJ, Pallarés JG. Movement velocity as a measure of level of effort during resistance exercise. J Strength Cond Res. 2019;33(6):1496–1504.', what: 'Sets to failure at 65%, 75% and 85% 1RM: the velocity at which a given number of reps remained (RIR) was very similar whatever the load and training level (CV 4.4–8%), but differed between exercises.' },
  rodriguezrosell2020: { cite: 'Rodríguez-Rosell D, Yáñez-García JM, Sánchez-Medina L, Mora-Custodio R, González-Badillo JJ. Relationship between velocity loss and repetitions in reserve in the bench press and back squat exercises. J Strength Cond Res. 2020;34(9):2537–2547.', what: 'Velocity loss within a set closely tracks the reps left in reserve in the back squat and bench press.' },
  peerj2025: { cite: 'PeerJ. 2025 study (article 19797, published 15 August 2025) on lifting velocity and repetitions in reserve in the bench press and squat. https://peerj.com/articles/19797', what: 'The velocity–RIR relationship depends on the exercise and varies a lot between individuals, so individual adjustment is recommended.' },
});

const RIR_MAX = 5;
const RIR_LIFTS = ['squat', 'fsquat', 'bench', 'tbdl'];
/* Back squat: coach's GSP reference chart. rir[q] = [low, high] m/s of a rep with q reps left;
   pct = max-intent mean velocity of the first rep at each %1RM. */
const RIR_DEFAULT_TABLES = {
  squat: {
    rir: [[0.35, 0.40], [0.41, 0.46], [0.48, 0.52], [0.52, 0.59], [0.59, 0.65], [0.65, 0.68]],
    pct: [[35, 0.97], [40, 0.95], [45, 0.93], [50, 0.90], [55, 0.86], [60, 0.81], [65, 0.75], [70, 0.72], [75, 0.69], [80, 0.63], [85, 0.56], [90, 0.50], [95, 0.44], [100, 0.35]],
    source: 'GSP reference chart (back squat)',
  },
};
function rirTable(lift) {
  const own = S.settings.rirTables?.[lift];
  if (own?.rir?.length === RIR_MAX + 1) return { rir: own.rir, pct: own.pct?.length >= 2 ? own.pct : null, source: own.source || 'Coach-entered chart', custom: true };
  const d = RIR_DEFAULT_TABLES[lift];
  return d ? { ...d, custom: false } : null;
}

/* ---------- Chart maths ---------- */
const bandMid = b => (b[0] + b[1]) / 2;
function bandAt(bands, q) {
  q = clamp(q, 0, RIR_MAX);
  const i = Math.min(Math.floor(q), RIR_MAX - 1), f = q - i;
  return [bands[i][0] + (bands[i + 1][0] - bands[i][0]) * f, bands[i][1] + (bands[i + 1][1] - bands[i][1]) * f];
}
function rirVel(bands, q) { return bandMid(bandAt(bands, q)); }
/* Reps left after a rep at velocity v (continuous; 5 means "5 or more") */
function rirFromVel(bands, v) {
  const mids = bands.map(bandMid);
  if (v <= mids[0]) return 0;
  if (v >= mids[RIR_MAX]) return RIR_MAX;
  for (let i = 0; i < RIR_MAX; i++) if (v <= mids[i + 1]) return i + (v - mids[i]) / (mids[i + 1] - mids[i]);
  return RIR_MAX;
}
/* First-rep velocity at a %1RM from the chart (null outside it) */
function velAtPct(pct, pc) {
  if (!pct || pct.length < 2 || !(pc > 0)) return null;
  const s = [...pct].sort((a, b) => a[0] - b[0]);
  if (pc < s[0][0] - 2.5 || pc > 102) return null;
  if (pc <= s[0][0]) return s[0][1];
  if (pc >= s[s.length - 1][0]) return s[s.length - 1][1];
  for (let i = 0; i < s.length - 1; i++) if (pc <= s[i + 1][0]) return s[i][1] + (s[i + 1][1] - s[i][1]) * (pc - s[i][0]) / (s[i + 1][0] - s[i][0]);

}
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

/* ---------- Athlete model: chart shifted by the athlete's own logged sets ---------- */
/* Each logged set with every rep's velocity and an RPE of 5–10 gives one point: last-rep velocity at RIR = 10 − RPE */
function rirPairs(aid, exId, days = 180) {
  const since = addDays(today(), -days), out = [];
  S.workouts.filter(w => w.athleteId === aid && w.log && w.date >= since).forEach(w => (w.items || []).filter(it => it.exerciseId === exId).forEach(it => (w.log[it.id] || []).forEach(r => {
    if (r.rpe == null || r.rpe < 10 - RIR_MAX || r.rpe > 10) return;
    const v = parseVels(r.vels);
    if (!v.length || (r.reps != null && v.length < r.reps)) return;
    out.push({ v: v[v.length - 1], rir: 10 - r.rpe, date: w.date, load: r.load });

function rirModel(aid, exId) {
  const lift = e1rmLiftOf(getExercise(exId));
  const tab = lift ? rirTable(lift) : null;
  if (!tab) return null;
  const pairs = aid ? rirPairs(aid, exId) : [];
  const res = pairs.map(p => p.v - rirVel(tab.rir, p.rir));
  const off = res.length >= 3 ? mean(res) : null;
  const personal = off != null && Math.abs(off) <= 0.2;
  const shift = personal ? off : 0;
  return {
    lift, bands: tab.rir.map(b => [b[0] + shift, b[1] + shift]), chart: tab.rir, pct: tab.pct, source: tab.source, custom: tab.custom,
    personal, shift, n: pairs.length, spread: res.length >= 3 ? sd(res) : null, odd: off != null && !personal,
  };
}
/* Rep-1 velocity at a load: athlete's own load–velocity profile first, else the %1RM chart */
function firstRep(aid, exId, { kg = null, pc = null } = {}, model = null) {
  if (aid && kg > 0) {
    const logs = lvProfile(aid, exId, { from: addDays(today(), -84) }).logs.filter(velocityQualified);
    const pts = logs.map(l => ({ x: l.load, y: l.vBest }));
    if (new Set(pts.map(q => round(q.x, 1))).size >= 3) {
      const reg = linreg(pts);

/* ---------- Planning a set: n reps leaving `rir` in reserve ----------

/* ---------- Reading a logged set ---------- */
/* Each-rep entry: reps left after the last rep. Set-average entry: the RIR whose expected
   set average (from rep 1 at this load) matches the logged average. */
function rirOfSet(model, { vels = [], avg = null, reps = null, kg = null, aid = null, exId = null } = {}) {
  if (!model) return null;
  if (vels.length) {
    if (reps != null && vels.length < reps) return null;   // not every rep entered: the last value isn't the last rep
    const v = vels[vels.length - 1];
    return { rir: rirFromVel(model.bands, v), plus: v >= rirVel(model.bands, RIR_MAX), from: 'last', v };
  }
  if (!(avg > 0) || !(reps >= 1)) return null;
  const fr = firstRep(aid, exId, { kg }, model);
  if (!fr) return null;
  const avgAt = r => mean(repTargets(model.bands, reps, r, fr.v).map(x => x.v));
  if (avg < avgAt(0) - 0.02) return { rir: 0, from: 'avg', below: true };
  for (let r = 0; r <= 8; r += 0.25) if (avgAt(r) >= avg) return { rir: Math.min(r, RIR_MAX), plus: r >= RIR_MAX, from: 'avg' };

  if (!est) return '';

  const txt = est.below ? 'slower than the 0-RIR band' : `≈${est.plus ? '5+' : fmtNum(Math.round(est.rir), 0)} RIR`;
  let cls = '', note = '';

    const stopHi = bandAt(model.bands, target)[1];

    if (hit >= 0 && hit < vels.length - 1) stopNote = ` · <b class="vl-warn">stop speed reached at rep ${hit + 1}</b>`;
  }

/* ---- 89s-pct.js ---- */
/* =========================================================
   Percentiles: where an athlete stands on a test, compared with
   (1) GSP athletes of the same sex and age group (and sport when there are enough), and
   (2) published norm tables the coach loads, each with its citation.
   Nothing here is typed from memory: GSP percentiles are exact ranks in your own data,
   and published percentiles only exist for tables you load.

const PCT_LEVELS = [['auto', 'Best match (sex + age group, + sport if 5+)'], ['sas', 'Same sex, age group & sport'], ['sa', 'Same sex & age group'], ['s', 'Same sex, all ages'], ['all', 'All GSP athletes']];

const NORM_PS = [5, 10, 25, 50, 75, 90, 95];
/* Published tables bundled with the app. Each needs the full citation in `source`. */

function pctOut(key, v) { const k = pctKind(key); return k === 'len' ? U.lenOut(v) : k === 'mass' ? U.massOut(v) : v; }

/* One value per athlete (latest, best in 12 months, or all-time best), with age and group at that test date */
function pctPool(key, basis = 'latest') {
  const d = lbDef(key);
  if (!d) return [];
  const per = new Map(), since = addDays(today(), -365);
  lbEntries(key).forEach(e => {
    if (basis === 'best12' && e.date < since) return;
    const c = per.get(e.aid);
    if (!c || (basis === 'latest' ? e.date > c.date || (e.date === c.date && e.at > c.at) : better(d.dir, e.v, c.v))) per.set(e.aid, e);
  });

    const a = getAthlete(e.aid), age = ageAt(a.dob, e.date);
    return { ...e, a, age, ag: ageGroupOf(age), sex: a.sex === 'M' || a.sex === 'F' ? a.sex : '', sport: (a.sport || '').trim().toLowerCase() };
  });
}
const PEER = {
  sas: me => p => p.sex === me.sex && p.ag === me.ag && p.sport === me.sport,
  sa: me => p => p.sex === me.sex && p.ag === me.ag,
  s: me => p => p.sex === me.sex,

/* Percentile rank = (results worse + ½ × equal results) ÷ group size × 100 */

function normTablesAll() { return [...NORMS_BUILTIN, ...(S.settings.normTables || [])]; }
function normFor(key, me) {

    && (!t.sport || t.sport.trim().toLowerCase() === me.sport));

    const pts = NORM_PS.map((p, j) => [p, c[3 + j] ? num(c[3 + j]) : null]).filter(x => x[1] != null).map(([p, x]) => [p, conv(x)]);
    const e = normCheck(key, pts);

/* ---- 89u-stim.js ---- */
/* =========================================================
   Training stimulus: what the athlete's program is emphasising
   Every programmed set is classified from exercise type, reps, %1RM (given or estimated)
   and proximity to failure (RIR / RPE, or estimated from reps at that %1RM), using the

  schoenfeld2017: { cite: 'Schoenfeld BJ, Grgic J, Ogborn D, Krieger JW. Strength and hypertrophy adaptations between low- vs. high-load resistance training: a systematic review and meta-analysis. J Strength Cond Res. 2017;31(12):3508–3523.', what: 'Light and heavy loads build similar muscle when sets are taken close to failure; heavy loads build more maximal strength.' },
  refalo2023: { cite: 'Refalo MC, Helms ER, Trexler ET, Hamilton DL, Fyfe JJ. Influence of resistance training proximity-to-failure on skeletal muscle hypertrophy: a systematic review with meta-analysis. Sports Med. 2023;53(3):649–665.', what: 'Hypertrophy depends on sets being reasonably close to failure (roughly within a few reps in reserve).' },
  suchomel2018: { cite: 'Suchomel TJ, Nimphius S, Bellon CR, Stone MH. The importance of muscular strength: training considerations. Sports Med. 2018;48(4):765–785.', what: 'Strength underpins power; combine heavy strength work with ballistic and weightlifting-derivative training.' },

  { key: 'hyp', label: 'Hypertrophy', color: '#8b4ef3', what: '6–12 reps at ≈67–85% 1RM, or lighter loads close to failure' },
  { key: 'spd', label: 'Speed & reactive', color: '#2f5bff', what: 'sprints, jumps and plyometrics' },

  const reps = planReps(it), cat = ex.category;

  if (['Core', 'Mobility & prep', 'Conditioning', 'Other'].includes(cat)) return { ...out, key: 'gen', why: cat.toLowerCase() };

  out.push(`<b>Main focus: ${esc(main.label.toLowerCase())}</b>${second ? ` with ${esc(second.label.toLowerCase())}` : ''}, ${esc(main.what)}.`);
  if (s.prev.work >= 6) {

    out.push(d.length ? `Trend vs previous 4 weeks: ${d.map(o => `${o.d > 0 ? 'more' : 'less'} ${esc(o.x.label.toLowerCase())} (${o.d > 0 ? '+' : '−'}${fmtNum(Math.abs(o.d), 0)} pts)`).join(', ')}.` : 'Trend vs previous 4 weeks: similar emphasis.');

/* =========================================================

   Claude searches the literature (web search), opens and reads the key sources (web fetch),
   cross-checks and appraises them, then answers with references. The app then checks every
   reference link against the pages actually found or opened during that research.
   No athlete data is sent. Needs an Anthropic API key and an internet connection.

const RS = { msgs: [], busy: false, live: null, abort: null, loaded: false };
const RS_MAX_CONTINUE = 4;

  'Is plyometric training safe and effective for 10–13 year olds?',

  'How should strength training change around peak height velocity?',

function researchSystemPrompt() {
  return `You are the research assistant in ${bizName()}'s private coaching app: a strength and conditioning scientist and experienced coach, expert at finding, reading and critically appraising sport-science research. The coach mostly trains youth athletes (10–18) for speed, strength, power and jumping, using velocity-based training and OVR force plates.

Before answering any question that depends on evidence:
1. Pin down the question: population (age, sex, training level, sport), intervention or exposure, comparison and outcome.
2. Search for the best available evidence. Prefer systematic reviews and meta-analyses and position statements (e.g. NSCA, ACSM, UKSCA, IOC), then randomized controlled trials, then other studies. Prefer peer-reviewed journals, PubMed/PMC, DOI and journal pages over blogs, commercial or social-media sources.
3. Open the key sources and confirm they say what you will claim: read the abstract and results, not only the title. Check important claims against at least two independent sources when they exist. When sources disagree, explain why (population, methods, training status, outcome measures).
4. Appraise each key source: design, sample size and population, effect sizes and practical relevance, limitations and how recent it is. Say when youth data are lacking and you are extrapolating from adults.
5. Then write the answer.

Answer format (it is read on a phone; keep it tight):
**Bottom line:** 2–4 sentences.
**What the research shows:** short bullets, each with author and year.
**How to apply it:** specific, practical guidance for youth athletes when relevant (sets, reps, intensity, frequency, progressions, safety).
**Certainty:** High, Moderate, Low or Very low, with one line on why.
**References:** a numbered list, each as Authors (Year). Title. Journal. followed by a markdown link [link](URL) to the exact page you found or opened.

Rules:
- Never invent studies, authors, numbers, quotes or links. Only list references you found or opened while researching this question. If you mention something from memory that you could not find, mark it "(not verified)".
- If the evidence is thin, mixed or absent, say so plainly rather than overstating it.
- Simple definitions or arithmetic don't need a search.
- No medical diagnosis: for pain, injury or medical conditions give general information and recommend a physician or physical therapist.
- Where the evidence allows, align practical advice with the coach's philosophy below.

Coach's training philosophy:
${philosophyText()}`;
}

/* ---------- Streaming with full content-block reconstruction (needed to resume a paused turn) ---------- */
async function rsStream(body, onEvent, signal) {
  const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: claudeHeaders(), body: JSON.stringify({ ...body, stream: true }), signal });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); msg = j.error?.message || msg; } catch { }
    if (res.status === 401) msg = 'The API key was rejected. Check it in console.anthropic.com.';
    if (res.status === 429) msg = 'Rate limited. Wait a moment and try again.';
    if (res.status === 529) msg = 'Claude is busy right now. Try again in a minute.';
    throw new Error(msg);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  const msg = { content: [], stop_reason: null, stop_details: null, usage: null };
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      if (ev.type === 'message_start') msg.usage = ev.message?.usage || null;
      else if (ev.type === 'content_block_start') {
        const b = JSON.parse(JSON.stringify(ev.content_block || {}));
        if (b.type === 'server_tool_use' || b.type === 'tool_use') b._json = '';
        msg.content[ev.index] = b;
      } else if (ev.type === 'content_block_delta') {
        const b = msg.content[ev.index], d = ev.delta || {};
        if (!b) continue;
        if (d.type === 'text_delta') b.text = (b.text || '') + d.text;
        else if (d.type === 'citations_delta') (b.citations ||= []).push(d.citation);
        else if (d.type === 'input_json_delta') b._json = (b._json || '') + (d.partial_json || '');
        else if (d.type === 'thinking_delta') b.thinking = (b.thinking || '') + d.thinking;
        else if (d.type === 'signature_delta') b.signature = d.signature;
      } else if (ev.type === 'content_block_stop') {
        const b = msg.content[ev.index];
        if (b && '_json' in b) { try { b.input = b._json ? JSON.parse(b._json) : (b.input || {}); } catch { b.input = b.input || {}; } delete b._json; }
      } else if (ev.type === 'message_delta') {
        if (ev.delta?.stop_reason) msg.stop_reason = ev.delta.stop_reason;
        if (ev.delta?.stop_details) msg.stop_details = ev.delta.stop_details;
        if (ev.usage) msg.usage = { ...(msg.usage || {}), ...ev.usage };
      } else if (ev.type === 'error') throw new Error(ev.error?.message || 'Stream error');
      onEvent?.(ev, msg);
    }
  }
  msg.content = msg.content.filter(Boolean);
  return msg;
}

/* ---------- Turning the response blocks into an answer + its evidence trail ---------- */
function rsNormUrl(u) {

  let lastTool = -1;
  blocks.forEach((b, i) => {
    if (b.type === 'server_tool_use') {
      lastTool = i;
      if (b.name === 'web_search' && b.input?.query) searches.push(b.input.query);
    } else if (b.type === 'web_search_tool_result') {
      lastTool = i;
      if (Array.isArray(b.content)) b.content.forEach(r => { if (r?.url && /^https?:/i.test(r.url)) found.set(rsNormUrl(r.url), { url: r.url, title: r.title || r.url }); });

    } else if (b.type === 'web_fetch_tool_result') {
      lastTool = i;
      const c = b.content;
      if (c?.type === 'web_fetch_result' && /^https?:/i.test(c.url || '')) {

        fetched.push(doc); found.set(rsNormUrl(c.url), doc);

    } else if (b.type !== 'text' && b.type !== 'thinking' && b.type !== 'redacted_thinking') lastTool = i;

/* Every link in the answer is checked against the pages found or opened during this research */

    ${m.fetched.length ? `<div class="kicker" style="margin-top:8px">Read in full</div><ol>${m.fetched.map(d => `<li><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.title)}</a></li>`).join('')}</ol>` : ''}
    ${allCites.length ? `<div class="kicker" style="margin-top:8px">Passages cited (↗ in the answer)</div><ol>${allCites.map(c => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title)}</a>${c.quote ? `<div class="faint tiny">“${esc(c.quote)}”</div>` : ''}</li>`).join('')}</ol>` : ''}
